<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCENSION — Year Journal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap">
<style>
:root{--bg:#f6f6f4;--fg:#0c0c0c;--mut:#8a8a86;--line:#d9d9d5;--card:#fff;--soft:#ecece8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#f2f2f0;--mut:#77776f;--line:#252525;--card:#111;--soft:#161616}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f2f2f0;--mut:#77776f;--line:#252525;--card:#111;--soft:#161616}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:1180px;margin:0 auto;padding:36px 22px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--fg);padding-bottom:18px}
h1{margin:0;font-weight:800;font-size:clamp(38px,8vw,84px);letter-spacing:-.045em;line-height:.9}
.yr{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.35em;color:var(--mut);margin-top:12px}
.yr b{color:var(--fg);font-weight:500}
.tag{color:var(--mut);margin-top:6px}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--fg)}
.ico{padding:2px 9px}
.tools{display:flex;flex-direction:column;align-items:flex-end;gap:6px}.tb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.msg{font-size:11px;color:var(--mut);min-height:16px;text-align:right}
button.warn{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.c.s{border:1.5px solid var(--fg)}
.sig{margin-top:38px}.sr{display:grid;grid-template-columns:80px 1fr 170px;gap:12px;align-items:center;font-size:12px}
.sb{height:6px;background:var(--line);border-radius:3px;position:relative}.sb i{position:absolute;left:0;top:0;bottom:0;background:var(--fg);border-radius:3px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:100px}.wk div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--mut);gap:4px}
.wk i{width:100%;background:var(--fg);border-radius:3px 3px 0 0;display:block;min-height:2px}
.seal{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);word-break:break-all}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:22px 0 10px;border-bottom:1px solid var(--line)}
.stat{padding:0 0 16px}
.stat b{display:block;font-size:clamp(22px,4vw,34px);font-weight:300;letter-spacing:-.03em}
.stat span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.bar{height:2px;background:var(--line);margin:0 0 30px}.bar i{display:block;height:100%;background:var(--fg)}
.wrap{overflow-x:auto;padding-bottom:6px}
.grid{display:grid;grid-template-columns:44px repeat(31,minmax(20px,1fr));gap:3px;min-width:760px}
.mo{font-size:10px;letter-spacing:.2em;color:var(--mut);align-self:center;text-transform:uppercase}
.hd{font-size:9px;color:var(--mut);text-align:center}
.c{aspect-ratio:1;border-radius:3px;border:1px solid var(--line);background:var(--soft);padding:0;position:relative;min-height:20px}
.c.f{border-color:transparent;background:color-mix(in srgb,var(--fg) var(--p,12%),transparent)}
.c.t{outline:1.5px solid var(--fg);outline-offset:1.5px}
.c.x{visibility:hidden}
.c.f::after{content:"";position:absolute;inset:auto 3px 3px auto;width:3px;height:3px;border-radius:50%;background:var(--bg);opacity:.9}
.c:hover{border-color:var(--fg)}
.lg{display:flex;gap:6px;align-items:center;margin-top:16px;font-size:10px;letter-spacing:.15em;color:var(--mut);text-transform:uppercase}
.lg i{width:12px;height:12px;border-radius:2px;display:inline-block;background:color-mix(in srgb,var(--fg) var(--p),transparent)}
footer{margin-top:60px;text-align:center;font-size:10px;letter-spacing:.4em;color:var(--mut)}
#md{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 14px max(16px,env(safe-area-inset-bottom,0px));z-index:9}
#md[hidden]{display:none}
.sheet{max-width:920px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h2{margin:0;font-size:clamp(24px,5vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1}
.top small{color:var(--mut);letter-spacing:.2em;font-size:11px;text-transform:uppercase}
.nav{display:flex;gap:6px}
.lab{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin:0 0 6px;display:block}
input[type=text],textarea{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;resize:vertical}
input[type=text]:focus,textarea:focus{border-color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--fg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;align-items:center}
.row input[type=checkbox]{accent-color:var(--fg);width:16px;height:16px;flex:none}
.sec{margin-top:22px}
.stack{display:grid;gap:6px}
.q{background:var(--soft);border-radius:12px;padding:14px}
.mv{font-size:28px;font-weight:300;letter-spacing:-.03em}
.st{font-size:11px;color:var(--mut);margin-top:16px;text-align:right}
@media(max-width:640px){.g2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr);row-gap:14px}.sheet{padding:16px}}
</style>
</head>
<body>
<div class="page">
<header>
  <div>
    <h1>ASCENSION</h1>
    <div class="yr"><button class="ico" id="py" aria-label="Previous year">←</button><b id="yl">2026</b><button class="ico" id="ny" aria-label="Next year">→</button></div>
    <div class="tag">Small steps. Every day. Big results.</div>
  </div>
  <div class="tools"><div class="tb"><button id="ex">Export</button><button id="im">Import</button><button id="vf">Verify chain</button><button id="rs">Reset</button><button id="tt">Theme</button></div><div class="msg" id="msg"></div><input type="file" id="fi" accept=".json,application/json" hidden></div>
</header>
<div class="stats">
  <div class="stat"><b id="s1">0</b><span>Day of year</span></div>
  <div class="stat"><b id="s2">0</b><span>Days logged</span></div>
  <div class="stat"><b id="s3">0</b><span>Current streak</span></div>
  <div class="stat"><b id="s4">–</b><span>Avg mode / 10</span></div>
</div>
<div class="bar"><i id="pb" style="width:0"></i></div>
<div class="wrap"><div class="grid" id="grid"></div></div>
<div class="lg">Mode <i style="--p:12%"></i><i style="--p:30%"></i><i style="--p:55%"></i><i style="--p:85%"></i> low → high · click any day to open it</div>
<div class="sig"><span class="lab">Signal — what actually moves your Mode</span><div class="stack" id="sg"></div>
<span class="lab" style="margin-top:26px;display:block">Mode by weekday</span><div class="wk" id="wk"></div></div>
<footer>CREATE · LEARN · ASCEND · REPEAT</footer>
</div>

<div id="md" hidden>
<div class="sheet">
  <div class="top">
    <div><small id="dw"></small><h2 id="dt"></h2></div>
    <div class="nav"><button id="dp">←</button><button id="dn">→</button><button id="dc">Close</button></div>
  </div>
  <label class="lab">Today is</label>
  <input type="text" data-f="t" placeholder="One line that defines today">
  <div class="g2" style="margin-top:12px">
    <div class="box"><label class="lab">Mode / 10</label><div class="row"><input type="range" min="0" max="10" step="1" data-f="m"><span class="mv" id="mv">0</span></div></div>
    <div class="box"><label class="lab">The path</label><input type="text" data-f="path" placeholder="Direction for today / this season"></div>
  </div>
  <div class="g2">
    <div class="box"><label class="lab">Body · training</label><div class="row"><input type="checkbox" data-f="bd"><input type="text" data-f="b" placeholder="Workout, sleep, steps…"></div></div>
    <div class="box"><label class="lab">Focus · target</label><div class="row"><input type="checkbox" data-f="fd"><input type="text" data-f="f" placeholder="The one thing that matters"></div></div>
    <div class="box"><label class="lab">Health · nutrition</label><div class="row"><input type="checkbox" data-f="hd"><input type="text" data-f="h" placeholder="Food, water, recovery…"></div></div>
    <div class="box"><label class="lab">Learning · reading</label><div class="row"><input type="checkbox" data-f="ld"><input type="text" data-f="l" placeholder="Book, course, topic…"></div></div>
  </div>
  <div class="g2 sec">
    <div><label class="lab">Today's plan</label><div class="stack" id="plan"></div><button id="pa" style="margin-top:8px">+ Add task</button></div>
    <div><label class="lab">Data / intelligence</label><div class="stack" id="intel"></div></div>
  </div>
  <div class="g2 sec">
    <div><label class="lab">Lessons learned</label><div class="stack" id="les"></div></div>
    <div><label class="lab">Quote</label><div class="q stack"><textarea rows="3" data-f="q" placeholder="“…”"></textarea><input type="text" data-f="qa" placeholder="— Author"></div></div>
  </div>
  <div class="sec"><label class="lab">Notes</label><textarea rows="6" data-f="n" placeholder="Free-form notes, thoughts, observations…"></textarea></div>
  <div class="box seal sec"><span id="sh"></span><button id="sb">Seal day</button></div><div class="st" id="st"></div>
</div>
</div>

<script>
const $=s=>document.querySelector(s), MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WD=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const LS="ascension-journal-v1";
let busy=false, store={}, year=new Date().getFullYear(), cur=null, db=null, uid=null, col=null, timers={};
const pad=n=>String(n).padStart(2,"0"), key=(y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d);
const todayKey=()=>{const n=new Date();return key(n.getFullYear(),n.getMonth(),n.getDate())};
const blank=()=>({t:"",m:0,path:"",b:"",bd:0,f:"",fd:0,h:"",hd:0,l:"",ld:0,plan:[],intel:["","","","","",""],les:["","",""],q:"",qa:"",n:""});
const filled=d=>!!d&&(d.m>0||["t","path","b","f","h","l","q","n"].some(k=>d[k])||d.bd||d.fd||d.hd||d.ld||(d.plan||[]).some(p=>p.x)||(d.intel||[]).some(Boolean)||(d.les||[]).some(Boolean));
try{store=JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){store={}}
const cache=()=>{try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}};
const dget=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
function dset(o,p,v){const ks=p.split(".");let a=o;ks.slice(0,-1).forEach(k=>{a=a[k]});a[ks[ks.length-1]]=v}

function render(){
  $("#yl").textContent=year;
  const g=$("#grid");g.textContent="";
  const add=(c,t)=>{const e=document.createElement("div");e.className=c;if(t!=null)e.textContent=t;g.appendChild(e);return e};
  add("hd","");for(let d=1;d<=31;d++)add("hd",d);
  const tk=todayKey();
  for(let m=0;m<12;m++){
    add("mo",MN[m]);
    const dim=new Date(year,m+1,0).getDate();
    for(let d=1;d<=31;d++){
      const b=document.createElement("button");b.className="c";
      if(d>dim){b.className="c x";b.disabled=true}
      else{
        const k=key(year,m,d),v=store[k];
        if(filled(v)){b.classList.add("f");b.style.setProperty("--p",(v.m>0?10+v.m*7.5:12)+"%")}
        if(v&&v.s)b.classList.add("s");if(k===tk)b.classList.add("t");
        b.title=MN[m]+" "+d;b.onclick=()=>openDay(k);
      }
      g.appendChild(b);
    }
  }
  stats();
}
function stats(){
  const now=new Date(),ty=now.getFullYear(),len=(new Date(year,1,29).getMonth()===1)?366:365;
  let doy=year<ty?len:year>ty?0:Math.floor((now-new Date(ty,0,0))/864e5);
  $("#s1").textContent=doy+" / "+len;$("#pb").style.width=(doy/len*100)+"%";
  let n=0,sum=0,cnt=0;
  Object.keys(store).forEach(k=>{if(k.startsWith(year+"-")&&filled(store[k])){n++;if(store[k].m>0){sum+=store[k].m;cnt++}}});
  $("#s2").textContent=n;$("#s4").textContent=cnt?(sum/cnt).toFixed(1):"–";
  let s=0,d=new Date();if(!filled(store[todayKey()]))d.setDate(d.getDate()-1);
  while(filled(store[key(d.getFullYear(),d.getMonth(),d.getDate())])){s++;d.setDate(d.getDate()-1)}
  $("#s3").textContent=s;sig();
}

function fields(id,name,n,ph){
  const c=$(id);c.textContent="";
  for(let i=0;i<n;i++){const t=document.createElement("input");t.type="text";t.dataset.f=name+"."+i;t.placeholder=ph+" "+(i+1);c.appendChild(t)}
}
function planRows(d){
  const c=$("#plan");c.textContent="";
  d.plan.forEach((p,i)=>{
    const r=document.createElement("div");r.className="row";
    const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!p.d;
    const t=document.createElement("input");t.type="text";t.value=p.x;t.placeholder="Task";
    const x=document.createElement("button");x.textContent="×";x.className="ico";
    cb.onchange=()=>{p.d=cb.checked?1:0;changed()};
    t.oninput=()=>{p.x=t.value;changed()};
    x.onclick=()=>{d.plan.splice(i,1);planRows(d);changed()};
    r.append(cb,t,x);c.appendChild(r);
  });
}
function openDay(k){
  cur=k;const d=store[k]||blank();
  ["plan","intel","les","q","qa","n","path"].forEach(f=>{if(d[f]==null)d[f]=blank()[f]});
  document.querySelectorAll("#md [data-f]").forEach(e=>{
    const v=dget(d,e.dataset.f);
    if(e.type==="checkbox")e.checked=!!v;else e.value=v==null?"":v;
  });
  planRows(d);lockUI(d);
  const dt=new Date(k+"T00:00:00");
  $("#dw").textContent=WD[dt.getDay()]+" · Day "+(Math.floor((dt-new Date(dt.getFullYear(),0,0))/864e5));
  $("#dt").textContent=MN[dt.getMonth()]+" "+dt.getDate()+", "+dt.getFullYear();
  $("#mv").textContent=d.m;$("#st").textContent="";
  $("#md").hidden=false;$("#md").scrollTop=0;
  window._d=d;
}
function shift(n){flush();const dt=new Date(cur+"T00:00:00");dt.setDate(dt.getDate()+n);year=dt.getFullYear();render();openDay(key(dt.getFullYear(),dt.getMonth(),dt.getDate()))}
function changed(){
  const d=window._d;store[cur]=d;
  $("#mv").textContent=d.m;
  clearTimeout(timers[cur]);const k=cur;timers[k]=setTimeout(()=>save(k),600);
  $("#st").textContent="Saving…";cache();render_cell();
}
function render_cell(){clearTimeout(render_cell.t);render_cell.t=setTimeout(render,250)}
document.addEventListener("input",e=>{
  const f=e.target.dataset&&e.target.dataset.f;if(!f||$("#md").hidden)return;
  const v=e.target.type==="checkbox"?(e.target.checked?1:0):e.target.type==="range"?+e.target.value:e.target.value;
  dset(window._d,f,v);changed();
});
async function save(k){
  delete timers[k];const d=store[k];
  if(!db||!uid){$("#st").textContent="Saved · this device";return}
  try{
    const ref=col.doc("d"+k);
    if(filled(d))await ref.set(d);else await ref.delete();
    $("#st").textContent="Saved · synced";
  }catch(e){$("#st").textContent="Saved · this device (sync unavailable)"}
}
function flush(){Object.keys(timers).forEach(k=>{clearTimeout(timers[k]);save(k)})}
function closeDay(){flush();$("#md").hidden=true;cur=null;render()}

$("#dc").onclick=closeDay;$("#dp").onclick=()=>shift(-1);$("#dn").onclick=()=>shift(1);
$("#pa").onclick=()=>{window._d.plan.push({x:"",d:0});planRows(window._d);changed()};
$("#py").onclick=()=>{year--;render()};$("#ny").onclick=()=>{year++;render()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#md").hidden)closeDay()});
$("#tt").onclick=()=>{const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0a0a0a";r.dataset.theme=dark?"light":"dark"};

const say=t=>{$("#msg").textContent=t};
const validKey=k=>/^\d{4}-\d{2}-\d{2}$/.test(k);
$("#ex").onclick=async()=>{
  flush();
  const out=JSON.stringify({app:"ascension",version:1,exported:new Date().toISOString(),data:store},null,2);
  const name="ascension-backup-"+todayKey()+".json";
  try{
    const dl=await claude.use("downloads");
    if(dl){await dl.save({filename:name,data:out});say("Export ready.");return}
  }catch(e){if(e&&e.code==="declined"){say("Export cancelled.");return}}
  try{
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"application/json"}));
    a.download=name;document.body.appendChild(a);a.click();a.remove();say("Export ready.");
  }catch(e){say("Export unavailable in this view.")}
};
$("#im").onclick=()=>{$("#fi").value="";$("#fi").click()};
$("#fi").onchange=async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  let inc;
  try{const j=JSON.parse(await f.text());inc=j&&j.data&&typeof j.data==="object"?j.data:j}catch(x){say("Import failed: not valid JSON.");return}
  const keys=Object.keys(inc||{}).filter(k=>validKey(k)&&inc[k]&&typeof inc[k]==="object");
  if(!keys.length){say("Import failed: no journal days found.");return}
  if(cur){flush();$("#md").hidden=true;cur=null}
  busy=true;say("Importing "+keys.length+" days…");let bad=0;
  for(const k of keys){
    store[k]=Object.assign(blank(),inc[k]);
    if(db&&uid){try{await col.doc("d"+k).set(store[k])}catch(x){bad++}}
  }
  cache();busy=false;render();
  say("Imported "+keys.length+" days"+(bad?" ("+bad+" not synced, kept on this device).":"."));
};

const st=v=>Array.isArray(v)?"["+v.map(st).join(",")+"]":v&&typeof v==="object"?"{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+st(v[k])).join(",")+"}":JSON.stringify(v);
const body=d=>{const c=Object.assign({},d);delete c.s;return st(c)};
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const sealed=()=>Object.keys(store).filter(k=>store[k]&&store[k].s).sort();
function lockUI(d){
  document.querySelectorAll("#md [data-f], #plan input, #plan button, #pa").forEach(e=>e.disabled=!!d.s);
  $("#sb").textContent=d.s?"Unseal":"Seal day";
  $("#sh").textContent=d.s?"SEALED · sha256 "+d.s.h.slice(0,20)+"… ← "+(d.s.p==="GENESIS"?"genesis":d.s.p.slice(0,10)+"…"):"Seal this day into the hash chain. Sealed days are locked and tamper-evident.";
}
$("#sb").onclick=async()=>{
  const d=window._d,sh=$("#sh");
  if(!window.crypto||!crypto.subtle){sh.textContent="Hashing is unavailable in this browser context.";return}
  const ks=sealed().filter(k=>k!==cur);
  if(d.s){if(sealed().pop()!==cur){sh.textContent="Ledger is append-only: only the latest seal can be removed.";return}delete d.s}
  else{
    if(ks.length&&ks[ks.length-1]>cur){sh.textContent="Ledger is append-only: seal days in chronological order.";return}
    const p=ks.length?store[ks[ks.length-1]].s.h:"GENESIS";
    d.s={h:await sha(p+"|"+cur+"|"+body(d)),p,at:new Date().toISOString()};
  }
  changed();lockUI(d);
};
$("#vf").onclick=async()=>{
  if(!window.crypto||!crypto.subtle){say("Hashing unavailable here.");return}
  const ks=sealed();if(!ks.length){say("No sealed days yet.");return}
  let prev="GENESIS";
  for(const k of ks){const d=store[k];
    if(d.s.p!==prev||await sha(prev+"|"+k+"|"+body(d))!==d.s.h){say("CHAIN BROKEN at "+k+" — entry was altered or reordered.");return}
    prev=d.s.h}
  say("Chain intact · "+ks.length+" sealed day"+(ks.length>1?"s":"")+" · head "+prev.slice(0,12)+"…");
};
function sig(){
  const ks=Object.keys(store).filter(k=>k.startsWith(year+"-")&&store[k].m>0),av=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const sg=$("#sg");sg.textContent="";
  [["bd","Body"],["fd","Focus"],["hd","Health"],["ld","Learning"]].forEach(([f,n])=>{
    const w=ks.filter(k=>store[k][f]).map(k=>store[k].m),o=ks.filter(k=>!store[k][f]).map(k=>store[k].m);
    const r=document.createElement("div");r.className="sr";
    const a=document.createElement("span");a.textContent=n;
    const b=document.createElement("div");b.className="sb";const i=document.createElement("i");b.appendChild(i);
    const c=document.createElement("span");c.style.color="var(--mut)";
    if(w.length<3||o.length<3){c.textContent="needs 3+ days each way"}
    else{const x=av(w),y=av(o);i.style.width=x*10+"%";c.textContent=x.toFixed(1)+" done · "+y.toFixed(1)+" skipped · Δ "+(x-y>=0?"+":"")+(x-y).toFixed(1)}
    r.append(a,b,c);sg.appendChild(r);
  });
  const wk=$("#wk");wk.textContent="";
  [1,2,3,4,5,6,0].forEach(w=>{
    const v=ks.filter(k=>new Date(k+"T00:00:00").getDay()===w).map(k=>store[k].m);
    const c=document.createElement("div"),i=document.createElement("i");
    i.style.height=(v.length?av(v)*10:0)+"%";
    const l=document.createElement("span");l.textContent=WD[w].slice(0,3)+(v.length?" "+av(v).toFixed(1):"");
    c.append(i,l);wk.appendChild(c);
  });
}
let rc=0;
$("#rs").onclick=async()=>{
  const b=$("#rs");
  if(!rc){b.textContent="Confirm reset?";b.classList.add("warn");say("This erases every day. Click again within 5 s.");
    rc=setTimeout(()=>{rc=0;b.textContent="Reset";b.classList.remove("warn");say("")},5000);return}
  clearTimeout(rc);rc=0;b.textContent="Reset";b.classList.remove("warn");
  busy=true;Object.keys(timers).forEach(k=>clearTimeout(timers[k]));timers={};
  if(!$("#md").hidden){$("#md").hidden=true;cur=null}
  const ks=Object.keys(store);store={};cache();render();say("Resetting…");let bad=0;
  if(db&&uid){for(const k of ks){try{await col.doc("d"+k).delete()}catch(x){bad++}}}
  busy=false;say(bad?"Reset locally; "+bad+" cloud entries could not be deleted.":"All data erased.");
};

(async()=>{
  try{
    const user=await claude.use("user"),d=await claude.use("db");
    if(!user||!d)return;
    const id=await user.id();if(!id)return;
    db=d;uid=id;col=db.collection("data/users/"+uid);
    col.onSnapshot(snap=>{
      if(busy)return;
      snap.docs.forEach(s=>{const k=s.id.slice(1);if(s.id[0]!=="d"||k===cur||timers[k])return;s.exists?store[k]=s.data():delete store[k]});
      cache();render();
    },()=>{db=null});
  }catch(e){db=null}
})();
