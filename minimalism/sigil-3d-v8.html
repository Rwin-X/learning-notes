<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIGIL v8 / black8arch</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--fg:#f2f2f0;--mut:#77776f;--line:#252525;--card:#111;--soft:#161616}
:root[data-theme="light"]{--bg:#f6f6f4;--fg:#0c0c0c;--mut:#8a8a86;--line:#d9d9d5;--card:#fff;--soft:#ecece8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:400 13px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.lab{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--mut)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;z-index:0}
#cv:active{cursor:grabbing}
header{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 22px 14px;border-bottom:1px solid var(--fg);pointer-events:none}
header .r{display:flex;gap:8px;pointer-events:auto}
button{font:inherit;color:var(--fg);background:none;border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
button:hover,button[aria-expanded="true"]{border-color:var(--fg)}
.meta{position:fixed;z-index:3;top:calc(66px + env(safe-area-inset-top,0px));left:22px;display:flex;flex-wrap:wrap;gap:4px 22px;pointer-events:none}
.meta b{font-weight:400;color:var(--fg);letter-spacing:.1em;margin-left:8px}
.bottom{position:fixed;z-index:3;left:22px;right:22px;bottom:calc(20px + env(safe-area-inset-bottom,0px));pointer-events:none}
h1{font-weight:800;font-size:clamp(44px,10vw,140px);letter-spacing:-.045em;line-height:.9;margin-bottom:14px}
.field{max-width:460px;pointer-events:auto}
input[type=text]{width:100%;font:300 clamp(20px,3vw,30px)/1.2 Inter,system-ui,sans-serif;letter-spacing:-.03em;color:var(--fg);background:none;border:0;border-bottom:1px solid var(--line);padding:6px 0;outline:0;margin-top:4px}
input[type=text]:focus{border-bottom-color:var(--fg)}
.dig{margin-top:8px;font:400 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--mut);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stream{position:fixed;z-index:1;top:112px;bottom:130px;width:92px;overflow:hidden;pointer-events:none;font:400 10px/1.8 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--mut);opacity:.6;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.stream.l{left:22px}.stream.r{right:22px;text-align:right}
.stream div{white-space:pre;animation:sc 90s linear infinite}
.stream.r div{animation-duration:140s;animation-direction:reverse}
@keyframes sc{to{transform:translateY(-50%)}}
#panel{position:fixed;z-index:4;top:calc(66px + env(safe-area-inset-top,0px));right:22px;width:min(290px,calc(100vw - 44px));padding:18px;border:1px solid var(--line);border-radius:14px;max-height:calc(100vh - 90px);overflow:auto;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none}
#panel.open{display:block}
#panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:12px 0 16px}
#panel label{display:flex;align-items:center;gap:8px;cursor:pointer}
#panel .sp{display:flex;align-items:center;gap:10px;margin-bottom:16px}
#panel .sp input{flex:1}
#panel .btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
#panel .hx{font:400 10px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--mut);word-break:break-all;margin:6px 0 12px}
input[type=checkbox],input[type=range]{accent-color:var(--fg)}
#term{position:fixed;z-index:2;right:22px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:330px;white-space:pre;overflow:hidden;font:400 11px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--mut);pointer-events:none;-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}
.stream.r{bottom:210px}
.he{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.he:hover{color:var(--fg)}
@media (max-width:900px){.stream,#term{display:none}}
@media (prefers-reduced-motion:reduce){.stream div{animation:none}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Rotating 3D sigil made of rings of words"></canvas>
<div class="stream l" aria-hidden="true"><div id="st-l"></div></div>
<div class="stream r" aria-hidden="true"><div id="st-r"></div></div>
<div id="term" aria-hidden="true"></div>

<header>
  <span class="lab">black8arch / sigil</span>
  <div class="r">
    <button id="ctl" type="button" aria-expanded="false" aria-controls="panel">Controls</button>
    <button id="theme" type="button">Theme</button>
  </div>
</header>

<div class="meta lab">
  <span>Bits<b id="s-bits">0</b></span><span>Words<b id="s-words">0</b></span><span>Links<b id="s-links">0</b></span><span>Delta<b id="s-delta">-</b></span><span>Shells<b>8</b></span>
</div>

<div class="meta lab" id="hud" style="top:calc(90px + env(safe-area-inset-top,0px))"></div>

<aside id="panel">
  <div class="lab">Layers</div>
  <div class="grid">
    <label><input type="checkbox" id="l-words" checked>Words</label>
    <label><input type="checkbox" id="l-orbits" checked>Orbits</label>
    <label><input type="checkbox" id="l-core" checked>Core</label>
    <label><input type="checkbox" id="l-floor" checked>Floor</label>
    <label><input type="checkbox" id="l-dust" checked>Dust</label>
    <label><input type="checkbox" id="l-term" checked>Log</label>
    <label><input type="checkbox" id="l-drift">Drift</label>
    <label><input type="checkbox" id="l-sound">Sound</label>
  </div>
  <div class="lab">Shells</div>
  <div class="grid" style="grid-template-columns:repeat(6,1fr)">
    <label><input type="checkbox" class="sh" data-i="0" checked>1</label>
    <label><input type="checkbox" class="sh" data-i="1" checked>2</label>
    <label><input type="checkbox" class="sh" data-i="2" checked>3</label>
    <label><input type="checkbox" class="sh" data-i="3" checked>4</label>
    <label><input type="checkbox" class="sh" data-i="4" checked>B</label>
    <label><input type="checkbox" class="sh" data-i="5" checked>W</label>
  </div>
  <div class="sp"><span class="lab">Speed</span><input type="range" id="speed" min="0" max="2.5" step="0.1" value="1" aria-label="Speed"></div>
  <div class="btns">
    <button id="pause" type="button">Pause</button>
    <button id="reset" type="button">Reset view</button>
    <button id="dl" type="button">PNG</button>
    <button id="mut" type="button">Mutate</button>
    <button id="file" type="button">File</button>
    <button id="fs" type="button">Full</button>
    <input type="file" id="fin" hidden>
  </div>
  <div class="lab">History</div><div class="hx" id="hist"></div>
  <div class="lab">Chain</div><div class="hx" id="hx3"></div>
  <div class="lab">SHA-256</div><div class="hx" id="hx2"></div>
  <div class="lab">SHA-512</div><div class="hx" id="hx5"></div>
  <p class="lab" id="status" style="letter-spacing:.12em;text-transform:none;font-size:12px">Drag to rotate. Wheel to zoom. Drop a file to hash it. Keys: Space, D, F.</p>
</aside>

<div class="bottom">
  <h1>SIGIL</h1>
  <div class="field">
    <div class="lab">Input</div>
    <input id="in" type="text" value="black8arch" spellcheck="false" autocomplete="off" maxlength="200" aria-label="Input text">
    <div class="dig" id="dig"></div>
  </div>
</div>

var shOn = [true, true, true, true, true, true], fpsE = 30, hist = [], histN = 0, drift = false, fileBytes = null, fileName = "", prevH2 = null, logSrc = [], logN = 0, nextLog = 0, logLines = [], AC = null, snd = null;

});
