  vis.forEach(function(e){var a=hosts[e.a],b=hosts[e.b];dx=b.x-a.x;dy=b.y-a.y;dz=b.z-a.z;d=Math.sqrt(dx*dx+dy*dy+dz*dz)+.01;var rest=60+110*(1-Math.sqrt(e.tb/maxB)),k=.03*(d-rest)/d;a.fx+=dx*k;a.fy+=dy*k;a.fz+=dz*k;b.fx-=dx*k;b.fy-=dy*k;b.fz-=dz*k});
  var mv=.25+.75*alpha;
  for(i=0;i<n;i++){h=hosts[i];h.fx-=h.x*.006;h.fy-=h.y*.006;h.fz-=h.z*.006;h.vx=clamp((h.vx+h.fx)*.82,-12,12);h.vy=clamp((h.vy+h.fy)*.82,-12,12);h.vz=clamp((h.vz+h.fz)*.82,-12,12);h.x+=h.vx*mv;h.y+=h.vy*mv;h.z+=h.vz*mv}}
function respawn(i){
  if(!vis.length){parts[i]={e:0,t:0,d:1,s:.4};return}
  var tot=cum[cum.length-1],x=rnd()*tot,lo=0,hi=cum.length-1;while(lo<hi){var mid=(lo+hi)>>1;if(cum[mid]>=x)hi=mid;else lo=mid+1}
  var d=rnd()<.5?1:-1;parts[i]={e:lo,t:d>0?0:1,d:d,s:.25+rnd()*.5}}
function spawnAll(){parts=[];for(var i=0;i<NP;i++){respawn(i);parts[i].t=rnd()}}
function metaUp(){setMeta([["Packets",pkTotal],["Hosts",hosts.length],["Flows",edges.length],["Volume",human(volume)],["Top",topSvc||"-"],["Format",kind+(hid?"  +"+hid+" hidden":"")]])}
function selInfo(){
  var t=label+"\n";
  if(sel>=0){var h=hosts[sel],s=Object.keys(h.srv).sort(function(a,b){return h.srv[b]-h.srv[a]}).slice(0,3).map(function(k){var p=k.split("/")[0];return k+(SVC[p]?" "+SVC[p]:"")+" x"+h.srv[k]}).join(", ");t+=h.ip+"  "+human(h.b)+"  "+h.p+" pkts  "+h.deg+" peers\n"+s+(h.scan?"\npossible port scan of "+h.scan.to+" ("+h.scan.n+" low ports)":"")}
  else t+="Click a host to isolate it. Drop a .pcap or .pcapng anywhere. Capture stays in your browser.";
  el("info").textContent=t}
scene.step=function(dt){
  if(!dragging)yaw+=dt*.08;
  alpha=Math.max(.06,alpha*.992);physics();
  for(var i=0;i<parts.length;i++){var p=parts[i];p.t+=p.d*p.s*dt;if(p.t<0||p.t>1)respawn(i)}};
scene.draw=function(){
  if(!hosts.length)return;
  var w=SD/560,g=glowSprite(),i,n=hosts.length,nb=null;
  for(i=0;i<n;i++){var h=hosts[i];proj(h.x,h.y,h.z);SXA[i]=PX;SYA[i]=PY;SZA[i]=PZ}
  if(sel>=0){nb={};nb[sel]=1;vis.forEach(function(e){if(e.a===sel)nb[e.b]=1;if(e.b===sel)nb[e.a]=1})}
  var paths=[new Path2D(),new Path2D(),new Path2D(),new Path2D()],dim=new Path2D();
  vis.forEach(function(e){
    var wn=Math.log1p(e.tb)/Math.log1p(maxB),c=Math.min(3,(wn*4)|0),inc=!nb||e.a===sel||e.b===sel,pth=inc?paths[c]:dim;
    pth.moveTo(SXA[e.a],SYA[e.a]);pth.lineTo(SXA[e.b],SYA[e.b])});
  var al=[.1,.2,.38,.62];
  for(i=0;i<4;i++){ctx.strokeStyle=rgba(al[i]);ctx.lineWidth=w*(.6+i*.45);ctx.stroke(paths[i])}
  ctx.strokeStyle=rgba(.05);ctx.lineWidth=w*.5;ctx.stroke(dim);
  var ps=w*6;
  for(i=0;i<parts.length;i++){
    var p=parts[i],e=vis[p.e];if(!e)continue;
    var x=SXA[e.a]+(SXA[e.b]-SXA[e.a])*p.t,y=SYA[e.a]+(SYA[e.b]-SYA[e.a])*p.t,inc=!nb||e.a===sel||e.b===sel;
    ctx.globalAlpha=inc?.85:.12;ctx.drawImage(g,x-ps/2,y-ps/2,ps,ps)}
  for(i=0;i<n;i++){
    var hh=hosts[i];if(!hh.deg)continue;
    var near=1-clamp((SZA[i]+220)/440,0,1),s=w*(9+30*Math.sqrt(hh.b/hMax)),on=!nb||nb[i];
    ctx.globalAlpha=(on?.5+.5*near:.12);ctx.drawImage(g,SXA[i]-s,SYA[i]-s,s*2,s*2);
    if(i===sel||i===hov){ctx.globalAlpha=1;ctx.strokeStyle=rgba(1);ctx.lineWidth=w*1.3;ctx.beginPath();ctx.arc(SXA[i],SYA[i],s*.7,0,6.2832);ctx.stroke()}
    if(hh.scan){ctx.globalAlpha=.9;ctx.strokeStyle=rgba(.9);ctx.lineWidth=w;ctx.beginPath();ctx.arc(SXA[i],SYA[i],s*.7+w*5,0,6.2832);ctx.stroke()}}
  ctx.font="10px "+MONO;ctx.textAlign="left";ctx.fillStyle=rgba(1);
  for(var k=0;k<topIdx.length;k++){var j=topIdx[k];if(nb&&!nb[j])continue;var nr=1-clamp((SZA[j]+220)/440,0,1);ctx.globalAlpha=.35+.6*nr;ctx.fillText(hosts[j].ip,SXA[j]+w*10,SYA[j]-w*8)}
  if(hov>=0&&topIdx.indexOf(hov)<0){ctx.globalAlpha=1;ctx.fillText(hosts[hov].ip,SXA[hov]+w*10,SYA[hov]-w*8)}
  ctx.globalAlpha=1};
function nearest(x,y){var best=-1,bd=22*22;for(var i=0;i<hosts.length;i++){if(!hosts[i].deg)continue;var dx=SXA[i]-x,dy=SYA[i]-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=i}}return best}
scene.hover=function(x,y){
  if(x<0||!SXA){hov=-1;tip(null);return}
  hov=nearest(x,y);
  if(hov<0)tip(null);else{var h=hosts[hov];tip(h.ip+"\n"+human(h.b)+" | "+h.p+" pkts | "+h.deg+" peers"+(h.scan?"\npossible port scan":""),x,y)}
  if(!running)redraw()};
scene.click=function(x,y){sel=nearest(x,y)===sel?-1:nearest(x,y);selInfo();if(!running)redraw()};
function load(ab,name){
  try{var r=parseCap(ab);if(!r.pkts.length)throw new Error("no IP packets found (supported: Ethernet, raw IP, Linux cooked)");ingest(r.pkts,name,r.kind)}
  catch(e){el("info").textContent="Parse error: "+e.message}
  if(!running)redraw()}
["tcp","udp","other"].forEach(function(k){el("p-"+k).onclick=function(){protoOn[k]=protoOn[k]?0:1;this.setAttribute("aria-pressed",!!protoOn[k]);if(!hosts.length)return;recompute();spawnAll();alpha=Math.max(alpha,.5);metaUp();selInfo();if(!running)redraw()}});
el("sample").onclick=function(){load(makeSample(),"synthetic sample capture (generated in your browser)")};
wireFile(function(f){if(f.size>67108864){el("info").textContent="File too large (64 MB max).";return}f.arrayBuffer().then(function(b){load(b,f.name)})});
fit();load(makeSample(),"synthetic sample capture (generated in your browser)");startLoop();

</script>
