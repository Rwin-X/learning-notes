<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cipher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f4;--fg:#0c0c0c;--mut:#8a8a86;--line:#d9d9d5;--soft:#ecece8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#f2f2f0;--mut:#77776f;--line:#252525;--soft:#161616}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f2f2f0;--mut:#77776f;--line:#252525;--soft:#161616}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:400 13px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.page{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 22px calc(40px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--fg)}
.lab{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut)}
h1{font-weight:800;font-size:clamp(34px,7vw,64px);letter-spacing:-.045em;line-height:.9;margin-top:26px}
#status{margin-top:12px;min-height:16px}
button,.btn{font:inherit;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg);background:none;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;transition:border-color .15s;display:inline-block}
button:hover,.btn:hover{border-color:var(--fg)}
.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.primary:hover{opacity:.85}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:22px 0 14px;border-bottom:1px solid var(--line)}
.tab{border:0;border-bottom:1px solid transparent;border-radius:0;margin-bottom:-1px;padding:10px 14px;color:var(--mut)}
.tab.on{border-bottom-color:var(--fg);color:var(--fg)}
.panel{display:none;gap:14px;border:1px solid var(--line);border-radius:14px;padding:18px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.panel.on{display:grid}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:120px}
textarea,input[type=text],input[type=password],input[type=number],select{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:96px;resize:vertical}
select{width:auto;background:var(--bg)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--fg)}
input[type=range]{accent-color:var(--fg);cursor:pointer}
input[type=checkbox]{accent-color:var(--fg)}
input[type=file]{display:none}
label.chk{display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--mut)}
.bar{height:2px;background:var(--soft);position:relative;flex:1;min-width:80px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--fg);transition:width .2s}
.seg button{border-radius:0}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.big{font-weight:300;font-size:20px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
hr{border:0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="page">
  <header>
    <span class="lab">Cipher &middot; Local crypto toolkit</span>
    <span class="lab" id="fp">Fingerprint</span>
    <button id="theme" type="button">Theme</button>
  </header>
  <h1 id="title">Encrypt</h1>
  <p class="lab" id="status">Runs in your browser. Nothing is uploaded.</p>
  <nav class="tabs" role="tablist">
    <button class="tab on" data-tab="encrypt" type="button">Encrypt</button>
    <button class="tab" data-tab="hash" type="button">Hash</button>
    <button class="tab" data-tab="generate" type="button">Generate</button>
    <button class="tab" data-tab="encode" type="button">Encode</button>
  </nav>

  <section class="panel on" id="p-encrypt">
    <div class="row">
      <span class="seg"><button id="mEnc" class="on" type="button">Encrypt</button><button id="mDec" type="button">Decrypt</button></span>
      <span class="grow"></span>
      <span class="lab">AES-256-GCM &middot; PBKDF2-SHA256 &middot; 600,000 iterations</span>
    </div>
    <textarea id="encIn" placeholder="Text to encrypt, or a Cipher blob (Base64) to decrypt" spellcheck="false"></textarea>
    <div class="row">
      <input id="pw" class="grow" type="password" placeholder="Password" autocomplete="off">
      <button id="pwShow" type="button">Show</button>
      <div class="bar"><i id="pwBar"></i></div><span class="lab" id="pwLab" style="min-width:60px">&mdash;</span>
    </div>
    <div class="row">
      <button id="run" class="primary" type="button">Encrypt</button>
      <label class="btn" for="encFile">File</label><input id="encFile" type="file">
      <button id="copyEnc" type="button">Copy output</button>
      <span class="lab">Files are processed in memory (max 256 MB). Drop one anywhere.</span>
    </div>
    <textarea id="encOut" readonly placeholder="Output" spellcheck="false"></textarea>
  </section>

  <section class="panel" id="p-hash">
    <textarea id="hIn" placeholder="Text to hash" spellcheck="false"></textarea>
    <div class="row">
      <label class="btn" for="hFile">File</label><input id="hFile" type="file"><span class="lab" id="hName"></span>
      <select id="hAlg"><option>SHA-256</option><option>SHA-384</option><option>SHA-512</option><option>SHA-1</option></select>
      <input id="hKey" class="grow" type="text" placeholder="HMAC key (optional)" autocomplete="off">
    </div>
    <div class="row"><span class="lab" style="width:48px">Hex</span><input id="hHex" class="grow" type="text" readonly><button data-copy="hHex" type="button">Copy</button></div>
    <div class="row"><span class="lab" style="width:48px">Base64</span><input id="hB64" class="grow" type="text" readonly><button data-copy="hB64" type="button">Copy</button></div>
    <hr>
    <div class="row"><input id="hCmp" class="grow" type="text" placeholder="Paste an expected hash to compare" spellcheck="false"><span class="lab" id="hMatch" style="min-width:70px">&mdash;</span></div>
  </section>

  <section class="panel" id="p-generate">
    <div class="row"><span class="lab">Length</span><input id="gLen" type="range" min="8" max="128" value="24" class="grow"><span class="big" id="gLenV">24</span></div>
    <div class="row">
      <label class="chk"><input id="gUp" type="checkbox" checked>A-Z</label>
      <label class="chk"><input id="gLo" type="checkbox" checked>a-z</label>
      <label class="chk"><input id="gDi" type="checkbox" checked>0-9</label>
      <label class="chk"><input id="gSy" type="checkbox" checked>Symbols</label>
      <label class="chk"><input id="gAm" type="checkbox">No look-alikes</label>
    </div>
    <div class="row"><input id="gOut" class="grow" type="text" readonly><button id="gGo" class="primary" type="button">Generate</button><button data-copy="gOut" type="button">Copy</button></div>
    <div class="row"><span class="lab">Entropy</span><span class="big" id="gBits">&mdash;</span></div>
    <hr>
    <div class="row">
      <span class="lab">Random bytes</span><input id="rN" type="number" min="1" max="1024" value="32" style="width:90px">
      <select id="rFmt"><option>hex</option><option>base64</option><option>base64url</option></select>
      <button id="rGo" type="button">Generate</button><button id="uGo" type="button">UUID v4</button>
    </div>
    <div class="row"><input id="rOut" class="grow" type="text" readonly><button data-copy="rOut" type="button">Copy</button></div>
  </section>

  <section class="panel" id="p-encode">
    <div class="row"><select id="eFmt"><option>Base64</option><option>Base64URL</option><option>Hex</option><option>URL</option></select>
      <button id="eEnc" class="primary" type="button">Encode</button><button id="eDec" type="button">Decode</button><button id="eSwap" type="button">Swap</button></div>
    <textarea id="eIn" placeholder="Input" spellcheck="false"></textarea>
    <textarea id="eOut" placeholder="Output" spellcheck="false"></textarea>
  </section>
</div>

<script>
/*CORE*/
const enc = new TextEncoder(), MAGIC = [80, 76, 83, 49];
const hex = u8 => Array.from(u8, b => b.toString(16).padStart(2, "0")).join("");
function toB64(u8){ let s = ""; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function fromB64(s){
  s = s.replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/"); while(s.length % 4) s += "=";
  const bin = atob(s), u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u;
}
const rand = n => crypto.getRandomValues(new Uint8Array(n));
function randInt(n){ const lim = Math.floor(4294967296 / n) * n; let x; do { x = crypto.getRandomValues(new Uint32Array(1))[0]; } while(x >= lim); return x % n; }
async function deriveKey(pw, salt, iter){
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
}
/* blob = "PLS1" | iterations (u32 BE) | salt (16) | iv (12) | ciphertext+tag ; the 36-byte header is authenticated as AAD */
async function seal(bytes, pw, iter = 600000){
  const salt = rand(16), iv = rand(12), head = new Uint8Array(36);
  head.set(MAGIC, 0); new DataView(head.buffer).setUint32(4, iter); head.set(salt, 8); head.set(iv, 24);
  const key = await deriveKey(pw, salt, iter);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: "AES-GCM", iv, additionalData: head}, key, bytes));
  const out = new Uint8Array(36 + ct.length); out.set(head); out.set(ct, 36); return out;
}
async function openBlob(blob, pw){
  if(blob.length < 53 || MAGIC.some((m, i) => blob[i] !== m)) throw new Error("Not a Cipher blob");
  const iter = new DataView(blob.buffer, blob.byteOffset).getUint32(4);
  if(iter < 100000 || iter > 10000000) throw new Error("Unsupported iteration count");
  const head = blob.slice(0, 36), key = await deriveKey(pw, blob.slice(8, 24), iter);
  try { return new Uint8Array(await crypto.subtle.decrypt({name: "AES-GCM", iv: blob.slice(24, 36), additionalData: head}, key, blob.slice(36))); }
  catch(e){ throw new Error("Wrong password or corrupted data"); }
}
async function digest(alg, bytes, key){
  if(key){
    const k = await crypto.subtle.importKey("raw", enc.encode(key), {name: "HMAC", hash: alg}, false, ["sign"]);
    return new Uint8Array(await crypto.subtle.sign("HMAC", k, bytes));
  }
  return new Uint8Array(await crypto.subtle.digest(alg, bytes));
}
const CLASSES = {up: "ABCDEFGHIJKLMNOPQRSTUVWXYZ", lo: "abcdefghijklmnopqrstuvwxyz", di: "0123456789", sy: "!@#$%^&*()-_=+[]{};:,.<>?/~"};
function genPassword(len, sel, noAmbig){
  const sets = Object.keys(sel).filter(k => sel[k]).map(k => noAmbig ? CLASSES[k].replace(/[Il1O0o|]/g, "") : CLASSES[k]);
  if(!sets.length) throw new Error("Select at least one character set");
  const pool = sets.join(""); let out;
  for(let t = 0; t < 1000; t++){
    out = Array.from({length: len}, () => pool[randInt(pool.length)]).join("");
    if(sets.every(s => Array.from(s).some(c => out.includes(c)))) break;
  }
  return {value: out, bits: len * Math.log2(pool.length)};
}
function strength(pw){
  let pool = 0; if(/[a-z]/.test(pw)) pool += 26; if(/[A-Z]/.test(pw)) pool += 26; if(/\d/.test(pw)) pool += 10; if(/[^A-Za-z0-9]/.test(pw)) pool += 28;
  const bits = pw.length * Math.log2(Math.max(pool, 1)) * (new Set(pw).size / Math.max(pw.length, 1));
  return {bits, label: bits < 40 ? "Weak" : bits < 60 ? "Fair" : bits < 80 ? "Good" : "Strong"};
}
function recode(fmt, text, encode){
  if(fmt === "URL") return encode ? encodeURIComponent(text) : decodeURIComponent(text);
  if(encode){
    const u = enc.encode(text);
    return fmt === "Hex" ? hex(u) : fmt === "Base64" ? toB64(u) : toB64(u).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  let u;
  if(fmt === "Hex"){ const h = text.replace(/\s+/g, ""); if(!/^([0-9a-fA-F]{2})*$/.test(h)) throw new Error("Invalid hex"); u = Uint8Array.from(h.match(/../g) || [], x => parseInt(x, 16)); }
  else u = fromB64(text);
  return new TextDecoder("utf-8", {fatal: true}).decode(u);
}
/*ENDCORE*/

const $ = id => document.getElementById(id);
const say = (m, bad) => { $("status").textContent = (bad ? "Error: " : "") + m; $("status").style.color = bad ? "var(--fg)" : ""; };
async function copy(text){ try { await navigator.clipboard.writeText(text); say("Copied"); } catch(e){ say("Copy failed", 1); } }
document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => copy($(b.dataset.copy).value)));

/* theme and tabs */
$("theme").addEventListener("click", () => {
  const r = document.documentElement, cur = r.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  r.setAttribute("data-theme", dark ? "light" : "dark"); colorTick = 0;
});
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-" + t.dataset.tab));
  $("title").textContent = t.textContent;
}));

/* fingerprint: the digest of the latest result shapes the 3D form */
async function fingerprint(text){ const d = await digest("SHA-256", enc.encode(text)); setPrint(d); $("fp").textContent = "Fingerprint " + hex(d.slice(0, 4)); }

/* encrypt / decrypt */
let mode = "enc";
function setMode(m){ mode = m; $("mEnc").classList.toggle("on", m === "enc"); $("mDec").classList.toggle("on", m === "dec"); $("run").textContent = m === "enc" ? "Encrypt" : "Decrypt"; }
$("mEnc").addEventListener("click", () => setMode("enc")); $("mDec").addEventListener("click", () => setMode("dec"));
$("pwShow").addEventListener("click", () => { const p = $("pw"); p.type = p.type === "password" ? "text" : "password"; $("pwShow").textContent = p.type === "password" ? "Show" : "Hide"; });
$("pw").addEventListener("input", () => { const s = strength($("pw").value); $("pwBar").style.width = Math.min(100, s.bits / 100 * 100) + "%"; $("pwLab").textContent = $("pw").value ? s.label : "\u2014"; });
async function guard(fn){ busy = 1; say("Working (key derivation)..."); try { await fn(); } catch(e){ say(e.message, 1); } busy = 0.2; }
$("run").addEventListener("click", () => guard(async () => {
  const pw = $("pw").value, t = $("encIn").value;
  if(!pw) throw new Error("Enter a password");
  if(!t) throw new Error("Nothing to " + (mode === "enc" ? "encrypt" : "decrypt"));
  let out;
  if(mode === "enc") out = toB64(await seal(enc.encode(t), pw));
  else {
    const pt = await openBlob(fromB64(t), pw);
    try { out = new TextDecoder("utf-8", {fatal: true}).decode(pt); } catch(e){ throw new Error("Decrypted data is not text; use File mode"); }
  }
  $("encOut").value = out; await fingerprint(out); say(mode === "enc" ? "Encrypted" : "Decrypted");
}));
$("copyEnc").addEventListener("click", () => copy($("encOut").value));
function download(bytes, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([bytes])); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
function runFile(file){ return guard(async () => {
  const pw = $("pw").value;
  if(!pw) throw new Error("Enter a password first");
  if(file.size > 256 * 1048576) throw new Error("File is larger than 256 MB");
  const bytes = new Uint8Array(await file.arrayBuffer());
  if(mode === "enc"){ const out = await seal(bytes, pw); download(out, file.name + ".pls"); await fingerprint(toB64(out.slice(0, 64))); say("Encrypted " + file.name); }
  else { const out = await openBlob(bytes, pw); download(out, file.name.replace(/\.pls$/, "") + (/\.pls$/.test(file.name) ? "" : ".dec")); await fingerprint(toB64(out.slice(0, 64))); say("Decrypted " + file.name); }
}); }
$("encFile").addEventListener("change", e => { if(e.target.files[0]) runFile(e.target.files[0]); e.target.value = ""; });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if(f){ document.querySelector('[data-tab="encrypt"]').click(); runFile(f); } });

/* hash / hmac */
let hFileBytes = null, hTimer = 0;
async function hashNow(){
  const alg = $("hAlg").value, key = $("hKey").value, data = hFileBytes || enc.encode($("hIn").value);
  const d = await digest(alg, data, key); $("hHex").value = hex(d); $("hB64").value = toB64(d); compare(); fingerprint(hex(d));
}
function compare(){
  const c = $("hCmp").value.trim().replace(/\s+/g, ""), h = $("hHex").value, b = $("hB64").value;
  $("hMatch").textContent = !c ? "\u2014" : (c.toLowerCase() === h || c === b) ? "Match" : "No match";
}
const hSched = () => { clearTimeout(hTimer); hTimer = setTimeout(() => hashNow().catch(e => say(e.message, 1)), 120); };
["hIn", "hKey"].forEach(id => $(id).addEventListener("input", () => { if(id === "hIn") hFileBytes = null, $("hName").textContent = ""; hSched(); }));
$("hAlg").addEventListener("change", hSched); $("hCmp").addEventListener("input", compare);
$("hFile").addEventListener("change", async e => {
  const f = e.target.files[0]; if(!f) return;
  if(f.size > 256 * 1048576) return say("File is larger than 256 MB", 1);
  hFileBytes = new Uint8Array(await f.arrayBuffer()); $("hName").textContent = f.name; hSched(); e.target.value = "";
});

/* generate */
function gen(){
  try {
    const r = genPassword(+$("gLen").value, {up: $("gUp").checked, lo: $("gLo").checked, di: $("gDi").checked, sy: $("gSy").checked}, $("gAm").checked);
    $("gOut").value = r.value; $("gBits").textContent = Math.round(r.bits) + " bits"; fingerprint(r.value);
  } catch(e){ say(e.message, 1); }
}
$("gGo").addEventListener("click", gen);
$("gLen").addEventListener("input", () => { $("gLenV").textContent = $("gLen").value; gen(); });
["gUp", "gLo", "gDi", "gSy", "gAm"].forEach(id => $(id).addEventListener("change", gen));
$("rGo").addEventListener("click", () => {
  const n = Math.min(1024, Math.max(1, +$("rN").value || 32)), u = rand(n), f = $("rFmt").value;
  $("rOut").value = f === "hex" ? hex(u) : f === "base64" ? toB64(u) : toB64(u).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); fingerprint($("rOut").value);
});
$("uGo").addEventListener("click", () => { $("rOut").value = crypto.randomUUID(); fingerprint($("rOut").value); });

/* encode / decode */
function doRecode(encode){ try { $("eOut").value = recode($("eFmt").value, $("eIn").value, encode); say(encode ? "Encoded" : "Decoded"); fingerprint($("eOut").value); } catch(e){ say(e.name === "TypeError" ? "Input is not valid text for this format" : e.message, 1); } }
$("eEnc").addEventListener("click", () => doRecode(true)); $("eDec").addEventListener("click", () => doRecode(false));
$("eSwap").addEventListener("click", () => { const a = $("eIn").value; $("eIn").value = $("eOut").value; $("eOut").value = a; });

/* backdrop: a hash-shaped 3D form (32 digest bytes displace a wireframe sphere) */
const cv = $("bg"), g = cv.getContext("2d"), RM = matchMedia("(prefers-reduced-motion:reduce)").matches;
const LAT = 14, LON = 28, N1 = LON + 1, R0 = 300, cur = new Float32Array(32).fill(128), tgt = new Float32Array(32).fill(128);
const PXs = new Float32Array((LAT + 1) * N1), PYs = new Float32Array((LAT + 1) * N1), PZs = new Float32Array((LAT + 1) * N1);
let W = 0, H = 0, yaw = 0.6, busy = 0, colorTick = 0, fgc = "242,242,240";
function setPrint(u8){ for(let i = 0; i < 32; i++) tgt[i] = u8[i]; }
function fit(){ const d = Math.min(devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); }
addEventListener("resize", fit);
const lerp = (a, b, t) => a + (b - a) * t;
function sampleB(u, w){
  const u0 = Math.min(2, Math.floor(u)), fu = u - u0, w0 = Math.floor(w) % 8, w1 = (w0 + 1) % 8, fw = w - Math.floor(w);
  return lerp(lerp(cur[u0 * 8 + w0], cur[u0 * 8 + w1], fw), lerp(cur[(u0 + 1) * 8 + w0], cur[(u0 + 1) * 8 + w1], fw), fu) / 255 - 0.5;
}
function frame(t){
  requestAnimationFrame(frame);
  if(colorTick-- <= 0){ const h = getComputedStyle(document.documentElement).getPropertyValue("--fg").trim(); if(/^#[0-9a-f]{6}$/i.test(h)) fgc = [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)).join(","); colorTick = 60; }
  if(!RM) yaw += 0.004 + busy * 0.04; busy *= 0.96;
  for(let k = 0; k < 32; k++) cur[k] += (tgt[k] - cur[k]) * 0.07;
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(-0.35), sp = Math.sin(-0.35), zoom = Math.min(W, H) / 1000;
  const cx0 = W > 900 ? W * 0.74 : W * 0.5, cy0 = H * 0.46;
  for(let i = 0; i <= LAT; i++){
    const th = i / LAT * Math.PI, st = Math.sin(th), ct = Math.cos(th);
    for(let j = 0; j <= LON; j++){
      const ph = j / LON * 6.2832, r = R0 * (1 + sampleB(i / LAT * 3, j / LON * 8) * 0.9 * Math.pow(st, 0.7) + busy * 0.06 * Math.sin(j * 3 + t * 0.02));
      const x0 = st * Math.cos(ph) * r, y0 = ct * r, z0 = st * Math.sin(ph) * r;
      const X = x0 * cy + z0 * sy, Z1 = -x0 * sy + z0 * cy, Y = y0 * cp - Z1 * sp, Z = y0 * sp + Z1 * cp, f = zoom * 900 / (1400 + Z), k = i * N1 + j;
      PXs[k] = cx0 + X * f; PYs[k] = cy0 + Y * f; PZs[k] = Z;
    }
  }
  g.clearRect(0, 0, W, H); g.lineWidth = 1;
  const al = [0.05, 0.14, 0.34], paths = [[], [], []];
  const seg = (a, b) => { const z = (PZs[a] + PZs[b]) / 2; paths[z < -105 ? 2 : z < 105 ? 1 : 0].push(a, b); };
  for(let i = 1; i < LAT; i++) for(let j = 0; j < LON; j++) seg(i * N1 + j, i * N1 + j + 1);
  for(let j = 0; j < LON; j += 2) for(let i = 0; i < LAT; i++) seg(i * N1 + j, (i + 1) * N1 + j);
  for(let b = 0; b < 3; b++){
    g.strokeStyle = "rgba(" + fgc + "," + al[b] + ")"; g.beginPath();
    for(let n = 0; n < paths[b].length; n += 2){ g.moveTo(PXs[paths[b][n]], PYs[paths[b][n]]); g.lineTo(PXs[paths[b][n + 1]], PYs[paths[b][n + 1]]); }
    g.stroke();
  }
}
