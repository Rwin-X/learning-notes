<body>
<canvas id="cv" aria-label="Rotating 3D extruded QR code modules"></canvas>
<div class="top">
<header>
  <span class="lab">black8arch / qrcell</span>

<h1>QRCELL</h1>
<div class="meta lab" id="meta"></div>
</div>
<div class="bottom"><div class="field"><div class="lab" style="margin-bottom:2px">Text</div><input type="text" id="q" spellcheck="false" autocomplete="off" aria-label="Text to encode"><div class="mono" id="info"></div></div></div>

var tipEl=el("tip");

function xr(seed){var s=seed|0||1;return function(){s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296}}
function setMeta(pairs){var m=el("meta");m.textContent="";pairs.forEach(function(p){var s=document.createElement("span");s.textContent=p[0];var b=document.createElement("b");b.textContent=p[1];s.appendChild(b);m.appendChild(s)})}


var EXP=new Uint8Array(512),LOG=new Uint8Array(256);

 4:{L:[20,[[1,80]]],M:[18,[[2,32]]],Q:[26,[[2,24]]],H:[16,[[4,9]]]},

var ROLE=["finder","separator","timing","alignment","format","version","dark module","data","error correction","remainder"];
function dataTotal(v,e){var t=0;TBL[v][e][1].forEach(function(b){t+=b[0]*b[1]});return t}

  setMeta([["Version",r.v],["Modules",r.q.n+" x "+r.q.n],["Level",e],["Mask",r.mask+(ms==="auto"?" (auto)":"")],["Bytes",r.len+" / "+r.cap],["Codewords",r.dataLen+" data + "+(r.total-r.dataLen)+" EC"]]);

function quad(p,x0,y0,x1,y1,h){proj(x0,-h,y0);p.moveTo(PX,PY);proj(x1,-h,y0);p.lineTo(PX,PY);proj(x1,-h,y1);p.lineTo(PX,PY);proj(x0,-h,y1);p.lineTo(PX,PY);p.closePath()}
scene.yawLim=1;
scene.step=function(dt){if(!dragging)yaw+=Math.cos(T*.25)*.0875*dt};
scene.draw=function(){
  if(!QR||QR.err)return;
  var q=QR.q,n=q.n,UN=Math.min(9,300/(n+8)),reveal=T*700,w=SD/600,items=[],r,c;CEN=[];
  var X=function(c){return(c-n/2)*UN},Z=function(r){return(r-n/2)*UN},H=7;
  for(r=0;r<n;r++)for(c=0;c<n;c++){proj(X(c)+UN/2,-q.m[r][c]*H,Z(r)+UN/2);items.push([PZ,r,c]);CEN.push([PX,PY,r,c])}
  items.sort(function(a,b){return b[0]-a[0]});
  var top=new Path2D(),side=new Path2D(),side2=new Path2D(),flat=new Path2D(),fr=new Path2D();
  items.forEach(function(it){var rr=it[1],cc=it[2],vis=q.ord[rr][cc]<=reveal;if(!vis)return;
    var x0=X(cc),x1=x0+UN,z0=Z(rr),z1=z0+UN;
    if(q.m[rr][cc]){
      proj(x0,0,z1);var a=[PX,PY];proj(x1,0,z1);var b=[PX,PY];proj(x1,-H,z1);var b2=[PX,PY];proj(x0,-H,z1);var a2=[PX,PY];side.moveTo(a[0],a[1]);side.lineTo(b[0],b[1]);side.lineTo(b2[0],b2[1]);side.lineTo(a2[0],a2[1]);side.closePath();
      proj(x1,0,z0);var c1=[PX,PY];proj(x1,-H,z0);var c2=[PX,PY];side2.moveTo(b[0],b[1]);side2.lineTo(c1[0],c1[1]);side2.lineTo(c2[0],c2[1]);side2.lineTo(b2[0],b2[1]);side2.closePath();
      quad(top,x0,z0,x1,z1,H)}else quad(flat,x0,z0,x1,z1,0)});
  quad(fr,X(-4),Z(-4),X(n+4),Z(n+4),0);
  ctx.strokeStyle=rgba(.2);ctx.lineWidth=w;ctx.stroke(fr);ctx.fillStyle=rgba(.07);ctx.fill(flat);
  ctx.fillStyle=rgba(.28);ctx.fill(side);ctx.fillStyle=rgba(.45);ctx.fill(side2);ctx.fillStyle=rgba(.95);ctx.fill(top);
  if(hov>=0){var hh=CEN[hov],hp=new Path2D(),xx=X(hh[3]),zz=Z(hh[2]);quad(hp,xx,zz,xx+UN,zz+UN,q.m[hh[2]][hh[3]]?H:0);ctx.strokeStyle=rgba(1);ctx.lineWidth=w*2;ctx.stroke(hp)}};
scene.hover=function(x,y){
  if(!QR||QR.err||x<0){hov=-1;tip(null);return}
  var best=-1,bd=(Math.min(9,300/(QR.q.n+8))*SD/380*.7),b2=bd*bd;for(var i=0;i<CEN.length;i++){var dx=CEN[i][0]-x,dy=CEN[i][1]-y,d=dx*dx+dy*dy;if(d<b2){b2=d;best=i}}
  hov=best;if(best<0){tip(null);return}
  var s=CEN[best],q=QR.q,rl=q.role[s[2]][s[3]];tip("row "+s[2]+", column "+s[3]+"\n"+(q.m[s[2]][s[3]]?"dark":"light")+", "+(rl>=0?ROLE[rl]:"?"),x,y);if(!running)redraw()};
function svg(){var q=QR.q,n=q.n,d="";for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.m[r][c])d+="M"+(c+4)+" "+(r+4)+"h1v1h-1z";return'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(n+8)+" "+(n+8)+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>'}
el("svg").onclick=function(){if(!QR||QR.err)return;var b=new Blob([svg()],{type:"image/svg+xml"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="qr.svg";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)};
["L","M","Q","H"].forEach(function(l){var o=document.createElement("option");o.value=l;o.textContent="Level "+l;el("ecc").appendChild(o)});el("ecc").value="M";
var mo=document.createElement("option");mo.value="auto";mo.textContent="Mask auto";el("mask").appendChild(mo);for(var mi=0;mi<8;mi++){var o2=document.createElement("option");o2.value=mi;o2.textContent="Mask "+mi;el("mask").appendChild(o2)}
var deb=0;el("q").addEventListener("input",function(){clearTimeout(deb);deb=setTimeout(compute,120)});el("ecc").onchange=compute;el("mask").onchange=compute;
el("q").value="https://github.com/black8arch";fit();compute();startLoop();
