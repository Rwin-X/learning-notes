<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SBOX / black8arch</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--fg:#f2f2f0;--mut:#77776f;--line:#252525}
:root[data-theme="light"]{--bg:#f6f6f4;--fg:#0c0c0c;--mut:#8a8a86;--line:#d9d9d5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:400 13px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.lab{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--mut)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;z-index:0}
#cv:active{cursor:grabbing}
.top{position:fixed;top:0;left:0;right:0;z-index:3;pointer-events:none}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 22px 14px;border-bottom:1px solid var(--fg)}
header .r{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;color:var(--fg);background:none;border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
button:hover,button[aria-pressed="true"]{border-color:var(--fg)}
button[aria-pressed="false"]{color:var(--mut)}
.meta{padding:0 22px;display:flex;flex-wrap:wrap;gap:4px 22px}
.meta b{font-weight:400;color:var(--fg);letter-spacing:.1em;margin-left:8px}
.bottom{position:fixed;z-index:3;left:22px;right:22px;bottom:calc(20px + env(safe-area-inset-bottom,0px));pointer-events:none}
h1{font-weight:800;font-size:clamp(24px,3.4vw,38px);letter-spacing:-.04em;line-height:1;padding:14px 22px 6px}
.field{max-width:430px;pointer-events:auto}
.mono{font:400 11px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--mut);letter-spacing:.03em;white-space:pre-line;overflow:hidden;text-overflow:ellipsis}
textarea{width:100%;font:400 12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg);background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;outline:0;margin-bottom:8px}
textarea:focus{border-color:var(--fg)}
select{font:inherit;color:var(--fg);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
select option{background:var(--bg);text-transform:none}
input[type=text]{width:100%;font:300 18px/1.3 Inter,system-ui,sans-serif;letter-spacing:-.02em;color:var(--fg);background:none;border:0;border-bottom:1px solid var(--line);padding:5px 0;outline:0;margin-bottom:8px}
input[type=text]:focus{border-bottom-color:var(--fg)}
.rg{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg:hover,.rg.on{color:var(--fg)}
#tip{position:fixed;z-index:5;display:none;pointer-events:none;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--bg) 88%,transparent);font:400 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg);white-space:pre}
</style>
</head>
<body>
<canvas id="cv" aria-label="Rotating 3D height field of an S-box difference or linear table"></canvas>
<div class="top">
<header>
  <span class="lab">black8arch / sbox</span>
  <div class="r"><select id="pre" aria-label="S-box presets"></select><button id="v-ddt" type="button" aria-pressed="true">Differences</button><button id="v-lat" type="button" aria-pressed="false">Linear</button><button id="v-box" type="button" aria-pressed="false">Values</button><button id="dl" type="button">PNG</button><button id="theme" type="button">Theme</button></div>
</header>
<h1>SBOX</h1>
<div class="meta lab" id="meta"></div>
</div>
<div class="bottom"><div class="field"><textarea id="cust" rows="3" spellcheck="false" placeholder="Custom S-box: 256 values separated by spaces or commas. Hex if any value has a letter or 0x, otherwise decimal." aria-label="Custom S-box values"></textarea><div class="btns" style="margin-bottom:8px"><button id="apply" type="button">Analyse custom</button></div><div class="mono" id="info"></div></div></div>
<div id="tip"></div>
<input type="file" id="fin" hidden>
<script>

var cv=document.getElementById("cv"),ctx=cv.getContext("2d"),root=document.documentElement;
function el(i){return document.getElementById(i)}
var MONO="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace";
var D=1,Wc=0,Hc=0,CXc=0,CYc=0,SD=1,fg=[242,242,240],bg="#0a0a0a";
var yaw=.6,pit=.35,zoom=1,UU=1,PX=0,PY=0,PZ=0,PF=1,cyw=1,syw=0,cpt=1,spt=0;
var T=0,paused=false,running=false,lastT=0,dragging=false,lx=0,ly=0,moved=0,ptrs={},pinchD=0,glow=null,scene={};
var reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
function rgba(a){return "rgba("+fg[0]+","+fg[1]+","+fg[2]+","+a+")"}
function ease(t){t=Math.max(0,Math.min(1,t));return 1-Math.pow(1-t,3)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function readTheme(){var cs=getComputedStyle(root),h=cs.getPropertyValue("--fg").trim();var n=[1,3,5].map(function(i){return parseInt(h.substr(i,2),16)});if(n.join()!==fg.join()){fg=n;glow=null}bg=cs.getPropertyValue("--bg").trim()}
function glowSprite(){if(glow)return glow;var s=64,g=document.createElement("canvas");g.width=g.height=s;var gc=g.getContext("2d"),rg=gc.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2),c=fg.join(",");rg.addColorStop(0,"rgba("+c+",.9)");rg.addColorStop(.4,"rgba("+c+",.25)");rg.addColorStop(1,"rgba("+c+",0)");gc.fillStyle=rg;gc.fillRect(0,0,s,s);glow=g;return g}
function fit(){D=Math.min(window.devicePixelRatio||1,1.5);Wc=cv.clientWidth;Hc=cv.clientHeight;cv.width=Math.round(Wc*D);cv.height=Math.round(Hc*D);CXc=Wc/2;CYc=Hc*.46;SD=Math.min(Wc,Hc);readTheme();redraw()}
function cam(){UU=SD/380*zoom;cyw=Math.cos(yaw);syw=Math.sin(yaw);cpt=Math.cos(pit);spt=Math.sin(pit)}
function proj(x,y,z){var X=x*cyw+z*syw,Z=-x*syw+z*cyw,Y=y*cpt-Z*spt;Z=y*spt+Z*cpt;var f=UU*900/(1400+Z);PX=CXc+X*f;PY=CYc+Y*f;PZ=Z;PF=f}
function redraw(){ctx.setTransform(D,0,0,D,0,0);ctx.clearRect(0,0,Wc,Hc);cam();if(scene.draw)scene.draw()}
function frame(ts){requestAnimationFrame(frame);if(ts-lastT<33)return;var dt=Math.min(.1,(ts-lastT)/1000);lastT=ts;if(!paused){T+=dt;if(scene.step)scene.step(dt)}redraw()}
function startLoop(){if(reduced){redraw();return}running=true;requestAnimationFrame(function(t){lastT=t;requestAnimationFrame(frame)})}
function clampView(){if(scene.yawLim)yaw=clamp(yaw,-scene.yawLim,scene.yawLim);pit=clamp(pit,-.2,1.3);zoom=clamp(zoom,.4,2.6)}
var tipEl=el("tip");
function tip(t,x,y){if(t===null){tipEl.style.display="none";return}tipEl.textContent=t;tipEl.style.display="block";tipEl.style.left=Math.max(8,Math.min(x+14,Wc-tipEl.offsetWidth-8))+"px";tipEl.style.top=(y+16)+"px"}
cv.addEventListener("pointerdown",function(e){ptrs[e.pointerId]=[e.clientX,e.clientY];dragging=true;lx=e.clientX;ly=e.clientY;moved=0;pinchD=0;tip(null);cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",function(e){
  if(ptrs[e.pointerId])ptrs[e.pointerId]=[e.clientX,e.clientY];
  var ids=Object.keys(ptrs);
  if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinchD)zoom*=d/pinchD;pinchD=d;clampView();if(!running)redraw();return}
  if(dragging&&ids.length===1){var dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);yaw+=dx*.008;pit+=dy*.006;lx=e.clientX;ly=e.clientY;clampView();if(!running)redraw()}
  else if(scene.hover)scene.hover(e.clientX,e.clientY)});
function pend(e){var wasClick=moved<5&&Object.keys(ptrs).length===1;delete ptrs[e.pointerId];pinchD=0;var k=Object.keys(ptrs)[0];dragging=!!k;if(k){lx=ptrs[k][0];ly=ptrs[k][1]}if(wasClick&&e.type==="pointerup"&&scene.click)scene.click(e.clientX,e.clientY)}
cv.addEventListener("pointerup",pend);cv.addEventListener("pointercancel",pend);
cv.addEventListener("pointerleave",function(){if(scene.hover)scene.hover(-999,-999)});
cv.addEventListener("wheel",function(e){e.preventDefault();zoom*=e.deltaY<0?1.06:.94;clampView();if(!running)redraw()},{passive:false});
cv.addEventListener("dblclick",function(){yaw=.6;pit=.35;zoom=1;if(!running)redraw()});
el("theme").onclick=function(){root.setAttribute("data-theme",root.getAttribute("data-theme")==="light"?"dark":"light");readTheme();if(!running)redraw()};
addEventListener("keydown",function(e){if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;if(e.code==="Space"){e.preventDefault();paused=!paused}});
addEventListener("resize",fit);
function wireFile(cb){var fin=el("fin");if(el("file"))el("file").onclick=function(){fin.click()};fin.onchange=function(){if(fin.files[0])cb(fin.files[0])};addEventListener("dragover",function(e){e.preventDefault()});addEventListener("drop",function(e){e.preventDefault();if(e.dataTransfer.files[0])cb(e.dataTransfer.files[0])})}
function savePNG(name){var t=document.createElement("canvas");t.width=cv.width;t.height=cv.height;var c=t.getContext("2d");c.fillStyle=bg;c.fillRect(0,0,t.width,t.height);c.drawImage(cv,0,0);t.toBlob(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)})}
if(el("dl"))el("dl").onclick=function(){savePNG("sbox.png")};
function toHex(b){return Array.prototype.map.call(b,function(x){return("0"+x.toString(16)).slice(-2)}).join("")}
async function sha256(bytes){return new Uint8Array(await crypto.subtle.digest("SHA-256",bytes))}
function human(n){if(n<1024)return n+" B";var u=["KB","MB","GB"],i=-1;do{n/=1024;i++}while(n>=1024&&i<2);return n.toFixed(n<10?2:1)+" "+u[i]}
function xr(seed){var s=seed|0||1;return function(){s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296}}
function setMeta(pairs){var m=el("meta");m.textContent="";pairs.forEach(function(p){var s=document.createElement("span");s.textContent=p[0];var b=document.createElement("b");b.textContent=p[1];s.appendChild(b);m.appendChild(s)})}


function gm(a,b){var p=0;for(var i=0;i<8;i++){if(b&1)p^=a;var hi=a&128;a=(a<<1)&255;if(hi)a^=27;b>>=1}return p}
function gpow(x,e){var r=1;while(e>0){if(e&1)r=gm(r,x);x=gm(x,x);e>>=1}return r}
function pc(x){var c=0;while(x){c+=x&1;x>>=1}return c}
function aesBox(){var S=new Uint8Array(256);for(var x=0;x<256;x++){var b=x?gpow(x,254):0,s=b;for(var k=1;k<=4;k++)s^=((b<<k)|(b>>(8-k)))&255;S[x]=s^0x63}return S}
function invBox(){var S=new Uint8Array(256);for(var x=1;x<256;x++)S[x]=gpow(x,254);return S}
function powBox(e){var S=new Uint8Array(256);for(var x=1;x<256;x++)S[x]=gpow(x,e);return S}
function randBox(seed){var S=new Uint8Array(256),r=xr(seed),i,j,t;for(i=0;i<256;i++)S[i]=i;for(i=255;i>0;i--){j=(r()*(i+1))|0;t=S[i];S[i]=S[j];S[j]=t}return S}
function mapBox(f){var S=new Uint8Array(256);for(var x=0;x<256;x++)S[x]=f(x)&255;return S}
function rev8(x){var r=0;for(var i=0;i<8;i++)r|=((x>>i)&1)<<(7-i);return r}
var PRE=[["AES S-box",aesBox],["GF inverse only (no affine)",invBox],["x^127 (inverse squared)",function(){return powBox(127)}],["Identity",function(){return mapBox(function(x){return x})}],["Affine 7x+13",function(){return mapBox(function(x){return x*7+13})}],["Bit reversal",function(){return mapBox(rev8)}],["Random permutation",function(){return randBox(20260105)}],["x^3 (not a permutation)",function(){return powBox(3)}]];
function fwht(a){var n=a.length;for(var h=1;h<n;h<<=1)for(var i=0;i<n;i+=h<<1)for(var j=i;j<i+h;j++){var x=a[j],y=a[j+h];a[j]=x+y;a[j+h]=x-y}}
function metrics(S){
  var seen=new Uint8Array(256),i,a,b,x,bij=true;for(i=0;i<256;i++)seen[S[i]]++;for(i=0;i<256;i++)if(seen[i]!==1)bij=false;
  var DDT=new Uint16Array(65536),delta=0;
  for(a=0;a<256;a++)for(x=0;x<256;x++)DDT[a*256+(S[x]^S[x^a])]++;
  for(a=1;a<256;a++)for(b=0;b<256;b++)if(DDT[a*256+b]>delta)delta=DDT[a*256+b];
  var LAT=new Int16Array(65536),maxW=0,deg=0,f=new Int32Array(256),g=new Uint8Array(256);
  for(b=1;b<256;b++){
    for(x=0;x<256;x++)f[x]=(pc(b&S[x])&1)?-1:1;fwht(f);
    for(a=0;a<256;a++){LAT[a*256+b]=f[a]/2;if(Math.abs(f[a])>maxW)maxW=Math.abs(f[a])}
    for(x=0;x<256;x++)g[x]=pc(b&S[x])&1;
    for(var h=1;h<256;h<<=1)for(i=0;i<256;i++)if(i&h)g[i]^=g[i^h];
    for(x=0;x<256;x++)if(g[x]&&pc(x)>deg)deg=pc(x)}
  var fp=0,ofp=0;for(x=0;x<256;x++){if(S[x]===x)fp++;if(S[x]===(x^255))ofp++}
  var sac=0;for(i=0;i<8;i++)for(x=0;x<256;x++)sac+=pc(S[x]^S[x^(1<<i)]);sac/=8*256*8;
  return{bij:bij,delta:delta,nl:128-maxW/2,deg:deg,fp:fp,ofp:ofp,sac:sac,DDT:DDT,LAT:LAT}}
var SB=null,M=null,view="ddt",name="",SXA=null,SYA=null,SIDX=null,SN=0,maxv=1,hov=-1;
function verdict(m){
  if(!m.bij)return"not a permutation: unusable as a block-cipher S-box";
  if(m.delta<=4&&m.nl>=112)return"optimal differential uniformity and nonlinearity, AES-class";
  if(m.delta<=10&&m.nl>=90)return"moderate: weaker than AES in differential or linear resistance";
  return"weak: strong differential or linear structure"}
function load(S,nm){
  SB=S;name=nm;M=metrics(S);T=0;hov=-1;
  var mx=1,DD=M.DDT,L=M.LAT,i;
  if(view==="ddt"){for(i=256;i<65536;i++)if(DD[i]>mx)mx=DD[i]}else if(view==="lat"){for(i=0;i<65536;i++)if((i&255)&&(i>>8)&&Math.abs(L[i])>mx)mx=Math.abs(L[i])}
  maxv=mx;ui()}
function ui(){
  setMeta([["S-box",name],["Permutation",M.bij?"yes":"no"],["Differential uniformity",M.delta],["Nonlinearity",M.nl],["Algebraic degree",M.deg],["Fixed points",M.fp+" + "+M.ofp+" opposite"]]);
  el("info").textContent=verdict(M)+".\nAvalanche (single input bit flips): "+(M.sac*100).toFixed(1)+"% of output bits change (ideal 50%).\nFor 8 bits the best known values are differential uniformity 4, nonlinearity 112 and degree 7 (AES). Affine changes on either side keep these three numbers, which is why the inverse alone scores like AES.\nView: "+(view==="ddt"?"difference table, input difference x output difference":view==="lat"?"linear table, input mask x output mask":"S-box values")+".";
  if(!running)redraw()}
scene.yawLim=1.2;
scene.step=function(dt){if(!dragging)yaw+=Math.cos(T*.25)*.0875*dt};
scene.draw=function(){
  if(!M)return;
  var w=SD/600,e=ease(T/1.2),i,a,b,XW=380,HM=120;
  if(view!=="box"){
    var F=view==="ddt"?M.DDT:M.LAT,B=[new Path2D(),new Path2D(),new Path2D()],stems=new Path2D(),sz=w*1.7,n=0;
    if(!SXA||SXA.length<65536){SXA=new Float32Array(65536);SYA=new Float32Array(65536);SIDX=new Int32Array(65536)}
    for(a=0;a<256;a++)for(b=0;b<256;b++){
      var v=view==="ddt"?F[a*256+b]:Math.abs(F[a*256+b]);if(!v)continue;if(view==="ddt"&&a===0)continue;if(view==="lat"&&(a===0||b===0))continue;
      var h=Math.min(1,v/maxv)*HM*e;proj((b/255-.5)*XW,-h,(a/255-.5)*XW);
      var k=Math.min(2,(v/maxv*3)|0);B[k].rect(PX-sz/2,PY-sz/2,sz,sz);SXA[n]=PX;SYA[n]=PY;SIDX[n]=a*256+b;n++;
      if(v/maxv>=.85){stems.moveTo(PX,PY);proj((b/255-.5)*XW,0,(a/255-.5)*XW);stems.lineTo(PX,PY)}}
    SN=n;
    var fr=new Path2D();[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(function(c,q){proj(c[0]*XW/2,0,c[1]*XW/2);if(q)fr.lineTo(PX,PY);else fr.moveTo(PX,PY)});fr.closePath();
    ctx.strokeStyle=rgba(.2);ctx.lineWidth=w;ctx.stroke(fr);ctx.strokeStyle=rgba(.5);ctx.stroke(stems);
    ctx.fillStyle=rgba(.3);ctx.fill(B[0]);ctx.fillStyle=rgba(.6);ctx.fill(B[1]);ctx.fillStyle=rgba(1);ctx.fill(B[2]);
    ctx.font="10px "+MONO;ctx.fillStyle=rgba(.5);proj(-XW/2,0,XW/2+14);ctx.fillText(view==="ddt"?"output difference 00 .. FF":"output mask 00 .. FF",PX,PY);proj(XW/2+8,0,-XW/2);ctx.fillText(view==="ddt"?"input diff":"input mask",PX,PY)}
  else{
    var P=new Path2D(),CW=22;
    for(i=0;i<256;i++){var cx=((i&15)-8)*CW,cz=((i>>4)-8)*CW,hh=SB[i]/255*70*e;proj(cx,-hh,cz);var p0=[PX,PY];proj(cx+CW-2,-hh,cz);var p1=[PX,PY];proj(cx+CW-2,-hh,cz+CW-2);var p2=[PX,PY];proj(cx,-hh,cz+CW-2);P.moveTo(p0[0],p0[1]);P.lineTo(p1[0],p1[1]);P.lineTo(p2[0],p2[1]);P.lineTo(PX,PY);P.closePath()}
    ctx.fillStyle=rgba(.6);ctx.fill(P)}
  if(Wc>900){
    var x0=Wc-22-256,y0=Hc-286,cs=16;ctx.font="9px "+MONO;ctx.textAlign="center";
    for(i=0;i<256;i++){var gx=x0+(i&15)*cs,gy=y0+(i>>4)*cs;ctx.fillStyle=rgba(.08+.8*SB[i]/255);ctx.fillRect(gx,gy,cs-1,cs-1);ctx.fillStyle=SB[i]>150?bg:rgba(.9);ctx.fillText(("0"+SB[i].toString(16)).slice(-2),gx+cs/2-.5,gy+cs/2+3)}
    ctx.fillStyle=rgba(.5);ctx.fillText("S-box table: row = high nibble, column = low nibble",x0+128,y0-6);ctx.textAlign="left"}
};
scene.hover=function(x,y){
  if(!M||x<0||view==="box"||!SN){tip(null);return}
  var best=-1,bd=9*9;for(var i=0;i<SN;i++){var dx=SXA[i]-x,dy=SYA[i]-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=i}}
  if(best<0){tip(null);return}
  var idx=SIDX[best],a=idx>>8,b=idx&255,h2=function(v){return("0"+v.toString(16)).slice(-2)};
  tip(view==="ddt"?"input difference "+h2(a)+" -> output difference "+h2(b)+"\noccurs "+M.DDT[idx]+" times out of 256":"input mask "+h2(a)+", output mask "+h2(b)+"\nbias "+M.LAT[idx]+" of 128",x,y)};
function setView(v){view=v;["ddt","lat","box"].forEach(function(k){el("v-"+k).setAttribute("aria-pressed",k===v)});load(SB,name)}
PRE.forEach(function(p,i){var o=document.createElement("option");o.value=i;o.textContent=p[0];el("pre").appendChild(o)});
el("pre").onchange=function(){var p=PRE[+this.value];load(p[1](),p[0])};
["ddt","lat","box"].forEach(function(k){el("v-"+k).onclick=function(){setView(k)}});
function parseCustom(t){var tk=t.split(/[\s,;]+/).filter(Boolean),hex=tk.some(function(s){return/^0x/i.test(s)||/[a-f]/i.test(s)}),v=tk.map(function(s){return hex?parseInt(s.replace(/^0x/i,""),16):parseInt(s,10)});if(v.length!==256||v.some(function(x){return isNaN(x)||x<0||x>255}))return null;return Uint8Array.from(v)}
el("apply").onclick=function(){var S=parseCustom(el("cust").value);if(!S){el("info").textContent="Enter exactly 256 values between 0 and 255 (decimal, or hex such as 63 7c 77 ...).";return}load(S,"Custom")};
fit();load(aesBox(),"AES S-box");startLoop();

</script>
</body>
</html>
