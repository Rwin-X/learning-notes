<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Galaxy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f4;--fg:#0c0c0c;--mut:#8a8a86;--line:#d9d9d5;--card:#fff;--soft:#ecece8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#f2f2f0;--mut:#77776f;--line:#252525;--card:#111;--soft:#161616}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f2f2f0;--mut:#77776f;--line:#252525;--card:#111;--soft:#161616}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 13px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.page{position:relative;z-index:1;height:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;gap:18px;
  overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  padding:calc(28px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px))}
.page::-webkit-scrollbar{display:none}
.top,.bottom{flex-shrink:0;transition:opacity .35s}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--fg);transition:opacity .35s}
.brand{display:inline-flex;align-items:center;gap:10px}
.hb{display:flex;gap:8px}
.lab{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut)}
button,.btn{font:inherit;color:var(--fg);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;transition:border-color .15s,color .15s}
button:hover,.btn:hover{border-color:var(--fg)}
button:focus-visible,.btn:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.tog{color:var(--mut)}
.tog[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
h1{font-weight:800;font-size:clamp(34px,6.5vw,68px);letter-spacing:-.045em;line-height:.9;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:18px;padding-bottom:.06em;transition:opacity .35s}
.sub{margin-top:8px}
.player{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:color-mix(in srgb,var(--bg) 62%,transparent);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;gap:6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seek{display:flex;align-items:center;gap:12px}
.t{font-weight:300;font-size:13px;letter-spacing:-.02em;min-width:48px;font-variant-numeric:tabular-nums}
.t.r{text-align:right}
.wave{position:relative;flex:1;height:34px;min-width:0;cursor:pointer;touch-action:none}
.wave canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.wave:focus-visible{outline:1px solid var(--fg);outline-offset:4px}
input[type=range]{accent-color:var(--fg);cursor:pointer}
#vol{width:84px}
.grow{flex:1}
.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);min-width:72px}
.primary:hover{opacity:.85}
input[type=file]{display:none}
select{font:inherit;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
select:hover{border-color:var(--fg)}
#drop{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#drop.on{display:flex}
.meters{display:flex;gap:16px;align-items:center}
.m{display:flex;align-items:baseline;gap:6px;position:relative;padding-bottom:4px}
.m .lab{font-size:8px;letter-spacing:.22em}
.m b{font-weight:300;font-size:13px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:22px}
.bar{height:1px;background:var(--soft);position:absolute;left:0;right:0;bottom:0}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--fg)}
.keys{margin-top:8px;text-align:center;font-size:9px;letter-spacing:.24em}
.queue{border:1px solid var(--line);border-radius:12px;padding:8px 14px 4px;margin-bottom:8px;max-height:22vh;overflow-y:auto;
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.queue[hidden]{display:none}
.qh{display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--fg)}
ol{list-style:none;padding:0}
.qi{display:flex;gap:14px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:9px 0;
  font-size:13px;letter-spacing:0;text-transform:none;color:var(--mut)}
.qi:hover{border-bottom-color:var(--line);color:var(--fg)}
.qi.on{color:var(--fg);font-weight:500}
.qi .n{font-weight:300;font-variant-numeric:tabular-nums;width:22px;flex:none}
.qi .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qe{padding:10px 0}
.hint{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;z-index:2;opacity:0;pointer-events:none}
body.focus .top header,body.focus .sub,body.focus .bottom{opacity:0;pointer-events:none}
body.focus h1{opacity:.08}
body.focus .page{cursor:pointer}
body.focus .hint{animation:hint 3.2s ease forwards}
@keyframes hint{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
@media (max-width:760px){.meters{display:none}}
@media (max-width:640px){#vol{width:64px}.t{min-width:36px}.page{gap:10px}}
@media (hover:none){.keys{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}body.focus .hint{animation:none;opacity:1}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="drop"><span class="lab">Drop audio files</span></div>

<div class="page" id="page">
  <div class="top">
    <header>
      <span class="lab brand">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><circle cx="7" cy="7" r="6.2"/><circle cx="7" cy="7" r="2.4"/><path d="M7 .8V3.4M13.2 7H10.6"/></svg>
        Pulse &middot; Galaxy
      </span>
      <span class="hb">
        <button id="focus" type="button">Focus</button>
        <button id="theme" type="button">Theme</button>
      </span>
    </header>
    <h1 id="title">Pulse</h1>
    <p class="lab sub" id="status">Open files or play the demo</p>
  </div>

  <div class="bottom">
    <section class="queue" id="queue" hidden aria-label="Queue">
      <div class="qh lab"><span>Queue</span><span id="qcount"></span></div>
      <ol id="qlist"></ol>
    </section>

    <div class="player">
      <div class="seek">
        <span class="t" id="cur">0:00</span>
        <div class="wave" id="wave" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><canvas id="wc"></canvas></div>
        <span class="t r" id="dur">0:00</span>
      </div>
      <div class="row">
        <button id="play" class="primary" type="button">Play</button>
        <button id="prev" type="button">Prev</button>
        <button id="next" type="button">Next</button>
        <span class="grow"></span>
        <button id="shuf" class="tog" type="button" aria-pressed="false">Shuffle</button>
        <button id="rep" class="tog" type="button" aria-pressed="false">Repeat</button>
        <select id="speed" aria-label="Speed">
          <option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option>
        </select>
      </div>
      <div class="row">
        <label class="btn" for="file">Open files</label>
        <input id="file" type="file" accept="audio/*" multiple>
        <button id="demo" type="button">Demo</button>
        <button id="qbtn" class="tog" type="button" aria-pressed="false">Queue</button>
        <span class="grow"></span>
        <div class="meters">
          <div class="m"><span class="lab">Bass</span><b id="vb">0</b><div class="bar"><i id="bb"></i></div></div>
          <div class="m"><span class="lab">Energy</span><b id="ve">0</b><div class="bar"><i id="be"></i></div></div>
          <div class="m"><span class="lab">Tempo</span><b id="vt">--</b><div class="bar"><i id="bt"></i></div></div>
          <div class="m"><span class="lab">Peak</span><b id="vp">0</b><div class="bar"><i id="bp"></i></div></div>
        </div>
        <span class="grow"></span>
        <span class="lab">Vol</span>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
      </div>
    </div>
    <p class="lab keys">Space play &middot; &larr; &rarr; seek &middot; &uarr; &darr; volume &middot; N P track &middot; S shuffle &middot; R repeat &middot; Q queue &middot; H focus &middot; F fullscreen</p>
  </div>
</div>
<div class="hint lab" id="hint">Press H or click to return</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var store = {
    get: function(k, d){ try{ var v = localStorage.getItem("pulse:" + k); return v === null ? d : v; }catch(e){ return d; } },
    set: function(k, v){ try{ localStorage.setItem("pulse:" + k, String(v)); }catch(e){} }
  };

  /* ================= State ================= */
  var audio = new Audio();
  audio.preload = "auto";
  var actx = null, gainNode = null, an = null, onA = null, fd = null, td = null, ofd = null;
  var NB = 48, E = new Int32Array(NB + 1), ofp = new Uint8Array(512);
  var playing = false, hasSrc = false, objUrl = null, state = "Idle", meta = "", token = 0, errRun = 0, isDemo = false;
  var queue = [], qi = 0, hist = [];
  var shuffle = store.get("shuffle", "0") === "1";
  var repeat = Math.min(2, Math.max(0, parseInt(store.get("repeat", "0"), 10) || 0));
  var volume = parseFloat(store.get("vol", "0.8")); if(!(volume >= 0 && volume <= 1)) volume = 0.8;
  var speed = parseFloat(store.get("speed", "1")); if(!(speed > 0)) speed = 1;
  var muted = false;
  var PK = 400, peaks = null, scrub = -1, waveDirty = true;

  /* analysis state */
  var tgt = new Float32Array(NB), bandv = new Float32Array(NB);
  var bass = 0, mid = 0, hi = 0, energy = 0, peak = 0, bpm = 0, beatPulse = 0, spin = 0, scopeAmp = 0;
  var lastBeat = 0, ivs = [], waves = [], pf = 0, fsum = 0, fi = 0, FH = new Float32Array(40);

  /* ================= Helpers ================= */
  function fmt(s){
    if(!isFinite(s) || s < 0) s = 0;
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = Math.floor(s % 60);
    return h ? h + ":" + (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r : m + ":" + (r < 10 ? "0" : "") + r;
  }
  function isAudio(f){ return (f.type && f.type.indexOf("audio") === 0) || /\.(mp3|wav|ogg|oga|flac|m4a|aac|opus|weba|webm)$/i.test(f.name); }
  function qtag(){ return queue.length > 1 ? (qi + 1) + " / " + queue.length : ""; }
  function setStatus(){ $("status").textContent = [state, qtag(), meta].filter(Boolean).join(" \u00b7 "); }
  function metaFor(f){
    var m = /\.([^.]+)$/.exec(f.name);
    return (m ? m[1].toUpperCase() : "AUDIO") + " \u00b7 " + (f.size / 1048576).toFixed(1) + " MB";
  }

  /* ================= Audio graph ================= */
  function applyGain(){ if(gainNode) gainNode.gain.setTargetAtTime(muted ? 0 : volume, actx.currentTime, 0.015); }
  function ensureAudio(){
    if(actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    var src = actx.createMediaElementSource(audio);
    gainNode = actx.createGain();
    an = actx.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = 0.7;
    onA = actx.createAnalyser(); onA.fftSize = 1024; onA.smoothingTimeConstant = 0;
    /* analysers tap the signal BEFORE the gain node so volume never changes the visuals */
    src.connect(an); src.connect(onA); src.connect(gainNode); gainNode.connect(actx.destination);
    fd = new Uint8Array(an.frequencyBinCount); td = new Uint8Array(an.fftSize); ofd = new Uint8Array(onA.frequencyBinCount);
    var bw = actx.sampleRate / an.fftSize, top = Math.min(an.frequencyBinCount - 1, Math.round(12000 / bw)), prev = 1;
    for(var k = 0; k <= NB; k++){
      var e = Math.round(Math.exp(Math.log(top) * k / NB));
      if(k > 0 && e <= prev) e = prev + 1;
      E[k] = e; prev = e;
    }
    E[0] = 1;
    applyGain();
  }
  function setVolume(v){
    volume = Math.max(0, Math.min(1, v)); muted = false;
    $("vol").value = volume; applyGain(); store.set("vol", volume);
  }

  /* ================= Transport ================= */
  function resetAnalysis(){
    ivs = []; bpm = 0; lastBeat = 0; waves = []; pf = 0; fsum = 0; fi = 0; FH.fill(0);
  }
  function setTrack(url, name, m, loop){
    if(objUrl && objUrl !== url) URL.revokeObjectURL(objUrl);
    objUrl = url;
    audio.src = url;
    audio.loop = !!loop;
    audio.defaultPlaybackRate = speed; audio.playbackRate = speed;
    hasSrc = true; meta = m || "";
    $("title").textContent = name;
    document.title = name + " \u00b7 Pulse Galaxy";
    $("cur").textContent = "0:00"; $("dur").textContent = "0:00";
    state = "Ready"; setStatus();
    setMedia(name);
    play();
  }
  function loadIndex(i){
    if(!queue.length) return;
    qi = i; var f = queue[qi];
    var my = ++token; peaks = null; touchWave(); resetAnalysis(); isDemo = false;
    setTrack(URL.createObjectURL(f), f.name.replace(/\.[^.]+$/, ""), metaFor(f), repeat === 2);
    renderQueue();
    if(f.size <= 30e6){
      f.arrayBuffer().then(decodeBuf).then(function(buf){
        if(my !== token) return;
        peaks = computePeaks(buf); touchWave();
      }).catch(function(){});
    }
  }
  function loadFiles(files){
    var list = Array.prototype.filter.call(files || [], isAudio);
    if(!list.length){ state = "No audio files found"; setStatus(); return; }
    queue = list; qi = 0; hist = []; errRun = 0;
    loadIndex(0);
  }
  function play(){
    if(!hasSrc) return;
    ensureAudio();
    if(actx.state === "suspended") actx.resume();
    audio.play().catch(function(){ state = "Playback blocked"; setStatus(); });
  }
  function toggle(){
    if(!hasSrc){ loadDemo(); return; }
    if(audio.paused) play(); else audio.pause();
  }
  function next(auto){
    if(!queue.length) return false;
    var n;
    if(shuffle && queue.length > 1){
      do{ n = Math.floor(Math.random() * queue.length); }while(n === qi);
    } else {
      n = qi + 1;
      if(n >= queue.length){ if(repeat === 1) n = 0; else return false; }
    }
    hist.push(qi); if(hist.length > 50) hist.shift();
    loadIndex(n);
    return true;
  }
  function prev(){
    if(!hasSrc) return;
    if(audio.currentTime > 3 || !queue.length){ audio.currentTime = 0; return; }
    if(hist.length) loadIndex(hist.pop());
    else if(qi > 0) loadIndex(qi - 1);
    else audio.currentTime = 0;
  }
  function seekBy(d){
    if(!hasSrc || !audio.duration) return;
    audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + d));
  }

  audio.addEventListener("play", function(){ playing = true; $("play").textContent = "Pause"; state = "Playing"; setStatus(); kick(); });
  audio.addEventListener("playing", function(){ errRun = 0; });
  audio.addEventListener("pause", function(){ playing = false; $("play").textContent = "Play"; state = "Paused"; setStatus(); touchWave(); });
  audio.addEventListener("ended", function(){
    if(next(true)) return;
    playing = false; $("play").textContent = "Play"; state = "Ended"; setStatus();
  });
  audio.addEventListener("error", function(){
    if(!hasSrc) return;
    errRun++; state = "Can't play this file"; setStatus();
    if(queue.length > 1 && errRun < queue.length) setTimeout(function(){ if(!next(true)) loadIndex(0); }, 400);
  });
  audio.addEventListener("loadedmetadata", function(){ $("dur").textContent = fmt(audio.duration); touchWave(); });
  audio.addEventListener("durationchange", function(){ $("dur").textContent = fmt(audio.duration); });
  audio.addEventListener("timeupdate", function(){
    if(scrub < 0) $("cur").textContent = fmt(audio.currentTime);
    if(audio.duration) $("wave").setAttribute("aria-valuenow", Math.round(audio.currentTime / audio.duration * 100));
    if(!playing) touchWave();
  });

  /* ---------- Media Session (headphone keys, lock screen) ---------- */
  function setMedia(name){
    if(!("mediaSession" in navigator)) return;
    try{ navigator.mediaSession.metadata = new MediaMetadata({ title: name, artist: "Pulse Galaxy" }); }catch(e){}
  }
  (function(){
    if(!("mediaSession" in navigator)) return;
    var h = {
      play: play, pause: function(){ audio.pause(); }, previoustrack: prev, nexttrack: function(){ next(false); },
      seekto: function(d){ if(d && isFinite(d.seekTime)) audio.currentTime = d.seekTime; }
    };
    Object.keys(h).forEach(function(k){ try{ navigator.mediaSession.setActionHandler(k, h[k]); }catch(e){} });
  })();

  /* ---------- Controls ---------- */
  $("play").addEventListener("click", toggle);
  $("prev").addEventListener("click", prev);
  $("next").addEventListener("click", function(){ next(false); });
  $("vol").value = volume;
  $("vol").addEventListener("input", function(e){ setVolume(+e.target.value); });
  $("speed").value = String(speed);
  $("speed").addEventListener("change", function(e){
    speed = parseFloat(e.target.value) || 1; store.set("speed", speed);
    audio.defaultPlaybackRate = speed; audio.playbackRate = speed;
  });
  function syncToggles(){
    $("shuf").setAttribute("aria-pressed", String(shuffle));
    $("rep").setAttribute("aria-pressed", String(repeat > 0));
    $("rep").textContent = ["Repeat", "Repeat all", "Repeat one"][repeat];
    if(!isDemo) audio.loop = repeat === 2;
  }
  function toggleShuffle(){ shuffle = !shuffle; store.set("shuffle", shuffle ? 1 : 0); syncToggles(); }
  function cycleRepeat(){ repeat = (repeat + 1) % 3; store.set("repeat", repeat); syncToggles(); }
  $("shuf").addEventListener("click", toggleShuffle);
  $("rep").addEventListener("click", cycleRepeat);
  function toggleQueue(){
    var q = $("queue"); q.hidden = !q.hidden;
    $("qbtn").setAttribute("aria-pressed", String(!q.hidden));
    if(!q.hidden) renderQueue();
    layoutScene(); dirty = true;
  }
  $("qbtn").addEventListener("click", toggleQueue);
  function renderQueue(){
    $("qcount").textContent = queue.length ? queue.length + (queue.length === 1 ? " track" : " tracks") : "";
    var ol = $("qlist"); ol.textContent = "";
    if(!queue.length){
      var e = document.createElement("li"); e.className = "qe lab"; e.textContent = "Queue is empty"; ol.appendChild(e); return;
    }
    queue.forEach(function(f, i){
      var li = document.createElement("li"), b = document.createElement("button");
      b.type = "button"; b.className = "qi" + (i === qi ? " on" : "");
      var n = document.createElement("span"); n.className = "n"; n.textContent = (i + 1 < 10 ? "0" : "") + (i + 1);
      var s = document.createElement("span"); s.className = "nm"; s.textContent = f.name.replace(/\.[^.]+$/, "");
      b.appendChild(n); b.appendChild(s);
      b.addEventListener("click", function(){ if(i !== qi){ hist.push(qi); loadIndex(i); } else toggle(); });
      li.appendChild(b); ol.appendChild(li);
    });
    var on = ol.querySelector(".on"); if(on && !$("queue").hidden) on.scrollIntoView({ block: "nearest" });
  }
  $("file").addEventListener("change", function(e){ loadFiles(e.target.files); e.target.value = ""; });

  /* Drag and drop */
  var dc = 0;
  addEventListener("dragenter", function(e){ e.preventDefault(); dc++; $("drop").classList.add("on"); });
  addEventListener("dragleave", function(){ dc = Math.max(0, dc - 1); if(!dc) $("drop").classList.remove("on"); });
  addEventListener("dragover", function(e){ e.preventDefault(); });
  addEventListener("drop", function(e){
    e.preventDefault(); dc = 0; $("drop").classList.remove("on");
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) loadFiles(e.dataTransfer.files);
  });

  /* Keyboard */
  function toggleFocus(){ document.body.classList.toggle("focus"); }
  addEventListener("keydown", function(e){
    var tag = e.target.tagName;
    if(tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    switch(e.code){
      case "Space": if(tag === "BUTTON") return; e.preventDefault(); toggle(); break;
      case "ArrowRight": e.preventDefault(); seekBy(5); break;
      case "ArrowLeft": e.preventDefault(); seekBy(-5); break;
      case "ArrowUp": e.preventDefault(); setVolume(volume + 0.05); break;
      case "ArrowDown": e.preventDefault(); setVolume(volume - 0.05); break;
      case "KeyN": next(false); break;
      case "KeyP": prev(); break;
      case "KeyS": toggleShuffle(); break;
      case "KeyR": cycleRepeat(); break;
      case "KeyQ": toggleQueue(); break;
      case "KeyH": toggleFocus(); break;
      case "KeyM": muted = !muted; applyGain(); break;
      case "KeyT": $("theme").click(); break;
      case "KeyF":
        try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(err){}
        break;
      case "Escape": document.body.classList.remove("focus"); break;
    }
  });
  $("focus").addEventListener("click", toggleFocus);
  $("page").addEventListener("click", function(){ if(document.body.classList.contains("focus")) document.body.classList.remove("focus"); });

  /* ---------- Theme ---------- */
  var savedTheme = store.get("theme", "");
  if(savedTheme === "dark" || savedTheme === "light") document.documentElement.setAttribute("data-theme", savedTheme);
  $("theme").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;

    /* core: cached glow sprite + counter-rotating wireframes */
    pr(0, 0, 0);
    var cx0 = OX, cy0 = OY, gs = (190 + bass * 380 + beatPulse * 160) * zm;
    ctx.globalAlpha = Math.min(1, 0.12 + bass * 0.55 + beatPulse * 0.3);
    ctx.drawImage(glowSprite(), cx0 - gs / 2, cy0 - gs / 2, gs, gs);
    ctx.globalAlpha = 1;
    wire(CUBE, CE, 14 + bass * 30 + beatPulse * 8, cr * 1.3, cr * 1.9 + 0.4, 0.85);
    wire(OCT, OE, 30 + bass * 44 + beatPulse * 12, -cr * 1.1, -cr * 0.8, 0.5);
    ctx.fillStyle = "rgba(" + cs + ",1)";
    var q = 3 + bass * 8; ctx.fillRect(cx0 - q / 2, cy0 - q / 2, q, q);
  }

  /* ---------- Meters ---------- */
  function setM(k, v, txt){
    v = Math.max(0, Math.min(1, v));
    $("v" + k).textContent = txt; $("b" + k).style.width = v * 100 + "%";
  }
  function meters(){
    setM("b", bass, Math.round(bass * 100));
    setM("e", energy, Math.round(energy * 100));
    if(ivs.length > 3){
      var so = ivs.slice().sort(function(x, y){ return x - y; }), bp = 60000 / so[so.length >> 1];
      while(bp < 70) bp *= 2;
      while(bp > 180) bp /= 2;
      bpm = bpm ? bpm + (bp - bpm) * 0.3 : bp;
    } else if(!ivs.length){ bpm = 0; }
    setM("t", bpm / 200, bpm ? Math.round(bpm) : "--");
    setM("p", peak, Math.round(peak * 100));
  }

  /* ---------- Loop ---------- */
  function touchWave(){ waveDirty = true; kick(); }
  function frame(ts){
    if(!running) return;
    requestAnimationFrame(frame);
    var dt = ts - lastT;
    if(dt < 28) return; /* ~30fps cap */
    lastT = ts; dtf = Math.min(dt, 50) / 33.3;
    if(colorTick-- <= 0){ themeColors(); colorTick = 60; }
    analyse(ts);
    if((fc++ & 7) === 0) meters();
    if(waveDirty || (playing && (fc & 1) === 0)){ drawWave(); waveDirty = false; }
    if(RM && !playing && !dirty){ if(energy < 0.002) running = false; return; }
    draw(ts); dirty = false;
  }
  function kick(){ if(running) return; running = true; lastT = 0; requestAnimationFrame(frame); }

  syncToggles(); renderQueue();
  themeColors(); fit(); kick();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ snap = true; fit(); });
})();
</script>
