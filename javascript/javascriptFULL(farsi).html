   ===================================================================== */
const NAV_LINKS = [['#/', '🏠', 'خانه'], ['#/plan', '🗓️', 'برنامه مطالعه'], ['#/progress', '📈', 'پیشرفت و نشان‌ها'], ['#/cheatsheet', '📚', 'برگه تقلب'], ['#/glossary', '📖', 'واژه‌نامه'], ['#/playground', '🧪', 'زمین‌بازی'], ['#/final', '🎓', 'آزمون پایانی']];

const App = {
  cleanups: [], rendered: false, current: null, searchIndex: null,

  parse() {
    const h = location.hash || '#/';
    if (!h.startsWith('#/')) return null;
    const [path, query] = h.slice(2).split('?');
    return { parts: path.split('/').filter(Boolean).map(decodeURIComponent), query: new URLSearchParams(query || '') };
  },

  build(r) {
    const [kind, arg] = r.parts;
    switch (kind) {
      case undefined: return Object.assign(homePage(), { title: 'خانه' });
      case 'm': return Object.assign(modulePage(Number(arg)), { title: 'ماژول' });
      case 'l': {
        const lesson = JSCourse.lesson(arg); if (!lesson) return notFoundPage();
        Store.data.last = { lessonId: lesson.id }; Store.touchDay(); Store.save();
        const page = renderLessonPage(lesson);
        return { html: page.html, hasToc: true, title: stripMarkup(lesson.title), accent: JSCourse.modules[lesson.module].color, mount: (root) => hydrateLesson(root, lesson) };
      }
      case 'test': return Object.assign(testPage(Number(arg)), { title: 'آزمون ماژول' });
      case 'final': return Object.assign(finalPage(), { title: 'آزمون پایانی' });
      case 'plan': return Object.assign(planPage(), { title: 'برنامه مطالعه' });
      case 'progress': return Object.assign(progressPage(), { title: 'پیشرفت من' });
      case 'cheatsheet': return Object.assign(cheatsheetPage(), { title: 'برگه تقلب' });
      case 'glossary': return Object.assign(glossaryPage(), { title: 'واژه‌نامه' });
      case 'playground': return Object.assign(playgroundPage(), { title: 'زمین‌بازی' });
      default: return notFoundPage();
    }
  },

  route(opts = {}) {
    const parsed = App.parse();
    if (!parsed && App.rendered) return;          // in-page anchors such as #main are not routes
    const r = parsed || { parts: [], query: new URLSearchParams() };
    const y = window.scrollY;
    App.cleanups.splice(0).forEach((fn) => fn());
    Sandbox.stopAll(); CodeBlocks.reset(); headingCounter = 0;
    const page = App.build(r); const main = $('#main');
    main.className = 'content' + (page.hasToc ? ' has-toc' : '');
    main.style.setProperty('--accent', page.accent || '');
    if (!page.accent) main.style.removeProperty('--accent');
    main.innerHTML = page.html;
    if (page.accent) document.documentElement.style.setProperty('--page-accent', page.accent);
    hydrateCodeBlocks(main);
    page.mount && page.mount(main);
    document.title = (page.title ? page.title + ' | ' : '') + 'آموزش جاوااسکریپت';
    window.scrollTo(0, opts.keepScroll ? y : 0);
    App.rendered = true; App.current = r;
    App.refreshChrome();
    document.body.classList.remove('menu-open'); $('#menuBtn').setAttribute('aria-expanded', 'false');
  },

  /* ---------- sidebar + top bar ---------- */
  refreshChrome() {
    const side = $('#sidebar'); const scroll = side.scrollTop; const hash = location.hash || '#/';
    const currentLesson = hash.startsWith('#/l/') ? JSCourse.lesson(decodeURIComponent(hash.slice(4).split('?')[0])) : null;
    const currentModule = currentLesson ? currentLesson.module : (hash.startsWith('#/m/') || hash.startsWith('#/test/') ? Number(hash.split('/')[2]) : -1);
    const link = (href, text, extra = '') => `<a class="nav-link" href="${href}" ${hash === href ? 'aria-current="page"' : ''} ${extra}>${text}</a>`;
    side.innerHTML = `<a class="brand" href="#/" style="text-decoration:none"><span class="logo" aria-hidden="true">JS</span><span>آموزش جاوااسکریپت<small>از صفر تا پیشرفته</small></span></a>
      <nav aria-label="صفحه‌های اصلی">${NAV_LINKS.map(([href, icon, text]) => link(href, `<span aria-hidden="true">${icon}</span> ${text}`)).join('')}</nav><div class="nav-sep"></div>
      <nav aria-label="ماژول‌ها و درس‌ها">${JSCourse.modules.map((m) => {
        const p = Progress.module(m.index); const open = m.index === currentModule || Store.data.openModules[m.index];
        return `<details class="mod" data-mod="${m.index}" ${open ? 'open' : ''} ${accentStyle(m)}><summary><span class="dot" aria-hidden="true">${toFa(m.index)}</span><span class="mtitle">${md(m.title)}</span><span class="pct">${p.total ? toFa(p.pct) + '٪' : ''}</span></summary>
          <div class="mbar" aria-hidden="true"><i style="width:${p.pct}%"></i></div>
          <ul class="lessons">${m.lessons.map((l) => `<li><a href="#/l/${l.id}" class="${Progress.isDone(l.id) ? 'done' : ''}" ${currentLesson && currentLesson.id === l.id ? 'aria-current="page"' : ''}><span class="tick" aria-hidden="true">${Progress.isDone(l.id) ? '✓' : ''}</span><span>${md(l.title)}</span></a></li>`).join('')}
          ${m.test ? `<li><a href="#/test/${m.index}" ${hash === '#/test/' + m.index ? 'aria-current="page"' : ''}><span class="tick" aria-hidden="true">${Store.data.tests[m.index] ? '✓' : ''}</span><span>🏁 آزمون ماژول</span></a></li>` : ''}
          ${!m.lessons.length ? '<li><span class="muted" style="padding:5px 10px;display:block;font-size:.82rem">درس‌ها بارگذاری نشده‌اند</span></li>' : ''}</ul></details>`;
      }).join('')}</nav>`;
    side.scrollTop = scroll;
    $$('details.mod', side).forEach((d) => d.addEventListener('toggle', () => { Store.data.openModules[d.dataset.mod] = d.open; Store.save(); }));
    $$('a', side).forEach((a) => a.addEventListener('click', () => { document.body.classList.remove('menu-open'); }));
    const cur = $('.lessons a[aria-current="page"]', side); if (cur && !App.sideScrolled) { cur.scrollIntoView({ block: 'nearest' }); }
    const overall = Progress.overall();
    $('#streakNum').textContent = toFa(Store.streak()); $('#ringNum').textContent = toFa(overall.pct) + '٪';
    $('#themeBtn').textContent = Store.data.theme === 'light' ? '☀️' : '🌙';
  },

  /* ---------- search ---------- */
  buildSearchIndex() {
    const textOf = (l) => {
      const parts = [l.title, l.goal];
      (l.explain || []).forEach((b) => { parts.push(b.text || '', b.title || '', (b.items || []).join(' '), b.t === 'code' ? b.code : '', (b.rows || []).flat().join(' ')); });
      (l.examples || []).forEach((e) => parts.push(e.title, e.desc || '', e.code));
      (l.mistakes || []).forEach((m) => parts.push(m.title, m.why));
      if (l.tip) parts.push(l.tip.text); (l.exercises || []).forEach((x) => parts.push(x.statement));
      if (l.project) parts.push((l.project.requirements || []).join(' '));
      return stripMarkup(parts.join(' \n '));
    };
    App.searchIndex = JSCourse.flat().map((lesson) => { const raw = textOf(lesson); return { lesson, raw, text: normalizeText(raw), title: normalizeText(stripMarkup(lesson.title)) }; });
  },
  search(query) {
    if (!App.searchIndex || App.searchIndex.length !== JSCourse.flat().length) App.buildSearchIndex();
    const terms = normalizeText(query).split(/\s+/).filter(Boolean); if (!terms.length) return [];
    return App.searchIndex.map((entry) => {
      let score = 0;
      for (const t of terms) {
        const inTitle = entry.title.includes(t), count = entry.text.split(t).length - 1;
        if (!inTitle && !count) return null; score += (inTitle ? 10 : 0) + Math.min(count, 5);
      }
      return { entry, score };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 8);
  },
  snippet(entry, terms) {
    const lower = entry.raw.toLowerCase(); let pos = -1;
    for (const t of terms) { pos = lower.indexOf(t.toLowerCase()); if (pos >= 0) break; }
    const start = Math.max(0, pos - 40); let s = entry.raw.slice(start, start + 120).replace(/\s+/g, ' ');
    s = escapeHtml(s); terms.forEach((t) => { if (t.length > 1) s = s.replace(new RegExp(escapeHtml(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), (m) => `<mark>${m}</mark>`); });
    return (start > 0 ? '… ' : '') + s + ' …';
  },
  initSearch() {
    const input = $('#searchInput'), box = $('#searchResults');
    const close = () => { box.classList.remove('open'); box.innerHTML = ''; };
    const doSearch = () => {
      const q = input.value.trim(); if (!q) return close();
      const terms = q.split(/\s+/); const hits = App.search(q);
      box.innerHTML = hits.length ? hits.map(({ entry }) => `<a href="#/l/${entry.lesson.id}" role="option"><b>${md(entry.lesson.title)}</b><small>${JSCourse.modules[entry.lesson.module].icon} ماژول ${toFa(entry.lesson.module)} · ${App.snippet(entry, terms)}</small></a>`).join('') : '<div style="padding:12px 14px" class="muted">نتیجه‌ای پیدا نشد. عبارت دیگری امتحان کنید.</div>';
      box.classList.add('open');
    };
    input.addEventListener('input', debounce(doSearch, 120));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { close(); input.blur(); }
      if (e.key === 'Enter') { const first = $('a', box); if (first) { location.hash = first.getAttribute('href'); close(); input.blur(); } }
      if (e.key === 'ArrowDown') { const first = $('a', box); if (first) { e.preventDefault(); first.focus(); } }
    });
    box.addEventListener('click', () => { close(); input.value = ''; });
    box.addEventListener('keydown', (e) => { const a = document.activeElement; if (e.key === 'ArrowDown' && a.nextElementSibling) { e.preventDefault(); a.nextElementSibling.focus(); } if (e.key === 'ArrowUp' && a.previousElementSibling) { e.preventDefault(); a.previousElementSibling.focus(); } if (e.key === 'Escape') { close(); input.focus(); } });
    document.addEventListener('click', (e) => { if (!e.target.closest('.searchbox')) close(); });
  },

  /* ---------- boot ---------- */
  validateCourse() {
    const seen = new Set();
    JSCourse.flat().forEach((l) => { if (seen.has(l.id)) console.warn('Duplicate lesson id:', l.id); seen.add(l.id); if (!l.goal || !l.explain) console.warn('Lesson is missing goal/explain:', l.id); });
  },
  init() {
    Store.load();
    document.documentElement.setAttribute('data-theme', Store.data.theme || 'dark');
    App.validateCourse(); Sandbox.listen(); App.initSearch();
    $('#themeBtn').addEventListener('click', () => { Store.data.theme = Store.data.theme === 'light' ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', Store.data.theme); Store.save(); App.refreshChrome(); });
    $('#menuBtn').addEventListener('click', () => { const open = document.body.classList.toggle('menu-open'); $('#menuBtn').setAttribute('aria-expanded', String(open)); });
    $('#backdrop').addEventListener('click', () => { document.body.classList.remove('menu-open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); });
    $('#toTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    window.addEventListener('scroll', () => $('#toTop').classList.toggle('show', window.scrollY > 600), { passive: true });
    window.addEventListener('hashchange', () => App.route());
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[href^="#s-"], .toc a'); if (!a) return;
      e.preventDefault(); const t = document.getElementById(a.getAttribute('href').slice(1)); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    document.addEventListener('keydown', (e) => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey) { e.preventDefault(); $('#searchInput').focus(); return; }
      if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
      const hash = location.hash;
      if ((e.key === 'n' || e.key === 'p') && hash.startsWith('#/l/')) {
        const nb = JSCourse.neighbors(decodeURIComponent(hash.slice(4))); const target = e.key === 'n' ? nb.next : nb.prev; if (target) location.hash = '#/l/' + target.id;
      }
    });
    if (!location.hash) history.replaceState(null, '', '#/');
    App.route();
  },
};

document.addEventListener('DOMContentLoaded', () => App.init());

</script>

  const cache = new Map();
  return (n) => (cache.has(n) ? cache.get(n) : (cache.set(n, fn(n)), cache.get(n)));
};
const fib = memoize((n) => { calls++; return n < 2 ? n : fib(n - 1) + fib(n - 2); });

function debounce(fn, wait) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), wait);
  };
}

['س', 'سل', 'سلا', 'سلام'].forEach((q) => search(q));

function throttle(fn, wait) {
  let last = -Infinity;
  return (...args) => {
    const now = Date.now();
    if (now - last >= wait) { last = now; fn(...args); }
  };
}
const onScroll = throttle((n) => console.log('اجرا:', n), 30);

    eg('Semver: ارتقا و بازه نسخه', 'منطق ساده‌شده `^` و `~` و افزایش نسخه.', C`
const parse = (v) => v.split('.').map(Number);
function bump(version, type) {
  let [major, minor, patch] = parse(version);
  if (type === 'major') { major++; minor = 0; patch = 0; }
  else if (type === 'minor') { minor++; patch = 0; }
  else patch++;
  return ¨¤{major}.¤{minor}.¤{patch}¨;
}
function satisfies(range, version) {
  const op = range[0];
  const [rM, rm, rp] = parse(range.slice(1));
  const [M, m, p] = parse(version);
  const atLeast = M > rM || (M === rM && (m > rm || (m === rm && p >= rp)));
  if (op === '^') return atLeast && M === rM;
  if (op === '~') return atLeast && M === rM && m === rm;
  return false;
}
console.log(bump('1.4.2', 'patch'), bump('1.4.2', 'minor'), bump('1.4.2', 'major'));
console.log(satisfies('^1.2.3', '1.9.0'), satisfies('^1.2.3', '2.0.0'), satisfies('~1.2.3', '1.3.0'), satisfies('~1.2.3', '1.2.9'));

const graph = {

const order = [];
const seen = new Set();
function visit(m) {
  if (seen.has(m)) return;
  seen.add(m);
  for (const dep of graph[m]) visit(dep);
  order.push(m);
}
visit('app.js');

function parseArgs(argv) {
  const out = { _: [] };
  for (let i = 0; i < argv.length; i++) {
    const a = argv[i];
    if (a.startsWith('--')) {
      const [key, value] = a.slice(2).split('=');
      out[key] = value ?? (argv[i + 1] && !argv[i + 1].startsWith('-') ? argv[++i] : true);
    } else if (a.startsWith('-')) out[a.slice(1)] = true;
    else out._.push(a);
  }
  return out;

const KEY = 'todos-v1';
const $ = (s) => document.querySelector(s);
const list = $('#list'), form = $('#form'), input = $('#text');

function load() {
  try {
    const data = JSON.parse(localStorage.getItem(KEY));
    return Array.isArray(data) ? data.filter((t) => t && typeof t.text === 'string') : [];
  } catch {
    return [];
  }
}
const save = () => localStorage.setItem(KEY, JSON.stringify(todos));

let todos = load();
let filter = 'all';
let nextId = todos.reduce((max, t) => Math.max(max, t.id), 0) + 1;
const matches = (t) => filter === 'all' || (filter === 'done') === t.done;

function itemEl(todo) {
  const li = document.createElement('li');
  li.dataset.id = todo.id;
  li.classList.toggle('done', todo.done);
  const box = document.createElement('input');
  box.type = 'checkbox';
  box.checked = todo.done;
  box.setAttribute('aria-label', 'انجام شد');
  const label = document.createElement('span');
  label.textContent = todo.text;          // امن: هرگز innerHTML
  const del = document.createElement('button');
  del.type = 'button';
  del.dataset.action = 'delete';
  del.textContent = '✕';
  del.setAttribute('aria-label', 'حذف');
  li.append(box, label, del);
  return li;
}

function render() {
  const shown = todos.filter(matches);
  list.replaceChildren(...shown.map(itemEl));
  $('#empty').hidden = shown.length > 0;
  $('#left').textContent = todos.filter((t) => !t.done).length;
  document.querySelectorAll('[data-filter]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.filter === filter));
  save();
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  todos.push({ id: nextId++, text, done: false });
  input.value = '';
  render();
});

// Event delegation: فقط یک listener برای همه آیتم‌ها
list.addEventListener('change', (e) => {
  const li = e.target.closest('li');
  if (!li) return;
  const todo = todos.find((t) => t.id === Number(li.dataset.id));
  todo.done = e.target.checked;
  render();
});
list.addEventListener('click', (e) => {
  if (e.target.dataset.action !== 'delete') return;
  const id = Number(e.target.closest('li').dataset.id);
  todos = todos.filter((t) => t.id !== id);
  render();
});
$('#filters').addEventListener('click', (e) => {
  const f = e.target.dataset.filter;
  if (f) { filter = f; render(); }
});
$('#clear').addEventListener('click', () => {
  todos = todos.filter((t) => !t.done);
  render();
});

render();
`),

const OPS = { '+': (a, b) => a + b, '-': (a, b) => a - b, '*': (a, b) => a * b, '/': (a, b) => a / b };

function press(s, key) {
  if (s.current === 'خطا' && key !== 'clear') s = initial();        // هر کلیدی خطا را پاک می‌کند
  if (/^\d$/.test(key)) {
    const base = s.fresh ? '0' : s.current;
    return { ...s, current: base === '0' ? key : base + key, fresh: false };
  }
  switch (key) {
    case '.': {
      const base = s.fresh ? '0' : s.current;
      return { ...s, current: base.includes('.') ? base : base + '.', fresh: false };
    }
    case 'clear': return initial();

      if (s.fresh) return s;

    case 'percent': return { ...s, current: format(Number(s.current) / 100), fresh: true };
    case '=': {
      if (!s.op) return s;
      return { current: format(OPS[s.op](s.previous, Number(s.current))), previous: null, op: null, fresh: true };

      const settled = s.op && !s.fresh ? press(s, '=') : s;

}

  const item = QUESTIONS[state.index];

  $('progressText').textContent = 'سؤال ' + toFa(state.index + 1) + ' از ' + toFa(QUESTIONS.length);

function formatTime(ms) {
  const cs = Math.floor(ms / 10) % 100;
  const s = Math.floor(ms / 1000) % 60;
  const m = Math.floor(ms / 60000);
  return pad(m) + ':' + pad(s) + '.' + pad(cs);
}

// ---- ساعت زنده (فقط نمایش؛ تأخیر کوچک اهمیتی ندارد) ----
const timeFmt = new Intl.DateTimeFormat('fa-IR', { timeStyle: 'medium' });
const dateFmt = new Intl.DateTimeFormat('fa-IR', { dateStyle: 'full' });
function tickClock() {
  const d = new Date();
  $('time').textContent = timeFmt.format(d);
  $('date').textContent = dateFmt.format(d);
}
setInterval(tickClock, 1000);
tickClock();

// ---- کرنومتر: زمان از اختلاف performance.now محاسبه می‌شود (بدون drift) ----
const watch = { running: false, startedAt: 0, elapsed: 0, laps: [] };
const now = () => (watch.running ? watch.elapsed + (performance.now() - watch.startedAt) : watch.elapsed);

function toggle() {
  if (watch.running) { watch.elapsed = now(); watch.running = false; }
  else { watch.startedAt = performance.now(); watch.running = true; }
  render();
}
function lap() {
  if (!watch.running) return;
  const total = now();
  const previous = watch.laps.length ? watch.laps[watch.laps.length - 1].total : 0;
  watch.laps.push({ total, split: total - previous });
  render();
}
function reset() {
  watch.running = false; watch.elapsed = 0; watch.laps = [];
  render();
}

function paint() {
  const ms = now();
  $('watch').textContent = toFa(formatTime(ms));
  $('watch').dataset.ms = Math.floor(ms);
}
function render() {
  paint();
  $('toggle').textContent = watch.running ? 'توقف' : watch.elapsed > 0 ? 'ادامه' : 'شروع';
  $('lap').disabled = !watch.running;
  const splits = watch.laps.map((l) => l.split);
  const fastest = Math.min(...splits), slowest = Math.max(...splits);
  $('laps').replaceChildren(...watch.laps.map((l, i) => {
    const li = document.createElement('li');
    if (watch.laps.length >= 3) li.className = l.split === fastest ? 'fast' : l.split === slowest ? 'slow' : '';
    const a = document.createElement('span'); a.textContent = 'دور ' + toFa(String(i + 1)) + ': ' + toFa(formatTime(l.split));
    const b = document.createElement('span'); b.textContent = toFa(formatTime(l.total));
    li.append(a, b);
    return li;
  }));
}

setInterval(() => { if (watch.running) paint(); }, 30);   // فقط رسم؛ نه حساب زمان

$('lap').addEventListener('click', lap);
$('reset').addEventListener('click', reset);

  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'l' || e.key === 'L') lap();
  else if (e.key === 'r' || e.key === 'R') reset();
});

const API = 'https://dummyjson.com/quotes/random';
const FALLBACK = [
  { text: 'First, solve the problem. Then, write the code.', author: 'John Johnson' },
  { text: 'Simplicity is the soul of efficiency.', author: 'Austin Freeman' },
  { text: 'Make it work, make it right, make it fast.', author: 'Kent Beck' },
];
const $ = (id) => document.getElementById(id);
const state = { current: null, history: [], controller: null };

async function fetchQuote(signal) {
  const res = await fetch(API, { signal });
  if (!res.ok) throw new Error('HTTP ' + res.status);          // fetch برای 404 reject نمی‌شود
  const data = await res.json();
  if (typeof data.quote !== 'string') throw new Error('پاسخ نامعتبر');
  return { text: data.quote, author: data.author || 'ناشناس' };
}

function setStatus(message, kind = '') {
  $('status').textContent = message;
  $('status').className = 'mute ' + kind;
  $('retry').hidden = kind !== 'error';
}
function show(q) {
  state.current = q;
  $('text').textContent = q.text;            // داده بیرونی: فقط textContent
  $('author').textContent = '— ' + q.author;
  $('copy').disabled = false;
  state.history = [q, ...state.history.filter((h) => h.text !== q.text)].slice(0, 5);
  $('history').replaceChildren(...state.history.map((h) => {
    const li = document.createElement('li');
    li.textContent = h.text + ' — ' + h.author;
    return li;
  }));
}

async function loadQuote() {
  state.controller?.abort();                          // آخری برنده
  const controller = (state.controller = new AbortController());
  const timer = setTimeout(() => controller.abort(), 8000);
  $('text').setAttribute('aria-busy', 'true');
  setStatus('در حال دریافت…');
  try {
    show(await fetchQuote(controller.signal));
    setStatus('');
  } catch (err) {
    if (state.controller !== controller) return;      // با درخواست تازه‌تر جایگزین شده؛ بی‌صدا
    show(FALLBACK[Math.floor(Math.random() * FALLBACK.length)]);
    setStatus('اینترنت در دسترس نیست؛ نقل‌قول محلی نشان داده شد.', 'error');
  } finally {
    clearTimeout(timer);
    if (state.controller === controller) $('text').removeAttribute('aria-busy');
  }
}

$('new').addEventListener('click', loadQuote);
$('retry').addEventListener('click', loadQuote);
$('copy').addEventListener('click', async () => {
  if (!state.current) return;
  try {
    await navigator.clipboard.writeText(state.current.text + ' — ' + state.current.author);
    setStatus('کپی شد ✓');
  } catch {
    setStatus('کپی در این محیط مجاز نیست.', 'error');
  }

function totals({ cart, coupon }) {
  const subtotal = Object.entries(cart).reduce((sum, [id, qty]) => sum + byId(Number(id)).price * qty, 0);
  const discount = coupon ? Math.round((subtotal * COUPONS[coupon]) / 100) : 0;
  const shipping = subtotal === 0 || subtotal - discount >= FREE_SHIPPING ? 0 : SHIPPING;
  return { subtotal, discount, shipping, total: subtotal - discount + shipping };
}

function change(id, delta) {

}

function button(text, data, label) {
  const b = document.createElement('button');

  b.textContent = text;

  if (label) b.setAttribute('aria-label', label);

}

function render() {

  render();
});

const grandTotal = () => expenses.reduce((sum, e) => sum + e.amount, 0);

function drawChart(data) {
  const canvas = $('#chart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 360, h = 200;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);            // از این پس با واحد CSS رسم می‌کنیم

  ctx.strokeStyle = '#262b33';

  ctx.textAlign = 'center';

  data.forEach((d, i) => {
    const barH = (d.total / max) * (base - top);
    const x = left + i * slot + slot * 0.18, bw = slot * 0.64;
    ctx.fillStyle = d.color;
    ctx.fillRect(x, base - barH, bw, barH);
    ctx.fillStyle = '#8a93a1';

<script>
/* =====================================================================
   MODULE 6 — DOM & Events — part B: events, delegation, forms, storage & observers
   ===================================================================== */
JSCourse.addLessons(6, [
{
  id: 'm6-events', title: 'رویدادها: Bubbling، Capturing و کنترل جریان', minutes: 45,
  goal: 'در پایان این درس می‌توانید شنونده رویداد اضافه و حذف کنید، شیء رویداد را بخوانید، مسیر انتشار (capturing و bubbling) را پیش‌بینی کنید و با `preventDefault` و `stopPropagation` جریان را کنترل کنید.',
  explain: [
    B.h('رویداد چیست؟'),
    B.p('**رویداد (Event)** اتفاقی است که در صفحه می‌افتد: کلیک، فشردن کلید، ارسال فرم، بارگذاری تصویر و ... شما با `addEventListener` یک **شنونده (Listener)** ثبت می‌کنید و مرورگر در لحظه رخداد آن را با یک **شیء رویداد (event)** فراخوانی می‌کند. این همان callback ناهمگام است که قبلاً دیدید.'),
    B.analogy('رویداد مثل زنگ در خانه است: شما (شنونده) از قبل مشخص می‌کنید «اگر زنگ زده شد، این کار را بکن». هر وقت کسی زنگ بزند (رویداد)، همان کار با اطلاعات مهمان (شیء رویداد) اجرا می‌شود.'),
    B.h('نحو'),
    B.code(C`
el.addEventListener('click', handler, options);
el.removeEventListener('click', handler);
`, 'ثبت و حذف شنونده (باید همان تابع را بدهید)'),
    B.ul('`options` می‌تواند `{ once: true, capture: true, passive: true, signal }` باشد.', '`once`: بعد از اولین اجرا خودکار حذف می‌شود.', '`signal`: با `AbortController.abort()` همه شنونده‌ها یک‌جا حذف می‌شوند.', 'به‌جای `el.onclick = ...` از `addEventListener` استفاده کنید تا بتوانید چند شنونده داشته باشید.'),
    B.h('شیء رویداد'),
    B.ul('`event.type`: نوع رویداد.', '`event.target`: عنصری که رویداد از آن شروع شد (عمیق‌ترین).', '`event.currentTarget`: عنصری که شنونده روی آن ثبت شده.', '`event.preventDefault()`: رفتار پیش‌فرض مرورگر را لغو می‌کند (رفتن لینک، ارسال فرم).', '`event.stopPropagation()`: انتشار به عنصرهای دیگر را متوقف می‌کند.', 'رویدادهای کلید: `event.key`، `event.code`، `event.ctrlKey`؛ موشواره: `clientX/Y`، `button`.'),
    B.h('انتشار رویداد: Capturing و Bubbling'),
    B.p('رویداد روی یک عنصر سه مرحله دارد: **۱) Capturing:** از ریشه (`window`) به سمت پایین تا والد هدف. **۲) Target:** رسیدن به خود هدف. **۳) Bubbling:** حباب‌وار از هدف به سمت بالا تا ریشه. شنونده‌ها به‌طور پیش‌فرض در مرحله **bubbling** اجرا می‌شوند؛ با `{ capture: true }` در مرحله capturing.'),
    B.analogy('فرض کنید در یک طبقه از ساختمانی بلند صدایی ایجاد می‌شود: اول مدیر ساختمان (ریشه) خبردار می‌شود و به پایین خبر می‌دهد (capturing)، به اتاق اصلی می‌رسد (target)، و سپس صدا از طبقه‌ها به سمت بالا پخش می‌شود (bubbling).'),
    B.info('بعضی رویدادها حباب نمی‌کنند (مثل `focus`، `blur`، `load`)؛ معادل حباب‌دارشان `focusin` و `focusout` است. اگر مطمئن نیستید، `event.bubbles` را بخوانید.'),
  ],
  examples: [
    eg('اولین شنونده', 'با `click()` رویداد را برنامه‌ای شبیه‌سازی می‌کنیم. `target` و `currentTarget` یکی هستند چون روی خود دکمه کلیک شده.', C`
document.body.innerHTML = '<button id="b">سلام</button>';
const b = document.getElementById('b');
b.addEventListener('click', (e) => {
  console.log(e.type, e.target.id, e.currentTarget === b);
});
b.click();
b.click();
`, 'click b true\nclick b true'),
    eg('حذف شنونده و once', '`removeEventListener` به همان مرجع تابع نیاز دارد؛ `once` خودکار حذف می‌کند.', C`
document.body.innerHTML = '<button id="b">x</button>';
const b = document.getElementById('b');
const onClick = () => console.log('کلیک');
b.addEventListener('click', onClick);
b.addEventListener('click', () => console.log('فقط یک‌بار'), { once: true });
b.click();
b.click();
b.removeEventListener('click', onClick);
b.click();
console.log('پایان');
`, 'کلیک\nفقط یک‌بار\nکلیک\nپایان'),
    eg('Bubbling', 'کلیک روی فرزند، پس از شنونده خودش به والدها هم می‌رسد (از داخل به بیرون).', C`
document.body.innerHTML = '<div id="outer"><div id="inner"><button id="btn">x</button></div></div>';
['outer', 'inner', 'btn'].forEach((id) => {
  document.getElementById(id).addEventListener('click', (e) => {
    console.log(id, 'target=' + e.target.id);
  });
});
document.getElementById('btn').click();
`, 'btn target=btn\ninner target=btn\nouter target=btn'),
    eg('Capturing در برابر Bubbling', 'شنونده‌های `capture: true` پیش از همه و از بیرون به داخل اجرا می‌شوند.', C`
document.body.innerHTML = '<div id="a"><div id="b"><button id="c">x</button></div></div>';
const log = (msg) => console.log(msg);
['a', 'b', 'c'].forEach((id) => {
  const el = document.getElementById(id);
  el.addEventListener('click', () => log('capture ' + id), true);
  el.addEventListener('click', () => log('bubble ' + id));
});
document.getElementById('c').click();
`, 'capture a\ncapture b\ncapture c\nbubble c\nbubble b\nbubble a'),
    eg('stopPropagation', 'جلوی رسیدن رویداد به والدها را می‌گیرد؛ ولی بقیه شنونده‌های همان عنصر اجرا می‌شوند.', C`
document.body.innerHTML = '<div id="p"><button id="b">x</button></div>';
document.getElementById('p').addEventListener('click', () => console.log('والد'));
const b = document.getElementById('b');
b.addEventListener('click', (e) => { e.stopPropagation(); console.log('دکمه ۱'); });
b.addEventListener('click', () => console.log('دکمه ۲'));
b.click();
`, 'دکمه ۱\nدکمه ۲'),
    eg('preventDefault', 'رفتار پیش‌فرض (مثل رفتن به لینک) لغو می‌شود. `defaultPrevented` را می‌توان خواند.', C`
document.body.innerHTML = '<a id="l" href="https://example.com">لینک</a>';
const a = document.getElementById('l');
a.addEventListener('click', (e) => {
  e.preventDefault();
  console.log('لغو شد:', e.defaultPrevented, e.cancelable);
});
a.click();
`, 'لغو شد: true true'),
    eg('رویداد صفحه‌کلید', 'رویداد کلید را می‌سازیم و ارسال می‌کنیم؛ `event.key` نام کلید را می‌دهد.', C`
document.body.innerHTML = '<input id="i">';
const i = document.getElementById('i');
i.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') console.log('Enter زده شد');
  else console.log('کلید:', e.key, e.ctrlKey);
});
i.dispatchEvent(new KeyboardEvent('keydown', { key: 'a' }));
i.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
i.dispatchEvent(new KeyboardEvent('keydown', { key: 's', ctrlKey: true }));
`, 'کلید: a false\nEnter زده شد\nکلید: s true'),
    eg('رویداد سفارشی (CustomEvent)', 'می‌توانید رویداد خودتان را با داده (`detail`) بسازید و به هر عنصر ارسال کنید.', C`
document.body.innerHTML = '<div id="cart"></div>';
const cart = document.getElementById('cart');
cart.addEventListener('item-added', (e) => {
  console.log('اضافه شد:', e.detail.name, e.detail.qty);
});
cart.dispatchEvent(new CustomEvent('item-added', { detail: { name: 'کتاب', qty: 2 } }));
`, 'اضافه شد: کتاب 2'),
    eg('حذف گروهی با AbortController', 'همه شنونده‌های یک گروه با یک `abort()` حذف می‌شوند.', C`
document.body.innerHTML = '<button id="b">x</button>';
const b = document.getElementById('b');
const ac = new AbortController();
b.addEventListener('click', () => console.log('۱'), { signal: ac.signal });
b.addEventListener('mouseover', () => console.log('۲'), { signal: ac.signal });
b.click();
ac.abort();
b.click();
console.log('پایان');
`, '۱\nپایان'),
  ],
  mistakes: [
    bad('صدا زدن تابع به‌جای معرفی آن', C`
btn.addEventListener('click', doIt());  // doIt همین الان اجرا می‌شود
`, C`
document.body.innerHTML = '<button id="btn">x</button>';
const doIt = () => console.log('اجرا');
document.getElementById('btn').addEventListener('click', doIt);
document.getElementById('btn').click();
`, 'با `()` تابع همان لحظه اجرا و نتیجه‌اش (معمولاً `undefined`) ثبت می‌شود. خود تابع را بدهید.'),
    bad('حذف شنونده با تابع بی‌نام جدید', C`

`, C`
document.body.innerHTML = '<button id="e">x</button>';

el.addEventListener('click', go);

console.log('هیچ چاپی نشد');
`, 'برای حذف باید دقیقاً همان مرجع تابع را بدهید (و همان گزینه `capture`). یا از `signal` و `once` استفاده کنید.'),
    bad('اشتباه گرفتن target و currentTarget', C`
parent.addEventListener('click', (e) => {

`, C`
document.body.innerHTML = '<div id="p"><span id="s">x</span></div>';
document.getElementById('p').addEventListener('click', (e) => {

document.getElementById('s').click();
`, '`target` عنصر آغازگر رویداد و `currentTarget` عنصری است که شنونده روی آن ثبت شده. در Delegation این تفاوت کلیدی است.'),
    bad('استفاده افراطی از stopPropagation', C`
el.addEventListener('click', (e) => e.stopPropagation()); // شنونده‌های سطح بالا (آنالیتیکس، بستن منو) خراب می‌شوند
`, C`
document.body.innerHTML = '<div id="menu"><button id="b">x</button></div>';

document.getElementById('b').click();
console.log('بدون stopPropagation');
`, '`stopPropagation` شنونده‌های والد را ناکارا می‌کند و دیباگ را سخت. ترجیحاً شرط بگذارید و فقط در صورت لزوم استفاده کنید.'),
  ],
