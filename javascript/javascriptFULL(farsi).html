<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آموزش جاوااسکریپت از صفر تا پیشرفته</title>
<meta name="description" content="دوره کامل خودآموز جاوااسکریپت (JavaScript) برای فارسی‌زبانان: ۱۲ ماژول، تمرین، آزمون و پروژه">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>
/* Apply the saved theme before first paint to avoid a flash. */
try{var s=JSON.parse(localStorage.getItem('jsc.v1')||'{}');if(s.theme)document.documentElement.setAttribute('data-theme',s.theme);}catch(e){}
</script>
<style>
/* ============================================================
   DESIGN TOKENS — dark by default, light via [data-theme="light"]
   ============================================================ */
:root{
  --bg:#0b0d12;--bg2:#10131a;--card:#141824;--card2:#1a1f2e;--border:#252b3b;--border2:#323a50;
  --text:#e9ecf4;--muted:#9ba4ba;--faint:#6b7590;
  --code-bg:#0a0c11;--code-text:#d7dcea;
  --sx-kw:#c792ea;--sx-str:#a5e075;--sx-num:#f9a76c;--sx-com:#6c7a96;--sx-fn:#7cc4ff;--sx-bi:#ffd479;--sx-op:#89ddff;--sx-re:#ff8fab;--sx-tag:#ff7b8e;--sx-attr:#ffcb6b;
  --info:#60a5fa;--tip:#34d399;--warn:#fbbf24;--danger:#f87171;--exercise:#a78bfa;--quiz:#22d3ee;
  --accent:#38bdf8;--accent-text:var(--accent);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
  --radius:14px;--sidebar-w:310px;--toc-w:220px;
  --sans:"Vazirmatn",Tahoma,"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"JetBrains Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f6fa;--bg2:#ffffff;--card:#ffffff;--card2:#f0f2f8;--border:#dfe3ee;--border2:#c9cfdf;
  --text:#141a2a;--muted:#525c75;--faint:#7a849c;
  --code-bg:#f6f8fc;--code-text:#1f2937;
  --sx-kw:#7c3aed;--sx-str:#15803d;--sx-num:#c2410c;--sx-com:#6b7280;--sx-fn:#0369a1;--sx-bi:#a16207;--sx-op:#0e7490;--sx-re:#be123c;--sx-tag:#be123c;--sx-attr:#a16207;
  --info:#1d4ed8;--tip:#047857;--warn:#a16207;--danger:#b91c1c;--exercise:#6d28d9;--quiz:#0e7490;
  --accent-text:color-mix(in srgb,var(--accent) 62%,#000);
  --shadow:0 1px 2px rgba(20,26,42,.06),0 8px 24px rgba(20,26,42,.08);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.95;-webkit-font-smoothing:antialiased}
a{color:var(--accent-text);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
code,pre,kbd,.ltr{direction:ltr;unicode-bidi:isolate;text-align:left;font-family:var(--mono)}
code{font-size:.88em;background:var(--card2);border:1px solid var(--border);padding:.08em .4em;border-radius:6px;color:var(--accent-text);display:inline-block;line-height:1.5}
kbd{background:var(--card2);border:1px solid var(--border2);border-bottom-width:2px;padding:0 .45em;border-radius:6px;font-size:.85em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--accent);color:#000;padding:8px 14px;border-radius:8px;z-index:200}
.skip:focus{top:8px}

/* ============================================================ LAYOUT */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg2);border-inline-end:1px solid var(--border);padding:16px 14px 40px;z-index:60;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:6px 6px 14px;font-weight:800;font-size:1.05rem;color:var(--text)}
.brand .logo{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#f7df1e;color:#111;font:800 15px var(--mono);box-shadow:0 4px 14px rgba(247,223,30,.25)}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:.74rem;line-height:1.3}
.nav-link{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;color:var(--muted);font-size:.93rem;line-height:1.5}
.nav-link:hover{background:var(--card2);color:var(--text);text-decoration:none}
.nav-link[aria-current="page"]{background:var(--card2);color:var(--text);font-weight:700}
.nav-sep{height:1px;background:var(--border);margin:12px 4px}
.mod{margin:4px 0;border-radius:12px}
.mod>summary{list-style:none;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:11px;cursor:pointer;font-weight:700;font-size:.93rem;line-height:1.5}
.mod>summary::-webkit-details-marker{display:none}
.mod>summary:hover{background:var(--card2)}
.mod .dot{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 12px var(--mono);background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent-text);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.mod .mtitle{flex:1;min-width:0}
.mod .pct{font-size:.72rem;color:var(--muted);font-weight:600}
.mbar{height:3px;border-radius:3px;background:var(--border);margin:0 10px 4px;overflow:hidden}
.mbar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s}
.lessons{margin:2px 0 8px;padding:0 0 0 0;list-style:none;border-inline-start:2px solid color-mix(in srgb,var(--accent) 35%,transparent);margin-inline-start:22px}
.lessons a{display:flex;gap:8px;align-items:flex-start;padding:5px 10px;font-size:.86rem;color:var(--muted);line-height:1.6;border-radius:8px}
.lessons a:hover{color:var(--text);background:var(--card2);text-decoration:none}
.lessons a[aria-current="page"]{color:var(--text);background:color-mix(in srgb,var(--accent) 14%,transparent);font-weight:700}
.lessons .tick{flex:none;width:16px;height:16px;margin-top:5px;border-radius:50%;border:1.5px solid var(--border2);display:grid;place-items:center;font-size:10px;color:#000}
.lessons .done .tick{background:var(--accent);border-color:var(--accent)}
.main-col{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px clamp(12px,3vw,28px);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.icon-btn{display:inline-grid;place-items:center;min-width:40px;height:40px;padding:0 10px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);transition:background .2s,border-color .2s}
.icon-btn:hover{background:var(--card2);border-color:var(--border2)}
#menuBtn{display:none}
.searchbox{position:relative;flex:1;max-width:520px}
.searchbox input{width:100%;height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text)}
.searchbox input::placeholder{color:var(--faint)}
.results{position:absolute;inset-inline:0;top:46px;background:var(--card);border:1px solid var(--border2);border-radius:12px;box-shadow:var(--shadow);max-height:min(60vh,460px);overflow:auto;display:none;z-index:70}
.results.open{display:block}
.results a{display:block;padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);line-height:1.7}
.results a:last-child{border:0}.results a:hover,.results a:focus{background:var(--card2);text-decoration:none}
.results small{display:block;color:var(--muted);font-size:.8rem}
.results mark{background:color-mix(in srgb,var(--warn) 35%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:11px;border:1px solid var(--border);background:var(--card);font-size:.88rem;white-space:nowrap}
.spacer{flex:1}
.content{width:100%;max-width:1180px;margin:0 auto;padding:28px clamp(14px,3vw,32px) 90px;display:grid;grid-template-columns:minmax(0,1fr);gap:34px}
.content.has-toc{grid-template-columns:minmax(0,1fr) var(--toc-w)}
.toc{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;font-size:.86rem;border-inline-start:2px solid var(--border);padding-inline-start:14px}
.toc b{display:block;margin-bottom:6px;color:var(--muted);font-size:.78rem;letter-spacing:.02em}
.toc a{display:block;padding:3px 0;color:var(--muted);line-height:1.6}
.toc a.active{color:var(--accent-text);font-weight:700}
.page{min-width:0;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============================================================ GENERIC COMPONENTS */
h1,h2,h3,h4{line-height:1.5;margin:0 0 .5em}
h1{font-size:clamp(1.7rem,3.2vw,2.35rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.4rem;font-weight:800}
h3{font-size:1.14rem;font-weight:700}
p{margin:0 0 1em}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:6px 16px;border-radius:11px;border:1px solid var(--border2);background:var(--card2);color:var(--text);font-weight:600;font-size:.92rem;transition:transform .15s,background .2s,border-color .2s}
.btn:hover{background:var(--border);text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#07090d}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.sm{min-height:32px;padding:2px 11px;font-size:.82rem;border-radius:9px}
.btn.danger{border-color:color-mix(in srgb,var(--danger) 60%,transparent);color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.badge-pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.76rem;font-weight:700;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent-text);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.crumbs{font-size:.86rem;color:var(--muted);margin-bottom:10px}
.hero{padding:clamp(22px,4vw,44px);border-radius:22px;border:1px solid var(--border);background:radial-gradient(900px 300px at 85% -20%,color-mix(in srgb,var(--accent) 22%,transparent),transparent),var(--card);position:relative;overflow:hidden}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:62ch}
.ring{--p:0;width:var(--s,96px);height:var(--s,96px);border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--border) 0);position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card)}
.ring span{position:relative;font-weight:800;font-size:1.15rem}
.progress{height:8px;border-radius:8px;background:var(--border);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .5s}
.mcard{display:flex;flex-direction:column;gap:8px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);padding:16px;color:var(--text);transition:transform .2s,border-color .2s;border-top:3px solid var(--accent)}
.mcard:hover{transform:translateY(-3px);border-color:var(--accent);text-decoration:none}
.mcard .num{font:800 .8rem var(--mono);color:var(--accent-text)}
.mcard h3{margin:0;font-size:1.02rem}
.mcard p{margin:0;font-size:.88rem;color:var(--muted);line-height:1.8}
.roadmap{display:flex;flex-wrap:wrap;gap:0;position:relative;padding:8px 0}
.rm{flex:1 1 150px;min-width:140px;text-align:center;padding:10px 8px;position:relative}
.rm .node{width:48px;height:48px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--mono);color:#07090d;background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
.rm.done .node{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent),0 0 22px color-mix(in srgb,var(--accent) 60%,transparent)}
.rm a{color:var(--text);font-size:.86rem;font-weight:700;line-height:1.5;display:block}
.rm small{color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:.92rem;margin:0 0 1.2em;display:block;overflow-x:auto}
table.t th,table.t td{border:1px solid var(--border);padding:8px 12px;text-align:start;vertical-align:top;line-height:1.7}
table.t th{background:var(--card2);font-weight:700}
table.t td code{white-space:pre-wrap}
ul.list,ol.list{margin:0 0 1em;padding-inline-start:1.5em}
ul.list li,ol.list li{margin-bottom:.35em}

/* section blocks in lessons */
.lesson-head{margin-bottom:22px}
.lesson-head .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sec{margin:34px 0;scroll-margin-top:84px}
.sec>h2{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.sec>h2 .ic{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--accent) 16%,transparent);font-size:18px}
.page h3{scroll-margin-top:84px;color:var(--accent-text);margin-top:1.6em}
.callout{--c:var(--info);border-radius:12px;padding:14px 18px;margin:1.1em 0;border:1px solid color-mix(in srgb,var(--c) 35%,transparent);border-inline-start:5px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--card))}
.callout .ct{font-weight:800;color:var(--c);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.callout p:last-child{margin-bottom:0}
.callout.tip{--c:var(--tip)}.callout.warning{--c:var(--warn)}.callout.danger{--c:var(--danger)}.callout.exercise{--c:var(--exercise)}.callout.quiz{--c:var(--quiz)}.callout.analogy{--c:var(--accent-text)}

/* ============================================================ CODE: highlighter + editor + output */
.tk-kw{color:var(--sx-kw)}.tk-str{color:var(--sx-str)}.tk-num{color:var(--sx-num)}.tk-com{color:var(--sx-com);font-style:italic}
.tk-fn{color:var(--sx-fn)}.tk-bi{color:var(--sx-bi)}.tk-op{color:var(--sx-op)}.tk-re{color:var(--sx-re)}.tk-tag{color:var(--sx-tag)}.tk-attr{color:var(--sx-attr)}
.cb{margin:1.2em 0;border:1px solid var(--border);border-radius:14px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
.cb-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--card2)}
.cb-title{flex:1;min-width:140px;font-weight:700;font-size:.92rem}
.cb-desc{padding:10px 14px 0;font-size:.92rem;color:var(--muted)}
.cb-body{padding:12px}
.ed{position:relative;direction:ltr;background:var(--code-bg);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ed pre,.ed textarea{margin:0;padding:12px 14px;font:13.5px/1.65 var(--mono);white-space:pre;tab-size:2;border:0;letter-spacing:0;text-align:left;direction:ltr;word-spacing:0}
.ed pre{position:absolute;inset:0;overflow:hidden;pointer-events:none;color:var(--code-text)}
.ed pre code{all:unset;font:inherit;white-space:pre}
.ed textarea{position:relative;display:block;width:100%;background:transparent;color:transparent;caret-color:var(--text);resize:none;overflow:auto;outline:none;max-height:520px;min-height:48px}
.ed.editing{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.ed textarea::selection{background:color-mix(in srgb,var(--accent) 38%,transparent);color:transparent}
.out{margin-top:10px;border:1px solid var(--border);border-radius:10px;background:var(--code-bg);overflow:hidden}
.out[hidden]{display:none}
.out-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 12px;font-size:.78rem;color:var(--muted);border-bottom:1px solid var(--border);background:var(--card2)}
.out-b{padding:8px 14px;font:13px/1.65 var(--mono);direction:ltr;text-align:left;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.ln{display:block;padding:1px 0}
.ln.warn{color:var(--warn)}.ln.error{color:var(--danger)}.ln.info{color:var(--info)}.ln.sys{color:var(--faint);font-style:italic}
.err-fa{direction:rtl;text-align:right;font-family:var(--sans);font-size:.92rem;line-height:1.8;margin:6px 0 2px;padding:8px 12px;border-radius:9px;background:color-mix(in srgb,var(--danger) 12%,transparent);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);color:var(--text);white-space:normal}
.err-fa b{color:var(--danger)}
.prev{margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.prev[hidden]{display:none}
.prev iframe{display:block;width:100%;height:230px;border:0;background:#fff}
.expect{margin-top:8px;font-size:.82rem;color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.cmp>div{border-radius:12px;border:1px solid var(--border);overflow:hidden;background:var(--card)}
.cmp .lab{padding:6px 12px;font-weight:800;font-size:.86rem}
.cmp .bad .lab{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.cmp .good .lab{background:color-mix(in srgb,var(--tip) 18%,transparent);color:var(--tip)}
.cmp .ed{border:0;border-radius:0}
.mistake{margin:18px 0}
.mistake .why{margin-top:8px;font-size:.94rem}

/* exercises */
.ex{border:1px solid color-mix(in srgb,var(--exercise) 40%,var(--border));border-radius:14px;margin:16px 0;background:var(--card);overflow:hidden}
.ex-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:color-mix(in srgb,var(--exercise) 10%,var(--card2));font-weight:800}
.lvl{font-size:.74rem;padding:1px 10px;border-radius:99px;font-weight:800}
.lvl.easy{background:color-mix(in srgb,var(--tip) 20%,transparent);color:var(--tip)}
.lvl.medium{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.lvl.hard{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger)}
.ex-b{padding:14px}
details.fold{border:1px solid var(--border);border-radius:10px;margin:10px 0;background:var(--card2)}
details.fold>summary{cursor:pointer;padding:8px 14px;font-weight:700;font-size:.92rem;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"◂";display:inline-block;margin-inline-end:8px;transition:transform .2s;color:var(--accent-text)}
details.fold[open]>summary::before{transform:rotate(-90deg)}
details.fold>.fold-b{padding:4px 14px 14px}

/* quiz */
.quiz{border:1px solid color-mix(in srgb,var(--quiz) 40%,var(--border));border-radius:14px;background:var(--card);padding:16px;margin:14px 0}
.quiz .qn{font-weight:800;color:var(--quiz);font-size:.82rem;margin-bottom:4px}
.quiz .q{font-weight:700;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:start;width:100%;padding:9px 14px;border-radius:11px;border:1px solid var(--border2);background:var(--card2);line-height:1.7;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--quiz)}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font:700 .74rem var(--mono);background:var(--border);margin-top:2px}
.opt.right{border-color:var(--tip);background:color-mix(in srgb,var(--tip) 14%,var(--card2))}
.opt.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,var(--card2))}
.opt[disabled]{cursor:default}
.fb{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:.93rem;display:none}
.fb.show{display:block}
.fb.ok{background:color-mix(in srgb,var(--tip) 12%,transparent);border:1px solid color-mix(in srgb,var(--tip) 40%,transparent)}
.fb.no{background:color-mix(in srgb,var(--danger) 12%,transparent);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.complete-bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:30px;padding:16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card)}
.nav-pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.nav-pn a{display:block;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text)}
.nav-pn a:hover{border-color:var(--accent);text-decoration:none}
.nav-pn small{display:block;color:var(--muted)}
.nav-pn .nx{text-align:end}

/* tests, summary, badges */
.score-big{font-size:2.6rem;font-weight:800;color:var(--accent-text)}
.review{border-inline-start:4px solid var(--danger);padding:10px 14px;margin:10px 0;background:var(--card);border-radius:10px;border:1px solid var(--border)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.bdg{text-align:center;padding:14px 8px;border-radius:14px;border:1px solid var(--border);background:var(--card);filter:grayscale(1);opacity:.55}
.bdg.on{filter:none;opacity:1;border-color:var(--accent);box-shadow:0 0 22px color-mix(in srgb,var(--accent) 25%,transparent)}
.bdg .em{font-size:2rem;line-height:1.2}
.bdg small{display:block;color:var(--muted);font-size:.74rem;line-height:1.5}

/* study plan */
.plan-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.plan-tabs button[aria-pressed="true"]{background:var(--accent);color:#07090d;border-color:var(--accent)}
.plan-row.done td{opacity:.55}
.chk{width:20px;height:20px;accent-color:var(--accent)}

/* playground */
.pg{display:grid;gap:14px}
.snips{display:flex;flex-wrap:wrap;gap:8px}
.snip{display:inline-flex;gap:2px;border:1px solid var(--border2);border-radius:10px;overflow:hidden;background:var(--card2)}
.snip button{border:0;background:transparent;padding:4px 12px;font-size:.86rem}
.snip button:hover{background:var(--border)}

/* event loop widget */
.evl{border:1px solid var(--border);border-radius:14px;background:var(--card);padding:14px;margin:1.2em 0}
.evl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.evl-box{border:1px solid var(--border2);border-radius:12px;padding:8px 10px;min-height:110px;background:var(--card2)}
.evl-box h4{margin:0 0 6px;font-size:.84rem;color:var(--accent-text)}
.evl-item{direction:ltr;text-align:left;font:12.5px var(--mono);padding:3px 8px;margin:3px 0;border-radius:7px;background:color-mix(in srgb,var(--accent) 18%,transparent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);animation:pop .3s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.evl-msg{min-height:3.4em;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--info) 10%,transparent);border:1px solid color-mix(in srgb,var(--info) 35%,transparent)}

#toTop{position:fixed;inset-inline-start:18px;bottom:18px;z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
#toTop.show{opacity:1;pointer-events:auto}
.toast{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:90vw;padding:10px 18px;border-radius:12px;background:var(--card2);border:1px solid var(--border2);box-shadow:var(--shadow);z-index:300;animation:rise .3s ease}
.backdrop{display:none}
dialog{border:1px solid var(--border2);border-radius:16px;background:var(--card);color:var(--text);padding:22px;max-width:min(92vw,440px)}
dialog::backdrop{background:rgba(0,0,0,.6)}

/* ============================================================ RESPONSIVE */
@media (max-width:1100px){.content.has-toc{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:min(86vw,340px);transform:translateX(100%);transition:transform .3s;box-shadow:var(--shadow)}
  html[dir="rtl"] .sidebar{transform:translateX(100%)}
  body.menu-open .sidebar{transform:none}
  body.menu-open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55}
  #menuBtn{display:inline-grid}
  .chip.hide-sm{display:none}
  .nav-pn{grid-template-columns:1fr}
}
@media (max-width:520px){body{font-size:15.5px}.cb-body{padding:8px}.ed pre,.ed textarea{font-size:12.5px}.topbar{gap:6px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{.sidebar,.topbar,#toTop,.toc{display:none}.app{display:block}}

/* ---- graded exam radios ---- */
.opt input[type="radio"]{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
label.opt{cursor:pointer}
label.opt.sel{border-color:var(--quiz);background:color-mix(in srgb,var(--quiz) 14%,var(--card2))}
fieldset.quiz{margin-inline:0}
fieldset.quiz legend{padding:0 6px}
.ed-host{min-width:0}

.btn[hidden],[hidden]{display:none!important}
.prompt-row{display:block;margin-top:8px;font-size:.86rem}
.prompt-row[hidden]{display:none}

<script>
/* ───── core.js ───── */
'use strict';
/* =====================================================================
   SECTION 1 — UTILITIES
   ===================================================================== */
const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
const toFa = (n) => String(n).replace(/\d/g, (d) => FA_DIGITS[d]);

/** Normalizes Persian/Arabic text so that search is forgiving. */
function normalizeText(text) {
  return String(text).toLowerCase()
    .replace(/[ً-ٰٟـ]/g, '')
    .replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/ۀ/g, 'ه').replace(/ة/g, 'ه')
    .replace(/[۰-۹]/g, (d) => FA_DIGITS.indexOf(d))
    .replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/‌/g, ' ');
}

/** Converts standalone numbers in prose to Persian digits (never touches code or Latin-adjacent digits). */
function persianizeDigits(htmlText) {
  return htmlText.replace(/&#\d+;|<[^>]*>|\d+(?:\.\d+)?/g, (match, offset, whole) => {
    if (match[0] === '&' || match[0] === '<') return match;
    const prev = whole[offset - 1] || '';
    const next = whole[offset + match.length] || '';
    if (/[A-Za-z_$]/.test(prev) || /[A-Za-z_$]/.test(next)) return match;
    return toFa(match);
  });
}

/** Inline mini-markup used by all lesson text: `code`, **bold**, and Persian digits in prose. */
function md(text) {
  return String(text).split(/(`[^`]+`)/g).map((part) => {
    if (part.length > 2 && part[0] === '`' && part.endsWith('`')) return '<code>' + escapeHtml(part.slice(1, -1)) + '</code>';
    return persianizeDigits(escapeHtml(part).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'));
  }).join('');
}

/** Plain text version of md() input, used for search indexing. */
const stripMarkup = (text) => String(text).replace(/[`*]/g, '');

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function todayKey(offsetDays = 0) { const d = new Date(); d.setDate(d.getDate() + offsetDays); return d.toLocaleDateString('en-CA'); }
function shuffleSeeded(array, seed) {
  const a = array.slice(); let s = seed >>> 0 || 1;
  const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function toast(message) {
  const node = document.createElement('div');
  node.className = 'toast'; node.setAttribute('role', 'status'); node.textContent = message;
  document.body.appendChild(node);
  setTimeout(() => node.remove(), 2200);
}
function confirmDialog(title, text) {
  return new Promise((resolve) => {
    const dlg = $('#confirmDlg');
    $('#dlgTitle').textContent = title; $('#dlgText').textContent = text;
    const finish = (value) => { dlg.close(); resolve(value); };
    $('#dlgYes').onclick = () => finish(true);
    $('#dlgNo').onclick = () => finish(false);
    dlg.oncancel = () => resolve(false);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else resolve(window.confirm(text));
  });
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (err) { /* ignored */ } ta.remove();
  }
  toast('کپی شد ✓');
}

/* =====================================================================
   SECTION 2 — PERSISTENT STORE (localStorage with safe fallback)
   ===================================================================== */
const Store = {
  KEY: 'jsc.v1',
  data: null,
  defaults() {
    return { done: {}, quiz: {}, tests: {}, final: null, last: null, theme: 'dark', plan: { choice: 8, checks: {} }, days: [], snippets: [], playground: '', openModules: {} };
  },
  load() {
    let parsed = {};
    try { parsed = JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch (e) { parsed = {}; }
    this.data = Object.assign(this.defaults(), parsed);
  },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { /* storage unavailable: keep in memory */ } },
  reset() { this.data = this.defaults(); try { localStorage.removeItem(this.KEY); } catch (e) { /* ignored */ } },
  touchDay() {
    const t = todayKey();
    if (!this.data.days.includes(t)) { this.data.days.push(t); this.data.days = this.data.days.slice(-400); this.save(); }
  },
  streak() {
    const set = new Set(this.data.days);
    let offset = set.has(todayKey()) ? 0 : -1, count = 0;
    while (set.has(todayKey(offset))) { count++; offset--; }
    return count;
  },
};

/* =====================================================================
   SECTION 3 — MODULE METADATA (12 modules, one accent colour each)
   Lessons are attached later through JSCourse.addLessons(...)
   ===================================================================== */
const MODULE_META = [
  { icon: '🚀', color: '#38bdf8', title: 'شروع کار', en: 'Getting Started', badge: 'کاشف', summary: 'جاوااسکریپت چیست، کجا اجرا می‌شود و چگونه محیط کار و اولین برنامه‌تان را آماده کنید.',
    topics: ['جاوااسکریپت چیست و کجا اجرا می‌شود', 'تاریخچه کوتاه', 'ساخت محیط کار: VS Code، کنسول مرورگر، تگ script، Node.js', 'اولین برنامه', 'خواندن پیام‌های خطا'] },
  { icon: '🧱', color: '#34d399', title: 'مبانی زبان', en: 'Fundamentals', badge: 'بنیان‌گذار', summary: 'متغیرها، انواع داده، عملگرها، تبدیل نوع و ورودی/خروجی؛ آجرهای اصلی هر برنامه.',
    topics: ['توضیح‌ها (Comment)', 'var / let / const', 'قواعد نام‌گذاری', 'انواع داده و typeof', 'عملگرها و == در برابر ===', 'تبدیل نوع (Coercion)', 'رشته‌های قالب‌دار', 'console، alert و prompt'] },
  { icon: '🔀', color: '#fbbf24', title: 'کنترل جریان', en: 'Control Flow', badge: 'مسیریاب', summary: 'شرط‌ها و حلقه‌ها؛ یاد می‌گیرید برنامه چطور تصمیم بگیرد و کارها را تکرار کند.',
    topics: ['if / else و عملگر سه‌تایی', 'switch', 'truthy و falsy', 'ارزیابی کوتاه‌مدار، ?? و ?.', 'حلقه‌های for، while، do-while، for...of، for...in', 'break، continue و برچسب‌ها'] },
  { icon: '⚙️', color: '#f472b6', title: 'توابع', en: 'Functions', badge: 'سازنده', summary: 'از تابع ساده تا closure، بازگشت و call/apply/bind؛ قلب جاوااسکریپت.',
    topics: ['تعریف و عبارت تابع', 'تابع پیکانی', 'پارامتر پیش‌فرض، rest و spread', 'دامنه (Scope) و Hoisting', 'Closure', 'Callback و توابع مرتبه بالا', 'توابع خالص، IIFE و بازگشت', 'call / apply / bind'] },
  { icon: '🗂️', color: '#a78bfa', title: 'آرایه‌ها و اشیا', en: 'Arrays & Objects', badge: 'ساختاردهنده', summary: 'ذخیره و پردازش مجموعه داده‌ها: متدهای آرایه، اشیا، Map/Set، JSON و تغییرناپذیری.',
    topics: ['ساخت آرایه و متدهای اصلی', 'map، filter، reduce و ...', 'اشیا و متدها', 'Destructuring و Spread', 'کپی سطحی و عمیق', 'Map، Set، WeakMap', 'JSON', 'Immutability'] },
  { icon: '🔤', color: '#fb923c', title: 'رشته، عدد، تاریخ و RegExp', en: 'Strings, Numbers, Date & RegExp', badge: 'واژه‌پرداز', summary: 'کار با متن، عدد و زمان؛ قالب‌بندی با Intl (حتی تقویم فارسی) و عبارت‌های باقاعده.',
    topics: ['متدهای رشته', 'عدد، Math و دقت اعشار', 'Date', 'Intl و تقویم فارسی', 'مبانی RegExp', 'الگوهای کاربردی'] },
  { icon: '🖱️', color: '#2dd4bf', title: 'DOM و رویدادها', en: 'DOM & Events', badge: 'رابط‌ساز', summary: 'صفحه وب را زنده کنید: انتخاب و ساخت عناصر، رویدادها، فرم‌ها و ذخیره‌سازی مرورگر.',
    topics: ['درخت DOM و انتخاب عناصر', 'ساخت، تغییر و حذف گره‌ها', 'کلاس‌ها و استایل', 'رویدادها، Bubbling، Capturing', 'Event Delegation', 'فرم‌ها و اعتبارسنجی', 'localStorage / sessionStorage', 'IntersectionObserver'] },
  { icon: '🧬', color: '#f87171', title: 'شی‌گرایی', en: 'Object-Oriented JS', badge: 'معمار', summary: 'this، prototype، کلاس‌ها، وراثت، فیلدهای خصوصی و ترکیب در برابر وراثت.',
    topics: ['کلمه this', 'تابع سازنده و prototype', 'کلاس‌های ES6', 'extends و super', 'getter / setter / static / #private', 'Composition و Mixin'] },
  { icon: '⏳', color: '#60a5fa', title: 'جاوااسکریپت ناهمگام', en: 'Asynchronous JS', badge: 'زمان‌شناس', summary: 'Event Loop، Promise، async/await و fetch؛ کار با کارهایی که زمان می‌برند.',
    topics: ['همگام در برابر ناهمگام', 'Call Stack و Event Loop', 'setTimeout و setInterval', 'Callback Hell', 'Promise و ترکیب‌کننده‌ها', 'async / await', 'مدیریت خطا', 'fetch و AbortController'] },
  { icon: '✨', color: '#818cf8', title: 'جاوااسکریپت مدرن', en: 'Modern JS (ES6+)', badge: 'نوآور', summary: 'ماژول‌ها، تکرارگرها، مولدها، Proxy و ابزارهای تازه زبان.',
    topics: ['import / export', 'Iterator و Generator', 'Symbol', 'Proxy و Reflect', 'Tagged Template', 'structuredClone و متدهای تازه', 'import پویا', 'Web Worker'] },
  { icon: '🛡️', color: '#a3e635', title: 'تمرین حرفه‌ای', en: 'Professional Practice', badge: 'حرفه‌ای', summary: 'اشکال‌زدایی، کد تمیز، کارایی، امنیت، تست و ابزارهای دنیای واقعی.',
    topics: ['Debugging و DevTools', 'خطاهای رایج', 'کد تمیز و نام‌گذاری', 'Debounce / Throttle / Memoization', 'امنیت: XSS و eval', 'تست', 'npm، باندلر، Git', 'نگاهی به TypeScript'] },
  { icon: '🏗️', color: '#e879f9', title: 'پروژه‌ها', en: 'Projects', badge: 'استاد', summary: 'هشت پروژه کوچک از ساده تا سخت، با راهنمای گام‌به‌گام و راه‌حل کامل.',
    topics: ['شمارنده', 'فهرست کارها', 'ماشین‌حساب', 'برنامه آزمون', 'ساعت و کرنومتر', 'نقل‌قول تصادفی با API', 'سبد خرید', 'ردیاب هزینه با Canvas'] },
];

/* =====================================================================
   SECTION 4 — COURSE REGISTRY (public API used by the data parts)
   Lesson schema (see README in Part 1 notes):
   { id, title, minutes, goal, explain:[blocks], examples:[{title,desc,code,out}],
     mistakes:[{title,bad,good,why}], tip:{title,text}, exercises:[{level,statement,hint,solution,starter}],
     quiz:[{type,q,code,options,answer,explain}] }
   ===================================================================== */
const JSCourse = {
  modules: MODULE_META.map((meta, index) => Object.assign({ index, lessons: [], test: null }, meta)),
  finalExam: null,
  _flat: null,
  addLessons(moduleIndex, lessons) {
    const mod = this.modules[moduleIndex];
    if (!mod) throw new Error('Unknown module index: ' + moduleIndex);
    lessons.forEach((lesson) => {
      lesson.module = moduleIndex;
      lesson.id = lesson.id || `m${moduleIndex}-l${mod.lessons.length + 1}`;
      mod.lessons.push(lesson);
    });
    this._flat = null;
  },
  setModuleTest(moduleIndex, questions) { this.modules[moduleIndex].test = questions; },
  setFinalExam(questions) { this.finalExam = questions; },
  flat() {
    if (!this._flat) this._flat = this.modules.flatMap((m) => m.lessons);
    return this._flat;
  },
  lesson(id) { return this.flat().find((l) => l.id === id) || null; },
  neighbors(id) {
    const list = this.flat(); const i = list.findIndex((l) => l.id === id);
    return { prev: list[i - 1] || null, next: list[i + 1] || null };
  },
  /** Final exam = override if provided, otherwise a seeded sample of 30 from the module tests (≈3 per module). */
  buildFinalExam(seed) {
    if (this.finalExam && this.finalExam.length) return this.finalExam.slice(0, 30);
    const picked = [];
    this.modules.forEach((m) => {
      if (m.test && m.test.length) picked.push(...shuffleSeeded(m.test.map((q) => Object.assign({ from: m.index }, q)), seed + m.index).slice(0, 3));
    });
    return shuffleSeeded(picked, seed).slice(0, 30);
  },
};
window.JSCourse = JSCourse;

/* ---- authoring helpers for lesson data files ----
   C`...`  : code sample (raw string). Write ¨ for a backtick and ¤{ for ${ inside samples.
   B.*     : explanation blocks      eg/bad/ex : example, mistake, exercise      Qz.* : quiz questions */
const C = (strings) => strings.raw[0].replace(/¨/g, '`').replace(/¤\{/g, '${').replace(/<\\\//g, '</').replace(/<\\!--/g, '<!' + '--').replace(/^\n/, '').replace(/\s+$/, '');
const B = {
  h: (text) => ({ t: 'h', text }), p: (text) => ({ t: 'p', text }),
  ul: (...items) => ({ t: 'ul', items }), ol: (...items) => ({ t: 'ol', items }),
  info: (text, title) => ({ t: 'callout', kind: 'info', title, text }), tip: (text, title) => ({ t: 'callout', kind: 'tip', title, text }),
  warn: (text, title) => ({ t: 'callout', kind: 'warning', title, text }), danger: (text, title) => ({ t: 'callout', kind: 'danger', title, text }),
  analogy: (text, title) => ({ t: 'analogy', text, title }),

    return { dom, stop() { if (!finished) { finished = true; clearTimeout(timer); } Sandbox.runs.delete(id); frame.remove(); } };
  },
};

/* =====================================================================

   ===================================================================== */
Sandbox.stopAll = function () { this.runs.forEach((r) => r.frame.remove()); this.runs.clear(); };

/** Textarea-over-<pre> editor with live syntax highlighting. */
function createEditor(host, { code, lang = 'js', readOnly = true, onRun }) {
  host.classList.add('ed');
  const pre = document.createElement('pre'); pre.setAttribute('aria-hidden', 'true');
  const codeEl = document.createElement('code'); pre.appendChild(codeEl);
  const ta = document.createElement('textarea');
  Object.assign(ta, { spellcheck: false, readOnly, wrap: 'off', value: code });
  ['autocapitalize', 'autocomplete', 'autocorrect'].forEach((a) => ta.setAttribute(a, 'off'));
  ta.setAttribute('dir', 'ltr'); ta.setAttribute('aria-label', 'ویرایشگر کد (برای اجرا Ctrl+Enter)');
  host.append(pre, ta);
  let trapTab = true;
  const render = () => {
    codeEl.innerHTML = highlight(ta.value, lang) + '\n';
    ta.rows = Math.max(2, ta.value.split('\n').length);
    pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft;
  };
  ta.addEventListener('input', render);
  ta.addEventListener('scroll', () => { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; });
  ta.addEventListener('focus', () => host.classList.toggle('editing', !ta.readOnly));
  ta.addEventListener('blur', () => host.classList.remove('editing'));
  ta.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); onRun && onRun(); return; }
    if (ta.readOnly) return;
    if (e.key === 'Escape') { trapTab = false; return; }
    if (e.key === 'Tab' && trapTab) {
      e.preventDefault();
      const { selectionStart: s, selectionEnd: en, value } = ta;
      if (s !== en || e.shiftKey) {
        const lineStart = value.lastIndexOf('\n', s - 1) + 1; const block = value.slice(lineStart, en);
        const changed = e.shiftKey ? block.replace(/^( {1,2}|\t)/gm, '') : block.replace(/^/gm, '  ');
        ta.setRangeText(changed, lineStart, en, 'select'); ta.selectionStart = lineStart;
      } else document.execCommand && document.execCommand('insertText', false, '  ') || ta.setRangeText('  ', s, en, 'end');
      render(); return;
    }
    trapTab = true;
    if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
      const { selectionStart: s, value } = ta; const lineStart = value.lastIndexOf('\n', s - 1) + 1;
      const indent = /^[ \t]*/.exec(value.slice(lineStart, s))[0]; const before = value[s - 1], after = value[s];
      e.preventDefault();
      let insert = '\n' + indent;
      if ('{[('.includes(before)) { insert += '  '; if ((before === '{' && after === '}') || (before === '[' && after === ']') || (before === '(' && after === ')')) insert += '\n' + indent; }
      ta.setRangeText(insert, s, ta.selectionEnd, 'end');
      if (insert.endsWith('\n' + indent) && insert.length > indent.length + 3) ta.selectionStart = ta.selectionEnd = s + insert.length - indent.length - 1;
      render();
    }
  });
  render();
  return {
    get value() { return ta.value; },
    set value(v) { ta.value = v; render(); },
    setReadOnly(flag) { ta.readOnly = flag; },
    focus() { ta.focus(); },
    refresh: render,
  };
}

/* ---- code block registry: HTML strings carry only an id, behaviour is attached by hydrateCodeBlocks() ---- */
const CodeBlocks = { specs: [], reset() { this.specs = []; } };

/**
 * spec: { title, desc, code, lang='js', out (expected sample output), runnable=true, editable=false, ns, compact }
 */
function codeBlockHTML(spec) {
  const id = CodeBlocks.specs.push(spec) - 1;
  const lang = spec.lang || 'js';
  const runnable = spec.runnable !== false && (lang === 'js' || lang === 'html');
  return `<div class="cb" data-cb="${id}">
    <div class="cb-head">
      <span class="cb-title">${spec.title ? md(spec.title) : ''}</span>
      <span class="badge-pill" dir="ltr">${lang === 'js' ? 'JavaScript' : lang.toUpperCase()}</span>
      <button class="btn sm" data-act="copy" type="button" aria-label="کپی کد">📋 کپی</button>
      ${runnable ? '<button class="btn sm" data-act="edit" type="button" aria-pressed="false">✏️ ویرایش</button><button class="btn sm" data-act="reset" type="button" hidden>↺ بازنشانی</button>' : ''}
      ${runnable ? '<button class="btn sm primary" data-act="run" type="button">▶ اجرا</button>' : ''}
    </div>
    ${spec.desc ? `<div class="cb-desc">${md(spec.desc)}</div>` : ''}
    <div class="cb-body">
      <div class="ed-host"></div>
      ${runnable ? `<label class="prompt-row muted" hidden>پاسخ‌های prompt (چند پاسخ را با | جدا کنید): <input class="prompt-in" dir="auto" style="min-width:200px;height:32px;border-radius:8px;border:1px solid var(--border2);background:var(--card2);padding:0 10px" value="${escapeHtml(spec.answers || '')}"></label>
      <div class="prev" hidden></div>
      <div class="out" hidden><div class="out-h"><span class="out-t">خروجی</span><span><span class="out-s"></span> <button class="btn sm" data-act="clear" type="button">پاک کردن</button></span></div><div class="out-b" role="log" aria-live="polite" tabindex="0"></div></div>` : ''}
    </div>
  </div>`;
}

function hydrateCodeBlocks(root) {
  $$('.cb[data-cb]', root).forEach((el) => {
    const spec = CodeBlocks.specs[Number(el.dataset.cb)]; if (!spec || el.dataset.ready) return; el.dataset.ready = '1';
    const lang = spec.lang || 'js';
    const runnable = spec.runnable !== false && (lang === 'js' || lang === 'html');
    const editor = createEditor($('.ed-host', el), { code: spec.code, lang, readOnly: !spec.editable, onRun: () => run() });
    el._editor = editor;
    const outBox = $('.out', el), outBody = $('.out-b', el), outStatus = $('.out-s', el), prev = $('.prev', el), promptRow = $('.prompt-row', el);
    let handle = null, hadOutput = false;
    const addLine = (level, text) => { hadOutput = true; const s = document.createElement('span'); s.className = 'ln ' + level; s.textContent = text; outBody.appendChild(s); outBody.scrollTop = outBody.scrollHeight; };
    const showSample = () => { if (spec.out === undefined || !outBox) return; outBox.hidden = false; $('.out-t', el).textContent = 'خروجی نمونه'; outStatus.textContent = '(برای دیدن خروجی واقعی ▶ بزنید)'; outBody.replaceChildren(); String(spec.out).split('\n').forEach((l) => addLine('sys', l)); hadOutput = false; };
    const syncPrompt = () => { if (promptRow) promptRow.hidden = !/\bprompt\s*\(/.test(editor.value); };
    syncPrompt();
    function run() {
      if (!runnable) return;
      if (handle) handle.stop();
      outBox.hidden = false; $('.out-t', el).textContent = 'خروجی'; outBody.replaceChildren(); hadOutput = false; outStatus.textContent = '⏳ در حال اجرا…';
      prev.hidden = true;
      const answers = $('.prompt-in', el).value ? $('.prompt-in', el).value.split('|') : [];
      handle = Sandbox.run({
        code: editor.value, lang, ns: spec.ns, answers, host: prev,
        onLine: addLine,
        onClear: () => { outBody.replaceChildren(); },
        onError: ({ name, message, line }) => {
          addLine('error', `Uncaught ${name}: ${message}${line ? `   (خط ${toFa(line)})` : ''}`);
          const tip = explainError(name, message);
          if (tip) { const d = document.createElement('div'); d.className = 'err-fa'; d.innerHTML = '<b>راهنمای خطا:</b> ' + escapeHtml(tip); outBody.appendChild(d); }
        },
        onEnd: (reason) => {
          if (reason === 'error') outStatus.textContent = '✗ خطا';
          else { outStatus.textContent = '✓ پایان اجرا'; if (!hadOutput && !handle.dom) addLine('sys', '(برنامه خروجی‌ای نداشت؛ برای دیدن نتیجه از console.log استفاده کنید.)'); }
        },
      });
      prev.hidden = !handle.dom;
    }
    el.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-act]'); if (!btn || !el.contains(btn)) return;
      const act = btn.dataset.act;
      if (act === 'copy') copyText(editor.value);
      else if (act === 'run') run();
      else if (act === 'clear') { outBody.replaceChildren(); outStatus.textContent = ''; if (handle) { handle.stop(); handle = null; } prev.hidden = true; showSample(); if (spec.out === undefined) outBox.hidden = true; }
      else if (act === 'reset') { editor.value = spec.code; syncPrompt(); }
      else if (act === 'edit') {
        const on = btn.getAttribute('aria-pressed') !== 'true';
        btn.setAttribute('aria-pressed', String(on)); btn.textContent = on ? '🔒 قفل' : '✏️ ویرایش';
        $('[data-act="reset"]', el).hidden = !on; editor.setReadOnly(!on); if (on) editor.focus();
      }
    });
    el.addEventListener('input', syncPrompt);
    if (spec.editable) { const eb = $('[data-act="edit"]', el); if (eb) { eb.setAttribute('aria-pressed', 'true'); eb.textContent = '🔒 قفل'; $('[data-act="reset"]', el).hidden = false; } }
    if (runnable) showSample();
    if (spec.autorun) run();
  });
}

const Widgets = {}; // name → () => html ; optional Widgets[name].mount(root)

const CALLOUT_META = {
  info: { icon: 'ℹ️', title: 'یادآوری' }, tip: { icon: '💡', title: 'نکته' }, warning: { icon: '⚠️', title: 'هشدار' },
  danger: { icon: '⛔', title: 'خطای رایج' }, exercise: { icon: '🧪', title: 'تمرین' }, quiz: { icon: '❓', title: 'سؤال' }, analogy: { icon: '🧩', title: 'مثال از زندگی واقعی' },
};
function calloutHTML(kind, title, text) {
  const meta = CALLOUT_META[kind] || CALLOUT_META.info;
  const paragraphs = String(text).split('\n\n').map((p) => `<p>${md(p)}</p>`).join('');
  return `<div class="callout ${kind}" role="note"><div class="ct"><span aria-hidden="true">${meta.icon}</span>${md(title || meta.title)}</div>${paragraphs}</div>`;
}

let headingCounter = 0;
/** Renders one explanation block. Collects h3 headings for the table of contents. */
function blockHTML(block, toc) {
  switch (block.t) {
    case 'h': { const id = 'h' + (++headingCounter); toc && toc.push({ id, text: stripMarkup(block.text), level: 3 }); return `<h3 id="${id}">${md(block.text)}</h3>`; }
    case 'p': return String(block.text).split('\n\n').map((p) => `<p>${md(p)}</p>`).join('');
    case 'ul': case 'ol': return `<${block.t} class="list">${block.items.map((i) => `<li>${md(i)}</li>`).join('')}</${block.t}>`;
    case 'callout': return calloutHTML(block.kind || 'info', block.title, block.text);
    case 'analogy': return calloutHTML('analogy', block.title, block.text);
    case 'code': return codeBlockHTML({ title: block.title, desc: block.desc, code: block.code, lang: block.lang || 'js', runnable: block.run !== false && (block.lang || 'js') === 'js' ? true : block.run === true, out: block.out, ns: block.ns });
    case 'table': return `<table class="t"><thead><tr>${block.head.map((h) => `<th>${md(h)}</th>`).join('')}</tr></thead><tbody>${block.rows.map((r) => `<tr>${r.map((c) => `<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    case 'widget': return Widgets[block.name] ? Widgets[block.name](block) : '';
    case 'html': return block.html;
    default: return '';
  }
}

function sectionHTML(id, icon, title, inner) {
  return `<section class="sec" id="${id}" aria-labelledby="${id}-t"><h2 id="${id}-t"><span class="ic" aria-hidden="true">${icon}</span>${title}</h2>${inner}</section>`;
}

/* ---------- instant-feedback quiz (lessons) ---------- */
function normalizeQuestion(q) {
  const options = q.type === 'tf' ? ['درست', 'نادرست'] : q.options;
  const answer = q.type === 'tf' ? (q.answer === true || q.answer === 0 ? 0 : 1) : q.answer;
  return Object.assign({}, q, { options, answer });
}
const optionHTML = (q, o) => (q.type === 'output' ? `<code>${escapeHtml(o)}</code>` : md(o));
function questionBodyHTML(q) {
  const typeLabel = { mcq: 'چندگزینه‌ای', tf: 'درست / نادرست', output: 'پیش‌بینی خروجی' }[q.type] || 'سؤال';
  return `<div class="qn">${typeLabel}</div><div class="q">${md(q.q)}</div>${q.code ? codeBlockHTML({ code: q.code, runnable: false, lang: 'js' }) : ''}`;
}
function quizHTML(questions) {
  return questions.map(normalizeQuestion).map((q, i) => `<div class="quiz" data-qi="${i}">
    <div class="qn">سؤال ${toFa(i + 1)} از ${toFa(questions.length)}</div>${questionBodyHTML(q)}
    <div class="opts" role="group" aria-label="گزینه‌ها">${q.options.map((o, k) => `<button type="button" class="opt" data-k="${k}"><span class="k" aria-hidden="true">${'ABCDEF'[k]}</span><span>${optionHTML(q, o)}</span></button>`).join('')}</div>
    <div class="fb" role="status"></div></div>`).join('');
}
function hydrateQuiz(root, questions, lessonId) {
  const qs = questions.map(normalizeQuestion); let answered = 0, correct = 0;
  $$('.quiz', root).forEach((box) => {
    const q = qs[Number(box.dataset.qi)];
    box.addEventListener('click', (e) => {
      const btn = e.target.closest('.opt'); if (!btn || btn.disabled) return;
      const pick = Number(btn.dataset.k); const ok = pick === q.answer;
      $$('.opt', box).forEach((b) => { b.disabled = true; if (Number(b.dataset.k) === q.answer) b.classList.add('right'); });
      if (!ok) btn.classList.add('wrong');
      const fb = $('.fb', box); fb.className = 'fb show ' + (ok ? 'ok' : 'no');
      fb.innerHTML = `<b>${ok ? '✅ درست است!' : '❌ نادرست.'}</b> ${md(q.explain || '')}`;
      answered++; if (ok) correct++;
      if (answered === qs.length) {
        Store.data.quiz[lessonId] = { score: correct, total: qs.length, date: Date.now() }; Store.touchDay(); Store.save();
        toast(`نتیجه آزمونک: ${toFa(correct)} از ${toFa(qs.length)}`);
      }

}

/* ---------- graded test (module tests / final exam) ---------- */
function examHTML(questions, name) {
  return `<form class="exam" data-exam="${name}" novalidate>${questions.map(normalizeQuestion).map((q, i) => `<fieldset class="quiz" data-qi="${i}" style="min-width:0">
    <legend class="qn">سؤال ${toFa(i + 1)} از ${toFa(questions.length)}</legend>${questionBodyHTML(q).replace('<div class="qn">', '<div class="qn" style="display:none">')}
    <div class="opts">${q.options.map((o, k) => `<label class="opt"><input type="radio" name="q${i}" value="${k}"><span class="k" aria-hidden="true">${'ABCDEF'[k]}</span><span>${optionHTML(q, o)}</span></label>`).join('')}</div></fieldset>`).join('')}
    <div class="row" style="margin-top:16px"><button class="btn primary" type="submit">ثبت پاسخ‌ها و دیدن نتیجه</button><span class="muted" data-role="count"></span></div></form>`;
}
function hydrateExam(root, questions, onSubmit) {
  const qs = questions.map(normalizeQuestion); const form = $('form.exam', root);

function reviewHTML(questions, picks) {

      <p class="why"><b>چرا؟</b> ${md(m.why)}</p></div>`).join(''));
  }
  if (lesson.tip) { addSec('s-tip', '💡', 'نکته حرفه‌ای'); body += sectionHTML('s-tip', '💡', 'نکته حرفه‌ای', calloutHTML('tip', lesson.tip.title || 'بهترین روش', lesson.tip.text)); }
  if (lesson.exercises && lesson.exercises.length) { addSec('s-ex', '🧪', 'تمرین‌ها'); body += sectionHTML('s-ex', '🧪', 'تمرین‌ها', lesson.exercises.map((ex, i) => exerciseHTML(ex, lesson.id, i)).join('')); }
  if (lesson.quiz && lesson.quiz.length) { addSec('s-quiz', '❓', 'آزمونک'); body += sectionHTML('s-quiz', '❓', 'آزمونک', quizHTML(lesson.quiz)); }
  addSec('s-done', '✅', 'پایان درس');
  const done = Progress.isDone(lesson.id);
  body += `<section class="sec" id="s-done"><div class="complete-bar"><div><b>${done ? '🎉 این درس را کامل کرده‌اید.' : 'درس را تمام کردید؟'}</b><div class="muted" style="font-size:.88rem">پیشرفت شما در مرورگر ذخیره می‌شود.</div></div>
    <button class="btn ${done ? '' : 'primary'}" id="completeBtn" type="button" aria-pressed="${done}">${done ? '✓ تکمیل شد (لغو)' : '✅ علامت‌گذاری درس به‌عنوان تکمیل‌شده'}</button></div>
    <nav class="nav-pn" aria-label="ناوبری درس‌ها">${nb.prev ? `<a href="#/l/${nb.prev.id}" rel="prev"><small>→ درس قبلی</small>${md(nb.prev.title)}</a>` : '<span></span>'}${nb.next ? `<a class="nx" href="#/l/${nb.next.id}" rel="next"><small>درس بعدی ←</small>${md(nb.next.title)}</a>` : `<a class="nx" href="#/test/${lesson.module}"><small>پایان ماژول</small>آزمون ماژول ←</a>`}</nav></section>`;
  const head = `<header class="lesson-head"><div class="crumbs"><a href="#/m/${mod.index}">${mod.icon} ماژول ${toFa(mod.index)}: ${md(mod.title)}</a></div><h1>${md(lesson.title)}</h1>
    <div class="meta"><span class="badge-pill">⏱ حدود ${toFa(lesson.minutes || 20)} دقیقه</span><span class="badge-pill">${lesson.project ? '🏗️ پروژه' : '📘 درس'}</span></div></header>`;
  const tocHTML = `<nav class="toc" aria-label="فهرست این درس"><b>در این درس</b>${toc.map((t) => `<a href="#${t.id}" data-toc="${t.id}" style="padding-inline-start:${t.level === 3 ? 12 : 0}px;${t.level === 3 ? 'font-size:.82rem' : ''}">${md(t.text)}</a>`).join('')}</nav>`;
  return { html: `<article class="page">${head}${body}</article>${tocHTML}`, toc };
}

function hydrateLesson(root, lesson) {
  hydrateCodeBlocks(root);
  if (lesson.quiz) hydrateQuiz(root, lesson.quiz, lesson.id);
  Object.keys(Widgets).forEach((name) => { if (Widgets[name].mount) $$(`[data-widget="${name}"]`, root).forEach((n) => Widgets[name].mount(n)); });
  const btn = $('#completeBtn', root);
  btn.addEventListener('click', () => {
    if (Progress.isDone(lesson.id)) { Progress.unmarkDone(lesson.id); toast('علامت تکمیل برداشته شد'); }
    else {
      Progress.markDone(lesson.id); toast('🎉 آفرین! درس تکمیل شد');
      const mod = Progress.module(lesson.module);
      if (mod.done === mod.total) toast(`🏅 نشان «${JSCourse.modules[lesson.module].badge}» باز شد!`);
    }
    App.refreshChrome(); App.route({ keepScroll: true });
    $('#s-done') && $('#s-done').scrollIntoView({ block: 'center' });
  });
  const links = $$('.toc a', root); const spy = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) { links.forEach((a) => a.classList.toggle('active', a.dataset.toc === en.target.id)); } });
  }, { rootMargin: '-80px 0px -70% 0px' });
  links.forEach((a) => { const t = document.getElementById(a.dataset.toc); if (t) spy.observe(t); });
  App.cleanups.push(() => spy.disconnect());
}

/* =====================================================================
   SECTION 10 — INTERACTIVE WIDGETS (usable from lessons with {t:'widget', name})
   ===================================================================== */
(function registerEventLoopWidget() {
  const CODE = ["console.log('A');", "setTimeout(() => console.log('B'), 0);", "Promise.resolve().then(() => console.log('C'));", "console.log('D');"];
  const S = (line, stack, web, micro, tasks, log, msg) => ({ line, stack, web, micro, tasks, log, msg });
  const STEPS = [
    S(-1, [], [], [], [], [], 'برنامه هنوز شروع نشده است. با «قدم بعدی» اجرا را مرحله‌به‌مرحله دنبال کنید. جاوااسکریپت فقط یک پشته (Call Stack) دارد و هر لحظه فقط یک کار را انجام می‌دهد.'),
    S(-1, ['main()'], [], [], [], [], 'کل اسکریپت مانند یک تابع بزرگ به نام main() روی Call Stack قرار می‌گیرد.'),
    S(0, ['main()', "console.log('A')"], [], [], [], [], 'خط اول: console.log پشته را پر می‌کند. این کار همگام است و بلافاصله انجام می‌شود.'),
    S(0, ['main()'], [], [], [], ['A'], 'خروجی «A» چاپ شد و تابع از پشته خارج شد.'),
    S(1, ['main()', 'setTimeout(cb, 0)'], [], [], [], ['A'], 'خط دوم: setTimeout خودش کار را انجام نمی‌دهد؛ فقط از مرورگر می‌خواهد یک زمان‌سنج بسازد.'),
    S(1, ['main()'], ['timer: cbB'], [], [], ['A'], 'زمان‌سنج در Web APIs (خارج از جاوااسکریپت) شروع به کار می‌کند. پشته آزاد شد و برنامه ادامه می‌دهد.'),
    S(1, ['main()'], [], [], ['cbB'], ['A'], 'زمان‌سنج ۰ میلی‌ثانیه‌ای تمام شد، اما callback اجازه ندارد وسط کار بپرد؛ در صف وظایف (Task Queue) منتظر می‌ماند.'),
    S(2, ['main()', 'promise.then(cb)'], [], [], ['cbB'], ['A'], 'خط سوم: Promise.resolve() همین حالا آماده است و then یک callback ثبت می‌کند.'),
    S(2, ['main()'], [], ['cbC'], ['cbB'], ['A'], 'callback مربوط به Promise وارد صف ریزوظایف (Microtask Queue) شد. این صف از Task Queue اولویت بالاتری دارد.'),
    S(3, ['main()', "console.log('D')"], [], ['cbC'], ['cbB'], ['A'], 'خط چهارم: هنوز داخل main() هستیم؛ هر کد همگام تا پایان کار خودش را می‌کند.'),
    S(3, ['main()'], [], ['cbC'], ['cbB'], ['A', 'D'], 'خروجی «D» چاپ شد. هر دو callback همچنان منتظرند.'),
    S(-1, [], [], ['cbC'], ['cbB'], ['A', 'D'], 'main() تمام شد و پشته خالی است. حالا Event Loop وارد کار می‌شود.'),
    S(-1, ['cbC'], [], [], ['cbB'], ['A', 'D'], 'قانون اول Event Loop: قبل از هر چیز، همه ریزوظایف را اجرا کن. پس cbC روی پشته می‌رود.'),
    S(-1, [], [], [], ['cbB'], ['A', 'D', 'C'], 'خروجی «C» چاپ شد. صف ریزوظایف خالی است.'),
    S(-1, ['cbB'], [], [], [], ['A', 'D', 'C'], 'قانون دوم: حالا فقط یک وظیفه از Task Queue برداشته می‌شود؛ cbB روی پشته می‌رود.'),
    S(-1, [], [], [], [], ['A', 'D', 'C', 'B'], 'خروجی «B» چاپ شد. ترتیب نهایی: A، D، C، B. با اینکه setTimeout قبل از Promise نوشته شد، اولویت با ریزوظایف است.'),
  ];
  const box = (title, items) => `<div class="evl-box"><h4>${title}</h4>${items.map((i) => `<div class="evl-item">${escapeHtml(i)}</div>`).join('')}</div>`;
  const widget = () => `<div class="evl" data-widget="eventLoop"><b>🎬 شبیه‌ساز Event Loop</b><pre class="ltr" style="margin:10px 0;background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;overflow:auto;font-size:13px" data-role="code"></pre><div data-role="grid"></div><div class="evl-msg" data-role="msg" role="status" aria-live="polite"></div><div class="row" style="margin-top:10px"><button class="btn sm" data-a="prev" type="button">→ قدم قبلی</button><button class="btn sm primary" data-a="next" type="button">قدم بعدی ←</button><button class="btn sm" data-a="reset" type="button">↺ از اول</button><span class="muted" data-role="count"></span></div></div>`;
  widget.mount = (node) => {
    let i = 0;
    const draw = () => {
      const s = STEPS[i];
      $('[data-role="code"]', node).innerHTML = CODE.map((l, n) => `<span style="display:block;${n === s.line ? 'background:color-mix(in srgb,var(--warn) 22%,transparent);border-radius:4px' : ''}">${highlightJS(l)}</span>`).join('');
      $('[data-role="grid"]', node).innerHTML = `<div class="evl-grid">${box('📚 Call Stack', s.stack.slice().reverse())}${box('🌐 Web APIs', s.web)}${box('⚡ Microtask Queue', s.micro)}${box('📬 Task Queue', s.tasks)}${box('🖥️ Console', s.log)}</div>`;
      $('[data-role="msg"]', node).textContent = s.msg;
      $('[data-role="count"]', node).textContent = `مرحله ${toFa(i + 1)} از ${toFa(STEPS.length)}`;
      $('[data-a="prev"]', node).disabled = i === 0; $('[data-a="next"]', node).disabled = i === STEPS.length - 1;
    };
    node.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-a]'); if (!b) return;
      if (b.dataset.a === 'next' && i < STEPS.length - 1) i++; else if (b.dataset.a === 'prev' && i > 0) i--; else if (b.dataset.a === 'reset') i = 0;
      draw();
    });
    draw();
  };
  Widgets.eventLoop = widget;
})();

const accentStyle = (mod) => `style="--accent:${mod.color}"`;

function firstUnfinishedLesson() { return JSCourse.flat().find((l) => !Progress.isDone(l.id)) || JSCourse.flat()[0] || null; }

  return { html: `<div class="page">

      <div class="row">${cont}<a class="btn" href="#/plan">🗓️ برنامه مطالعه</a><a class="btn" href="#/playground">🧪 زمین‌بازی</a></div></section>
    <div class="grid cols-3" style="margin:22px 0">
      <div class="card row"><div class="ring" style="--p:${overall.pct}"><span>${toFa(overall.pct)}٪</span></div><div><b>پیشرفت کل</b><div class="muted">${toFa(overall.done)} از ${toFa(overall.total)} درس</div></div></div>
      <div class="card"><b>🔥 رکورد مطالعه</b><div class="score-big">${toFa(Store.streak())}</div><div class="muted">روز متوالی</div></div>
      <div class="card"><b>⏱ زمان تقریبی دوره</b><div class="score-big">${toFa(Math.round(totalMinutes / 60))}</div><div class="muted">ساعت مطالعه و تمرین</div></div></div>
    <h2>نقشه راه</h2><div class="card"><div class="roadmap">${JSCourse.modules.map((m) => { const p = Progress.module(m.index); return `<div class="rm ${p.total && p.done === p.total ? 'done' : ''}" ${accentStyle(m)}><div class="node">${toFa(m.index)}</div><a href="#/m/${m.index}">${md(m.title)}</a><small>${p.total ? toFa(p.pct) + '٪' : m.icon}</small></div>`; }).join('')}</div></div>
    <div class="grid cols-2" style="margin:24px 0"><div class="card"><h3>👥 این دوره برای چه کسانی است؟</h3><ul class="list"><li>کسانی که هیچ تجربه برنامه‌نویسی ندارند و می‌خواهند از پایه شروع کنند.</li><li>دانشجویان و علاقه‌مندان به وب که می‌خواهند مفاهیم را عمیق و اصولی بفهمند.</li><li>برنامه‌نویسان زبان‌های دیگر که به جاوااسکریپت مدرن مهاجرت می‌کنند.</li><li>کسانی که برای مصاحبه شغلی مرور منظم می‌خواهند.</li></ul></div>
      <div class="card"><h3>✅ پیش‌نیازها</h3><ul class="list"><li>کار با رایانه و مرورگر وب در حد عادی.</li><li>آشنایی ابتدایی با HTML مفید است، اما ضروری نیست.</li><li>یک ویرایشگر کد (VS Code) و مرورگر مدرن؛ برای شروع حتی همین صفحه کافی است.</li><li>روزی ۳۰ تا ۶۰ دقیقه وقت و تمرین مداوم.</li></ul></div></div>
    <h2>ماژول‌ها</h2><div class="grid cols-3">${JSCourse.modules.map((m) => { const p = Progress.module(m.index); return `<a class="mcard" href="#/m/${m.index}" ${accentStyle(m)}><span class="num">ماژول ${toFa(m.index)} · ${m.icon}</span><h3>${md(m.title)}</h3><p>${md(m.summary)}</p><div class="progress" aria-hidden="true"><i style="width:${p.pct}%"></i></div><small class="muted">${p.total ? `${toFa(p.done)} از ${toFa(p.total)} درس` : 'به‌زودی'}</small></a>`; }).join('')}</div>

}

function modulePage(index) {
  const m = JSCourse.modules[index]; if (!m) return notFoundPage(); const p = Progress.module(index); const test = Store.data.tests[index]; const bd = Progress.badge(index);
  return { html: `<div class="page" ${accentStyle(m)}><div class="crumbs"><a href="#/">خانه</a> › ماژول ${toFa(index)}</div>
    <div class="hero"><span class="badge-pill">${m.icon} ماژول ${toFa(index)} · ${escapeHtml(m.en)}</span><h1 style="margin-top:12px">${md(m.title)}</h1><p class="lead">${md(m.summary)}</p>
      <div class="progress" style="max-width:420px"><i style="width:${p.pct}%"></i></div><p class="muted" style="margin-top:6px">${toFa(p.done)} از ${toFa(p.total)} درس تکمیل شده · نشان «${m.badge}»: ${bd.unlocked ? '🏅 باز شده' + (bd.star ? ' ⭐' : '') : '🔒 قفل'}</p></div>
    <div class="grid cols-2" style="margin:20px 0"><div class="card"><h3>📌 سرفصل‌ها</h3><ul class="list">${m.topics.map((t) => `<li>${md(t)}</li>`).join('')}</ul></div>
    <div class="card"><h3>📘 درس‌ها</h3>${m.lessons.length ? `<ol class="list">${m.lessons.map((l) => `<li><a href="${lessonLink(l)}">${md(l.title)}</a> ${Progress.isDone(l.id) ? '✅' : ''}<small class="muted"> · ${toFa(l.minutes || 20)} دقیقه</small></li>`).join('')}</ol>` : '<p class="muted">درس‌های این ماژول هنوز بارگذاری نشده‌اند.</p>'}
      ${m.test ? `<a class="btn primary" href="#/test/${index}">🏁 آزمون ماژول${test ? ` (بهترین نتیجه: ${toFa(test.best)}٪)` : ''}</a>` : ''}</div></div></div>` };
}

function notFoundPage() { return { html: '<div class="page card"><h1>صفحه پیدا نشد</h1><p>آدرس درخواستی وجود ندارد.</p><a class="btn primary" href="#/">بازگشت به خانه</a></div>' }; }

/* ---------- module test + final exam ---------- */
function resultCard(title, score, total, pct, passed) {
  return `<div class="card row" style="margin:16px 0"><div class="ring" style="--p:${pct};--s:110px"><span>${toFa(pct)}٪</span></div><div><h2 style="margin:0">${title}</h2><div class="score-big" style="font-size:1.8rem">${toFa(score)} از ${toFa(total)}</div><p style="margin:0">${passed ? '🎉 قبول شدید (حداقل نمره ۷۰٪).' : 'برای قبولی حداقل ۷۰٪ لازم است؛ درس‌ها را مرور کنید و دوباره تلاش کنید.'}</p></div></div>`;
}
function testPage(index) {
  const m = JSCourse.modules[index]; if (!m) return notFoundPage();
  if (!m.test || !m.test.length) return { html: `<div class="page card" ${accentStyle(m)}><h1>آزمون ماژول ${toFa(index)}</h1><p class="muted">آزمون این ماژول هنوز بارگذاری نشده است.</p><a class="btn" href="#/m/${index}">بازگشت به ماژول</a></div>` };
  return { html: `<div class="page" ${accentStyle(m)}><div class="crumbs"><a href="#/m/${index}">${m.icon} ماژول ${toFa(index)}: ${md(m.title)}</a> › آزمون</div><h1>🏁 آزمون ماژول ${toFa(index)}</h1>
    <p class="muted">${toFa(m.test.length)} سؤال. نمره منفی ندارد؛ در پایان پاسخ‌های اشتباه همراه با توضیح نمایش داده می‌شوند.</p><div id="examArea">${examHTML(m.test, 'm' + index)}</div></div>`,
    mount(root) {
      hydrateCodeBlocks(root);
      hydrateExam(root, m.test, (picks) => {
        const score = picks.filter((p, i) => p === normalizeQuestion(m.test[i]).answer).length; const pct = Math.round((score / m.test.length) * 100);
        const prev = Store.data.tests[index]; Store.data.tests[index] = { score, total: m.test.length, pct, best: Math.max(pct, prev ? prev.best : 0), date: Date.now() }; Store.touchDay(); Store.save();
        $('#examArea', root).innerHTML = resultCard('نتیجه آزمون', score, m.test.length, pct, pct >= 70) + reviewHTML(m.test, picks) + `<div class="row" style="margin-top:16px"><a class="btn primary" href="#/test/${index}" onclick="setTimeout(App.route,0)">↺ تلاش دوباره</a><a class="btn" href="#/m/${index}">بازگشت به ماژول</a></div>`;
        hydrateCodeBlocks(root); App.refreshChrome(); window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    } };
}

let finalExamState = null;
function finalPage() {
  if (!finalExamState) finalExamState = { seed: (Date.now() % 100000) + 1 };
  const questions = JSCourse.buildFinalExam(finalExamState.seed);
  if (!questions.length) return { html: '<div class="page card"><h1>آزمون پایانی</h1><p class="muted">برای ساخته شدن آزمون پایانی، ابتدا باید آزمون ماژول‌ها بارگذاری شده باشند.</p></div>' };
  const prior = Store.data.final;
  return { html: `<div class="page"><h1>🎓 آزمون پایانی دوره</h1><p class="muted">${toFa(questions.length)} سؤال از همه ماژول‌ها${prior ? ` · بهترین نتیجه قبلی: ${toFa(prior.best)}٪` : ''}.</p><div id="examArea">${examHTML(questions, 'final')}</div></div>`,
    mount(root) {
      hydrateCodeBlocks(root);

/* ---------- study plan: topics of all modules are spread over 8 / 12 / 20 weeks ---------- */
const PLAN_SETTINGS = { 8: { daysPerWeek: 6, label: 'فشرده' }, 12: { daysPerWeek: 5, label: 'متعادل' }, 20: { daysPerWeek: 4, label: 'آرام' } };
function buildPlan(weeks) {
  const items = [];
  JSCourse.modules.forEach((m) => {
    m.topics.forEach((t) => items.push({ text: t, mod: m.index, minutes: m.index === 11 ? 70 : 35 }));
    if (m.index < 11) items.push({ text: `آزمون ماژول ${toFa(m.index)} و مرور اشتباهات`, mod: m.index, minutes: 40, link: `#/test/${m.index}` });
  });
  items.push({ text: 'آزمون پایانی دوره', mod: 11, minutes: 60, link: '#/final' });
  const result = []; const total = items.length;
  for (let w = 0; w < weeks; w++) result.push(items.slice(Math.floor((w * total) / weeks), Math.floor(((w + 1) * total) / weeks)));
  return result;
}
function planPage() {
  const choice = Store.data.plan.choice; const settings = PLAN_SETTINGS[choice]; const plan = buildPlan(choice); const checks = Store.data.plan.checks;
  const doneCount = plan.reduce((s, week, w) => s + week.filter((_, t) => checks[`${choice}:${w}:${t}`]).length, 0); const totalCount = plan.reduce((s, w) => s + w.length, 0);
  const rows = plan.map((week, w) => {
    const minutes = week.reduce((s, i) => s + i.minutes, 0); const daily = Math.max(15, Math.round(minutes / settings.daysPerWeek / 5) * 5);
    const allDone = week.every((_, t) => checks[`${choice}:${w}:${t}`]);
    return `<tr class="plan-row ${allDone ? 'done' : ''}"><td><b>هفته ${toFa(w + 1)}</b></td><td>${week.map((item, t) => { const key = `${choice}:${w}:${t}`; return `<label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:4px" ${accentStyle(JSCourse.modules[item.mod])}><input class="chk" type="checkbox" data-key="${key}" ${checks[key] ? 'checked' : ''}><span><small class="badge-pill">${toFa(item.mod)}</small> ${item.link ? `<a href="${item.link}">${item.text}</a>` : md(item.text)}</span></label>`; }).join('')}</td><td>≈ ${toFa(daily)} دقیقه<br><small class="muted">${toFa(settings.daysPerWeek)} روز در هفته</small></td></tr>`;
  }).join('');
  return { html: `<div class="page"><h1>🗓️ برنامه مطالعه</h1><p class="muted">یکی از سه برنامه را انتخاب کنید. سرفصل‌های همه ماژول‌ها به‌طور مساوی بین هفته‌ها پخش شده‌اند. هر مورد را که تمام کردید تیک بزنید؛ تیک‌ها در مرورگر ذخیره می‌شوند.</p>
    <div class="plan-tabs" role="group" aria-label="انتخاب برنامه">${[8, 12, 20].map((n) => `<button class="btn" type="button" data-plan="${n}" aria-pressed="${n === choice}">${toFa(n)} هفته · ${PLAN_SETTINGS[n].label}</button>`).join('')}</div>
    <div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><b>پیشرفت این برنامه</b><span>${toFa(doneCount)} از ${toFa(totalCount)}</span></div><div class="progress" style="margin-top:8px"><i style="width:${totalCount ? Math.round(doneCount / totalCount * 100) : 0}%"></i></div></div>
    <table class="t"><thead><tr><th>هفته</th><th>کارهای این هفته</th><th>زمان روزانه</th></tr></thead><tbody>${rows}</tbody></table></div>`,
    mount(root) {
      $$('[data-plan]', root).forEach((b) => b.addEventListener('click', () => { Store.data.plan.choice = Number(b.dataset.plan); Store.save(); App.route({ keepScroll: true }); }));
      $$('.chk', root).forEach((c) => c.addEventListener('change', () => { if (c.checked) { Store.data.plan.checks[c.dataset.key] = 1; Store.touchDay(); } else delete Store.data.plan.checks[c.dataset.key]; Store.save(); App.route({ keepScroll: true }); }));
    } };
}
