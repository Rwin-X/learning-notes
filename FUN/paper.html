<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper</title>
<style>
:root{--bg:#e9e9e6;--bar:#fff;--ink:#1a1a1a;--mute:#8a8a86;--line:#e4e4e0;--hover:#f0f0ed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--bar:#242423;--ink:#ececea;--mute:#8d8d88;--line:#383836;--hover:#30302e}}
:root[data-theme="dark"]{--bg:#171716;--bar:#242423;--ink:#ececea;--mute:#8d8d88;--line:#383836;--hover:#30302e}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
.app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 22px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
.g{display:flex;align-items:center;gap:2px}
.g.col{gap:6px}
.b{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--ink);cursor:pointer;padding:0}
.b svg{width:18px;height:18px}
.b:hover{background:var(--hover)}
.b.on{background:var(--ink);color:var(--bar)}
.b:disabled{opacity:.3;cursor:default;background:none}
.b:focus-visible,.sw:focus-visible,.cc:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);padding:0;cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--bar),0 0 0 3.5px var(--ink)}
.cc{width:26px;height:26px;padding:3px;border:0;border-radius:50%;background:conic-gradient(#e5484d,#f5b800,#30a46c,#0091ff,#e93d82,#e5484d);cursor:pointer;-webkit-appearance:none;appearance:none}
.cc::-webkit-color-swatch-wrapper{padding:0}
.cc::-webkit-color-swatch{border:2px solid var(--bar);border-radius:50%}
.cc::-moz-color-swatch{border:2px solid var(--bar);border-radius:50%}
#size{width:110px;accent-color:var(--ink)}
#sv{min-width:22px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums;margin-left:8px}
#stage{flex:1;min-height:0;display:grid;place-items:center}
#c{display:block;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.14);touch-action:none}
#cur{position:fixed;left:0;top:0;display:none;pointer-events:none;border:1px solid #fff;border-radius:50%;mix-blend-mode:difference}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bar);padding:7px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="g" id="tools"></div>
    <div class="g col" id="colors"></div>
    <div class="g"><input id="size" type="range" min="1" max="60" value="4" aria-label="Brush size" title="Size ( [ and ] )"><span id="sv">4</span></div>
    <div class="g" id="acts"></div>
  </header>
  <main id="stage"><canvas id="c"></canvas></main>
</div>
<div id="cur"></div>
<div id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d',{willReadFrequently:true}),stage=$('stage'),cur=$('cur');
const portrait=stage.clientHeight>stage.clientWidth*1.05;
const W=portrait?800:1200,H=portrait?1200:800;
cv.width=W;cv.height=H;
ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);

const ic=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d.split('|').map(p=>`<path d="${p}"/>`).join('')}</svg>`;
const TOOLS=[
 ['pencil','Pencil','p','M12 20h9|M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z'],
 ['brush','Soft brush','b','M9 11.9l8.1-8a2.85 2.85 0 114 4L13 16|M7 15a3 3 0 00-3 3c0 1.3-2.5 1.5-2 2 1.1 1.1 2.5 2 4 2a4 4 0 004-4 3 3 0 00-3-3z'],
 ['marker','Marker','m','M9 11l-6 6v3h9l3-3|M22 12l-4.6 4.6a2 2 0 01-2.8 0l-5.2-5.2a2 2 0 010-2.8L14 4'],
 ['spray','Spray','s','M4 10h6v10H4z|M6 6h2v4H6z|M14 7h.01|M17 5h.01|M17 9h.01|M20 7h.01|M14 11h.01|M20 11h.01'],
 ['eraser','Eraser','e','M20 20H9l-5.3-5.3a1 1 0 010-1.4l9-9a1 1 0 011.4 0l5.6 5.6a1 1 0 010 1.4L11 20|M7 12l6 6'],
 ['fill','Fill','f','M19 11l-8-8-8.6 8.6a2 2 0 000 2.8l5.2 5.2c.8.8 2 .8 2.8 0z|M5 2l5 5|M2 13h15|M22 20a2 2 0 11-4 0c0-1.1 2-4 2-4s2 2.9 2 4z'],
 ['picker','Color picker','i','M2 22l1-1h3l9-9|M3 21v-3l9-9|M15 6l3.4-3.4a2.1 2.1 0 113 3L18 9l.4.4a2.1 2.1 0 11-3 3l-3.8-3.8a2.1 2.1 0 113-3z'],
 ['line','Line','l','M5 19L19 5'],
 ['rect','Rectangle','r','M4 5h16v14H4z'],
 ['ellipse','Ellipse','o','M3 12a9 6 0 1018 0 9 6 0 10-18 0']
];
const PAL=['#1a1a1a','#7c7c78','#e5484d','#f76b15','#f5b800','#30a46c','#12a594','#0091ff','#6e56cf','#e93d82','#8b5e3c','#ffffff'];
let tool='pencil',prev='pencil',color='#1a1a1a',size=4;

$('tools').innerHTML=TOOLS.map(t=>`<button class="b" data-t="${t[0]}" title="${t[1]} (${t[2].toUpperCase()})" aria-label="${t[1]}">${ic(t[3])}</button>`).join('');
$('colors').innerHTML=PAL.map(c=>`<button class="sw" data-c="${c}" style="background:${c}" title="${c}" aria-label="Color ${c}"></button>`).join('')+'<input class="cc" id="cc" type="color" value="#1a1a1a" title="Custom color" aria-label="Custom color">';
$('acts').innerHTML=[['undo','Undo (Ctrl+Z)','M3 7v6h6|M21 17a9 9 0 00-15-6.7L3 13'],['redo','Redo (Ctrl+Shift+Z)','M21 7v6h-6|M3 17a9 9 0 0115-6.7L21 13'],['clear','Clear paper','M3 6h18|M8 6V4h8v2|M19 6l-1 14H6L5 6'],['save','Save as PNG (Ctrl+S)','M12 3v12|M7 10l5 5 5-5|M4 21h16']].map(a=>`<button class="b" id="${a[0]}" title="${a[1]}" aria-label="${a[1]}">${ic(a[2])}</button>`).join('');

function setTool(t){
  if(t!==tool)prev=tool;
  tool=t;cur.style.display='none';
  [...$('tools').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  cv.style.cursor=(t==='fill'||t==='picker')?'crosshair':'none';
}
function setColor(c){
  color=c.toLowerCase();$('cc').value=color;
  [...$('colors').querySelectorAll('.sw')].forEach(b=>b.classList.toggle('on',b.dataset.c===color));
}
function setSize(n){size=Math.max(1,Math.min(60,n));$('size').value=size;$('sv').textContent=size}
$('tools').onclick=e=>{const b=e.target.closest('button');if(b)setTool(b.dataset.t)};
$('colors').onclick=e=>{const b=e.target.closest('.sw');if(b)setColor(b.dataset.c)};
$('cc').oninput=e=>setColor(e.target.value);
$('size').oninput=e=>setSize(+e.target.value);

/* history */
let hist=[ctx.getImageData(0,0,W,H)],redo=[];
function sync(){$('undo').disabled=hist.length<2;$('redo').disabled=!redo.length}
function commit(){hist.push(ctx.getImageData(0,0,W,H));if(hist.length>20)hist.shift();redo.length=0;sync()}
function undo(){if(hist.length>1){redo.push(hist.pop());ctx.putImageData(hist[hist.length-1],0,0);sync()}}
function redoF(){if(redo.length){const s=redo.pop();hist.push(s);ctx.putImageData(s,0,0);sync()}}
$('undo').onclick=undo;$('redo').onclick=redoF;
$('clear').onclick=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);commit()};

/* drawing */
let down=false,pts,base,last,lm,start,timer,pe;
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
const w=()=>({marker:2.5,eraser:3,spray:5}[tool]||1)*size;
const wd=e=>w()*((pe&&(tool==='pencil'||tool==='brush'))?.2+(e.pressure||.5)*1.2:1);
function style(){
  ctx.lineCap=ctx.lineJoin='round';
  ctx.strokeStyle=ctx.fillStyle=tool==='eraser'?'#fff':color;
  ctx.globalAlpha=tool==='marker'?.35:1;
  ctx.shadowColor=color;ctx.shadowBlur=tool==='brush'?size*.8:0;
}
function smooth(){
  ctx.lineWidth=w();ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}
  const l=pts[pts.length-1];ctx.lineTo(l[0],l[1]);ctx.stroke();
}
function shape(p){
  ctx.lineWidth=size;ctx.beginPath();const a=start[0],b=start[1],x=p[0],y=p[1];
  if(tool==='line'){ctx.moveTo(a,b);ctx.lineTo(x,y)}
  else if(tool==='rect')ctx.rect(a,b,x-a,y-b);
  else ctx.ellipse((a+x)/2,(b+y)/2,Math.abs(x-a)/2,Math.abs(y-b)/2,0,0,7);
  ctx.stroke();
}
function spray(p){
  ctx.fillStyle=color;const r=w()/2;
  for(let i=0;i<14;i++){const a=Math.random()*6.283,d=r*Math.sqrt(Math.random());ctx.fillRect(p[0]+Math.cos(a)*d,p[1]+Math.sin(a)*d,1.4,1.4)}
}
function flood(p){
  const sx=p[0]|0,sy=p[1]|0,img=ctx.getImageData(0,0,W,H),d=img.data;
  const c=[1,3,5].map(i=>parseInt(color.substr(i,2),16)),i0=(sy*W+sx)*4,t=[d[i0],d[i0+1],d[i0+2]];
  if(t[0]===c[0]&&t[1]===c[1]&&t[2]===c[2])return;
  const seen=new Uint8Array(W*H),st=[sy*W+sx];
  while(st.length){
    const n=st.pop();if(seen[n])continue;seen[n]=1;const i=n*4;
    if(Math.abs(d[i]-t[0])+Math.abs(d[i+1]-t[1])+Math.abs(d[i+2]-t[2])>60)continue;
    d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;
    const x=n%W;if(x>0)st.push(n-1);if(x<W-1)st.push(n+1);if(n>=W)st.push(n-W);if(n<W*H-W)st.push(n+W);
  }
  ctx.putImageData(img,0,0);
}
function pick(p){
  const d=ctx.getImageData(p[0]|0,p[1]|0,1,1).data;
  setColor('#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join(''));setTool(prev);
}
function step(ev){
  const p=pos(ev);
  if(tool==='spray'){spray(p);last=p;return}
  if(tool==='marker'){pts.push(p);ctx.putImageData(base,0,0);smooth();return}
  if(tool==='line'||tool==='rect'||tool==='ellipse'){ctx.putImageData(base,0,0);shape(p);return}
  const m=[(last[0]+p[0])/2,(last[1]+p[1])/2];
  ctx.lineWidth=wd(ev);ctx.beginPath();ctx.moveTo(lm[0],lm[1]);ctx.quadraticCurveTo(last[0],last[1],m[0],m[1]);ctx.stroke();
  lm=m;last=p;
}
cv.onpointerdown=e=>{
  if(e.button>0)return;e.preventDefault();cv.setPointerCapture(e.pointerId);
  const p=pos(e);
  if(tool==='picker'){pick(p);return}
  if(tool==='fill'){flood(p);commit();return}
  down=true;start=last=lm=p;pts=[p];pe=e.pointerType==='pen';
  if(tool==='marker'||tool==='line'||tool==='rect'||tool==='ellipse')base=ctx.getImageData(0,0,W,H);
  style();
  if(tool==='spray'){spray(p);timer=setInterval(()=>spray(last),30)}
  else if(tool==='marker')smooth();
  else if(tool==='pencil'||tool==='brush'||tool==='eraser'){ctx.beginPath();ctx.arc(p[0],p[1],wd(e)/2,0,7);ctx.fill()}
};
cv.onpointermove=e=>{
  if(e.pointerType!=='touch'&&tool!=='fill'&&tool!=='picker'){
    const d=Math.max(w()*cv.getBoundingClientRect().width/W,6);
    cur.style.display='block';cur.style.width=cur.style.height=d+'px';
    cur.style.transform=`translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
  }
  if(!down)return;
  for(const ev of(e.getCoalescedEvents?e.getCoalescedEvents():[e]))step(ev);
};
const end=()=>{if(!down)return;down=false;clearInterval(timer);ctx.globalAlpha=1;ctx.shadowBlur=0;base=null;commit()};
cv.onpointerup=cv.onpointercancel=end;
cv.onpointerleave=()=>{cur.style.display='none'};

/* save */
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
async function save(){
  cv.toBlob(async b=>{
    if(window.claude&&claude.use){
      const dl=await claude.use('downloads');
      if(!dl){toast('Saving isn’t available in this view');return}
      try{await dl.save({filename:'drawing.png',data:b});toast('Saved')}
      catch(e){if(e&&e.code!=='declined')toast('Couldn’t save the image')}
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='drawing.png';a.click();
    }
  },'image/png');
}
$('save').onclick=save;

/* keyboard */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(e.ctrlKey||e.metaKey){
    if(k==='z'){e.preventDefault();e.shiftKey?redoF():undo()}
    else if(k==='y'){e.preventDefault();redoF()}
    else if(k==='s'){e.preventDefault();save()}
    return;
  }
  const t=TOOLS.find(t=>t[2]===k);
  if(t)setTool(t[0]);else if(k==='[')setSize(size-2);else if(k===']')setSize(size+2);
});

/* layout */
function fit(){
  const k=Math.min((stage.clientWidth-32)/W,(stage.clientHeight-32)/H,1);
  cv.style.width=W*k+'px';cv.style.height=H*k+'px';
}
new ResizeObserver(fit).observe(stage);fit();
setTool('pencil');setColor('#1a1a1a');sync();
</script>
</body>
</html>
