<div style="background:#0a0e0d;border-radius:12px;padding:0;overflow:hidden;border:0.5px solid #1a3a2e;">

<div style="width:9px;height:9px;border-radius:50%;background:#2a3a35;"></div>

<div style="width:9px;height:9px;border-radius:50%;background:#2a3a35;"></div>

</div>
</div>
<style>
.face{position:absolute;width:180px;height:180px;background:rgba(20,60,50,0.08);border:1px solid #4adfae;box-shadow:0 0 12px rgba(74,223,174,0.25) inset,0 0 8px rgba(74,223,174,0.15);}
@keyframes spin{
0%{transform:rotateX(0deg) rotateY(0deg) rotateZ(0deg);}
100%{transform:rotateX(360deg) rotateY(360deg) rotateZ(180deg);}
}
</style>
<script>
(function(){
var sf=document.getElementById('starfield');
for(var i=0;i<40;i++){

}
})();
</script>
