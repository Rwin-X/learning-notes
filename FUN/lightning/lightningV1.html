<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lightning Strike 3D</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070c;
    font-family: Arial, sans-serif;
  }
  #canvas-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    color: rgba(200, 210, 230, 0.55);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    pointer-events: none;
    line-height: 1.6;
  }
  #hud .label {
    color: rgba(150, 170, 210, 0.4);
  }
  #flash-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #dcd6ff;
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
  }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="hud">
  <div><span class="label">STATUS</span> CHARGE BUILDING</div>
  <div><span class="label">NEXT STRIKE</span> <span id="timer">--</span></div>
</div>
<div id="flash-overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  "use strict";

  // ---------- Scene / Camera / Renderer ----------
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0e18, 0.012);

  const camera = new THREE.PerspectiveCamera(
    50, window.innerWidth / window.innerHeight, 0.1, 2000
  );
  camera.position.set(0, 95, 155);
  camera.lookAt(0, 95, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  container.appendChild(renderer.domElement);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- Sky (dark cloudy gradient) ----------
  const skyGeo = new THREE.SphereGeometry(900, 32, 32);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      topColor: { value: new THREE.Color(0x0c1220) },
      bottomColor: { value: new THREE.Color(0x1a2030) },
      offset: { value: 80 },
      exponent: { value: 0.6 }
    },
    vertexShader: `
      varying vec3 vWorldPosition;
      void main() {
        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPosition.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 topColor;
      uniform vec3 bottomColor;
      uniform float offset;
      uniform float exponent;
      varying vec3 vWorldPosition;
      void main() {
        float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
        gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
      }
    `
  });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);

  // Drifting cloud layers (soft planes with noise-like texture via sprites)
  function makeCloudTexture() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 128;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 512, 128);
    for (let i = 0; i < 40; i++) {
      const x = Math.random() * 512;
      const y = Math.random() * 128;
      const r = 30 + Math.random() * 70;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, 'rgba(120,130,150,0.25)');
      grad.addColorStop(1, 'rgba(120,130,150,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    return new THREE.CanvasTexture(c);
  }
  const cloudTex = makeCloudTexture();
  const cloudLayers = [];
  for (let i = 0; i < 5; i++) {
    const geo = new THREE.PlaneGeometry(1400, 200);
    const mat = new THREE.MeshBasicMaterial({
      map: cloudTex,
      transparent: true,
      opacity: 0.5,
      depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, 180 + i * 25, -300 - i * 40);
    mesh.userData.speed = 2 + Math.random() * 3;
    scene.add(mesh);
    cloudLayers.push(mesh);
  }

  // ---------- Ground / rock silhouette ----------
  const groundGeo = new THREE.PlaneGeometry(2000, 2000, 1, 1);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x05060a, roughness: 1 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -20;
  scene.add(ground);

  // Simple rocky hill silhouette (low-poly cone cluster) as strike target
  const rockGroup = new THREE.Group();
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x0a0c12, roughness: 0.95, flatShading: true });

  function makeRock(x, z, radius, height) {
    const geo = new THREE.ConeGeometry(radius, height, 6 + Math.floor(Math.random() * 3));
    // jitter vertices for a rough rock look
    const posAttr = geo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const vx = posAttr.getX(i);
      const vy = posAttr.getY(i);
      const vz = posAttr.getZ(i);
      const jitter = (Math.random() - 0.5) * radius * 0.15;
      posAttr.setXYZ(i, vx + jitter, vy, vz + jitter);
    }
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, rockMat);
    mesh.position.set(x, -20 + height / 2, z);
    mesh.rotation.y = Math.random() * Math.PI;
    return mesh;
  }

  rockGroup.add(makeRock(0, 0, 55, 46));
  rockGroup.add(makeRock(-40, -15, 30, 26));
  rockGroup.add(makeRock(38, -10, 26, 22));
  rockGroup.add(makeRock(10, 30, 22, 18));
  scene.add(rockGroup);

  // Strike point sits at the tip of the main rock
  const strikeTarget = new THREE.Vector3(0, 3, 0);
  const strikeOrigin = new THREE.Vector3(4, 260, -10);

  // ---------- Lightning bolt geometry generator ----------
  // Builds a jagged main path from origin to target, then recursively spawns
  // shorter branch segments off random points along parent segments.

  function subdivide(points, displaceScale, minSeg, jitterIterations) {
    // Midpoint displacement to add jaggedness. Uses sharper, less smoothed
    // perpendicular kicks so segments look like real electrical breakdown
    // (abrupt zig-zags) rather than a smooth wavy curve.
    let pts = points.slice();
    let iterations = jitterIterations || 5;
    for (let it = 0; it < iterations; it++) {
      const newPts = [pts[0]];
      const scale = displaceScale * Math.pow(0.58, it);
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i];
        const b = pts[i + 1];
        if (a.distanceTo(b) > minSeg) {
          const mid = a.clone().lerp(b, 0.35 + Math.random() * 0.3); // off-center split, less uniform
          const perp = new THREE.Vector3(
            (Math.random() - 0.5),
            (Math.random() - 0.5) * 0.35,
            (Math.random() - 0.5)
          ).normalize().multiplyScalar((Math.random() - 0.5) * scale * 2.2);
          mid.add(perp);
          newPts.push(mid);
        }
        newPts.push(b);
      }
      pts = newPts;
    }
    return pts;
  }

  // Recursive fractal branch generator. Each segment can itself spawn
  // further child branches up to maxDepth, so branches sprout sub-branches
  // the way real dielectric-breakdown lightning does.
  function spawnBranches(allSegments, parentPts, depth, maxDepth, seedDisplace, energy) {
    if (depth > maxDepth || parentPts.length < 3) return;

    // number of branches decreases with depth but stays very dense
    const baseCounts = [0, 16, 10, 6, 3]; // indexed by depth (depth 0 handled by caller)
    const count = (baseCounts[depth] || 2) + Math.floor(Math.random() * 4);

    for (let b = 0; b < count; b++) {
      // avoid spawning right at the very tip/start
      const tRange = depth === 1 ? [0.05, 0.9] : [0.12, 0.92];
      const idx = Math.floor(THREE.MathUtils.randFloat(tRange[0], tRange[1]) * (parentPts.length - 2)) + 1;
      const startPt = parentPts[idx].clone();

      // direction: mostly continues downward/outward, angle widens with depth
      const spread = 1.0 + depth * 0.55;
      const dir = new THREE.Vector3(
        (Math.random() - 0.5) * spread,
        -1 - Math.random() * 0.5,
        (Math.random() - 0.5) * spread
      ).normalize();

      const lengthFalloff = Math.pow(0.58, depth - 1);
      const length = THREE.MathUtils.randFloat(16, 50) * lengthFalloff * (1 - idx / parentPts.length * 0.4);
      const endPt = startPt.clone().add(dir.multiplyScalar(length));

      const childDisplace = seedDisplace * (0.48 - depth * 0.07);
      const childPts = subdivide([startPt, endPt], Math.max(childDisplace, 1.2), 4, 5 - depth);

      allSegments.push({
        points: childPts,
        isMain: false,
        depth: depth,
        energy: energy * 0.6
      });

      // recurse: this branch may itself sprout smaller branches
      if (Math.random() > 0.08) {
        spawnBranches(allSegments, childPts, depth + 1, maxDepth, seedDisplace, energy * 0.6);
      }
    }
  }

  function generateBoltPaths(origin, target, seedDisplace) {
    // main path - the primary return stroke channel
    const basePts = [origin.clone(), target.clone()];
    const mainPath = subdivide(basePts, seedDisplace, 7, 6);

    const allSegments = []; // list of {points, isMain, depth, energy}
    allSegments.push({ points: mainPath, isMain: true, depth: 0, energy: 1 });

    // Recursively spawn branches off the main channel, and let those
    // branches spawn their own sub-branches (depth up to 4) for a very
    // dense, fractal, naturalistic look matching the reference photo.
    spawnBranches(allSegments, mainPath, 1, 4, seedDisplace, 1);

    return allSegments;
  }

  // Build a tube-like mesh (thin cylinders along path) for a bolt segment,
  // using additive-blended emissive material for glow. Thickness tapers
  // with branch depth so the main channel reads as the dominant conductor
  // and deep sub-branches read as fine hair-like forks, like the reference.
  function buildBoltMesh(segments) {
    const group = new THREE.Group();

    segments.forEach(seg => {
      const pts = seg.points;
      if (pts.length < 2) return;

      const depth = seg.depth || 0;
      const curve = new THREE.CatmullRomCurve3(pts);
      const tubeRadius = seg.isMain ? 0.55 : Math.max(0.34 - depth * 0.08, 0.06);
      const tubularSeg = Math.max(pts.length * 3, 8);
      const radialSeg = seg.isMain ? 6 : 4;
      const geo = new THREE.TubeGeometry(curve, tubularSeg, tubeRadius, radialSeg, false);
      const coreColor = seg.isMain ? 0xffffff : (depth <= 1 ? 0xf3edff : 0xe4d8ff);
      const mat = new THREE.MeshBasicMaterial({
        color: coreColor,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.userData.layer = 'core';
      group.add(mesh);

      // Two-layer glow halo around every segment: a tighter violet inner
      // glow and a wider, softer outer corona, so the bolt reads with the
      // same rich purple bloom as the reference photo.
      {
        const glowScale = seg.isMain ? 3.2 : 3.6;
        const glowGeo = new THREE.TubeGeometry(curve, tubularSeg, tubeRadius * glowScale, radialSeg, false);
        const glowMat = new THREE.MeshBasicMaterial({
          color: 0xa78bff,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const glowMesh = new THREE.Mesh(glowGeo, glowMat);
        glowMesh.userData.layer = 'glow';
        group.add(glowMesh);
        mesh.userData.glowPeer = glowMesh;

        const outerScale = seg.isMain ? 6.5 : 6.0;
        const outerGeo = new THREE.TubeGeometry(curve, Math.max(Math.floor(tubularSeg * 0.5), 6), tubeRadius * outerScale, 4, false);
        const outerMat = new THREE.MeshBasicMaterial({
          color: 0x6a4fd8,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const outerMesh = new THREE.Mesh(outerGeo, outerMat);
        outerMesh.userData.layer = 'outerGlow';
        group.add(outerMesh);
        mesh.userData.outerGlowPeer = outerMesh;
      }
    });

    return group;
  }

  // ---------- Strike light + impact glow ----------
  const strikeLight = new THREE.PointLight(0xb9aeff, 0, 500, 1.6);
  strikeLight.position.copy(strikeTarget);
  scene.add(strikeLight);

  const skyFlashLight = new THREE.PointLight(0xc9c2ff, 0, 900, 1.2);
  skyFlashLight.position.set(0, 200, 0);
  scene.add(skyFlashLight);

  const ambient = new THREE.AmbientLight(0x1a2030, 0.9);
  scene.add(ambient);

  // Impact glow disc on ground
  const impactGeo = new THREE.CircleGeometry(1, 32);
  const impactMat = new THREE.MeshBasicMaterial({
    color: 0xcfc6ff,
    transparent: true,
    opacity: 0,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const impactDisc = new THREE.Mesh(impactGeo, impactMat);
  impactDisc.rotation.x = -Math.PI / 2;
  impactDisc.position.set(strikeTarget.x, -19.5, strikeTarget.z);
  scene.add(impactDisc);

  // Flash overlay element (full-screen white flash)
  const flashOverlay = document.getElementById('flash-overlay');
  const hudTimer = document.getElementById('timer');
  const hudStatus = document.querySelector('#hud div:first-child');

  // ---------- Animation state machine ----------
  // Phases: idle (waiting) -> forming (bolt draws in) -> flash (impact) -> fade -> idle
  let phase = 'idle';
  let phaseStart = performance.now();
  let currentBolt = null;
  let cycleDelay = 3.0; // seconds of "calm" between strikes

  const DURATIONS = {
    idle: 3.0,     // calm pause
    forming: 0.55, // slow, deliberate bolt draw-in
    hold: 0.32,    // full-bright hold with restrike flicker at moment of impact
    fade: 0.9      // fade out
  };

  function startNewBolt() {
    if (currentBolt) {
      scene.remove(currentBolt);
    }
    const segments = generateBoltPaths(strikeOrigin, strikeTarget, 20);
    currentBolt = buildBoltMesh(segments);
    scene.add(currentBolt);
    phase = 'forming';
    phaseStart = performance.now();
    hudStatus.innerHTML = '<span class="label">STATUS</span> DISCHARGE FORMING';
  }

  function triggerFlash(intensity) {
    flashOverlay.style.transition = 'opacity 0.03s linear';
    flashOverlay.style.opacity = intensity;
    setTimeout(() => {
      flashOverlay.style.transition = 'opacity 0.5s ease-out';
      flashOverlay.style.opacity = 0;
    }, 40);
  }

  function setBoltOpacity(t) {
    if (!currentBolt) return;
    currentBolt.children.forEach(mesh => {
      if (mesh.material) {
        const layer = mesh.userData.layer || 'core';
        if (layer === 'core') {
          mesh.material.opacity = t;
        } else if (layer === 'glow') {
          mesh.material.opacity = t * 0.55;
        } else if (layer === 'outerGlow') {
          mesh.material.opacity = t * 0.22;
        }
      }
    });
  }

  // Reveal bolt progressively (like it's forming downward) during 'forming',
  // then everything is lit at 'hold'.
  function setBoltReveal(progress) {
    // progress 0..1 maps to opacity ramp with slight flicker
    const flicker = 0.85 + Math.random() * 0.15;
    setBoltOpacity(Math.min(1, progress * 1.4) * flicker);
  }

  // ---------- Main loop ----------
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const elapsed = (now - phaseStart) / 1000;
    const dt = clock.getDelta();

    // drift clouds
    cloudLayers.forEach(layer => {
      layer.position.x += layer.userData.speed * dt;
      if (layer.position.x > 700) layer.position.x = -700;
    });

    // subtle camera breathing
    camera.position.x = Math.sin(now * 0.00006) * 8;
    camera.lookAt(0, 95, 0);

    if (phase === 'idle') {
      const remaining = Math.max(0, DURATIONS.idle - elapsed);
      hudTimer.textContent = remaining.toFixed(1) + 's';
      if (elapsed >= DURATIONS.idle) {
        startNewBolt();
      }
    } else if (phase === 'forming') {
      const t = Math.min(1, elapsed / DURATIONS.forming);
      // ease-in for a deliberate, gathering feel
      const eased = t * t * (3 - 2 * t);
      setBoltReveal(eased);
      strikeLight.intensity = eased * 4;
      hudTimer.textContent = 'FORMING';

      if (t >= 1) {
        phase = 'hold';
        phaseStart = now;
        hudStatus.innerHTML = '<span class="label">STATUS</span> IMPACT';
        // Big flash at the moment of contact
        triggerFlash(0.9);
        strikeLight.intensity = 16;
        skyFlashLight.intensity = 7;
        impactDisc.material.opacity = 1;
        impactDisc.scale.set(1, 1, 1);
        // schedule 1-2 rapid re-strike pulses (real lightning "restrikes"
        // along the same ionized channel in quick succession)
        currentBolt.userData.restrikes = [
          { at: DURATIONS.hold * 0.4, done: false },
          { at: DURATIONS.hold * 0.75, done: false }
        ];
      }
    } else if (phase === 'hold') {
      // base flicker plus occasional near-full dropout, like real ionized
      // channels which don't hold a perfectly steady brightness
      const dropout = Math.random() < 0.12;
      setBoltOpacity(dropout ? 0.55 : (0.9 + Math.random() * 0.1));

      // fire restrike pulses: quick extra brightness spikes + screen flash
      if (currentBolt && currentBolt.userData.restrikes) {
        currentBolt.userData.restrikes.forEach(r => {
          if (!r.done && elapsed >= r.at) {
            r.done = true;
            triggerFlash(0.5 + Math.random() * 0.25);
            strikeLight.intensity = 12 + Math.random() * 6;
          }
        });
      }

      // expanding impact ring
      const t = Math.min(1, elapsed / DURATIONS.hold);
      impactDisc.scale.setScalar(1 + t * 18);
      impactDisc.material.opacity = 1 - t * 0.3;
      if (!dropout) {
        strikeLight.intensity = 14 - t * 4;
      }

      if (elapsed >= DURATIONS.hold) {
        phase = 'fade';
        phaseStart = now;
        hudStatus.innerHTML = '<span class="label">STATUS</span> DISSIPATING';
      }
    } else if (phase === 'fade') {
      const t = Math.min(1, elapsed / DURATIONS.fade);
      const remain = 1 - t;
      // flicker while fading for realism
      const flicker = remain * (0.7 + Math.random() * 0.3);
      setBoltOpacity(flicker);
      strikeLight.intensity = 10 * remain * remain;
      skyFlashLight.intensity = 6 * remain * remain;
      impactDisc.material.opacity = Math.max(0, 0.7 * remain);

      if (t >= 1) {
        setBoltOpacity(0);
        strikeLight.intensity = 0;
        skyFlashLight.intensity = 0;
        impactDisc.material.opacity = 0;
        if (currentBolt) {
          scene.remove(currentBolt);
          currentBolt = null;
        }
        phase = 'idle';
        phaseStart = now;
        hudStatus.innerHTML = '<span class="label">STATUS</span> CHARGE BUILDING';
      }
    }

    renderer.render(scene, camera);
  }

  animate();
})();
</script>
</body>
</html>
