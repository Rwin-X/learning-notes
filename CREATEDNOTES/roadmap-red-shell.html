  },
  done: function (a) { var id = parseId(a[0]); if (!id) { print('usage: done <phase.item>, e.g. done 0.1', 'e'); return; } setDone(id[0], id[1], true); print('[x] ' + a[0] + '  ' + PHASES[id[0]].items[id[1]], 'm'); if (phaseCount(id[0]) === PHASES[id[0]].items.length) print('phase ' + id[0] + ' complete. exit: ' + PHASES[id[0]].exit, 'w'); refreshTop(); },
  undo: function (a) { var id = parseId(a[0]); if (!id) { print('usage: undo <phase.item>', 'e'); return; } setDone(id[0], id[1], false); print('[ ] ' + a[0] + '  ' + PHASES[id[0]].items[id[1]], 'm'); refreshTop(); },
  tracks: function () { TRACKS.forEach(function (r, k) { var d = print((k === 0 ? '> ' : '  ') + r[0] + '  //  ' + r[1] + '  //  ' + r[2] + '  //  '); r[3].forEach(function (l, n) { if (n) d.appendChild(document.createTextNode(', ')); d.appendChild(el('a', { href: l[1], target: '_blank', rel: 'noopener', text: l[0] })); }); }); print('opinion: start with Web / AppSec (marked >)', 'm'); },
  rules: function () { RULES.forEach(function (r) { print('> ' + r); }); },
  theme: function (a) { var ok = ['green', 'amber', 'cyan', 'ice', 'red', 'paper']; if (ok.indexOf(a[0]) < 0) { print('usage: theme <' + ok.join('|') + '>', 'e'); return; } setPhosphor(a[0], PKEY); print('phosphor ' + a[0], 'm'); },
  reset: function (a) { if (a[0] === 'confirm') { store = {}; save(); armed = false; print('progress cleared', 'w'); refreshTop(); } else { armed = true; print('this clears every tick. run: reset confirm', 'w'); } },
  clear: function () { out.replaceChildren(); }
};
function run(line) {
  var parts = line.trim().split(/\s+/), name = parts[0].toLowerCase(), args = parts.slice(1);
  if (!name) return Promise.resolve();
  print('ops@roadmap:~$ ' + line, 'c');
  return new Promise(function (ok) { if (!CMDS[name]) { print(name + ': command not found. try help', 'e'); ok(); return; } ok(CMDS[name](args)); })
    .catch(function (e) { print('error: ' + e.message, 'e'); });
}
$('form').addEventListener('submit', function (e) { e.preventDefault(); var v = inp.value; inp.value = ''; if (v.trim()) { hist.push(v); } hi = hist.length; run(v); });
inp.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowUp') { if (hi > 0) { hi--; inp.value = hist[hi]; } e.preventDefault(); }
  else if (e.key === 'ArrowDown') { if (hi < hist.length - 1) { hi++; inp.value = hist[hi]; } else { hi = hist.length; inp.value = ''; } e.preventDefault(); }
  else if (e.key === 'Tab') { var v = inp.value.trim(); if (v && v.indexOf(' ') < 0) { var m = Object.keys(CMDS).filter(function (k) { return k.indexOf(v) === 0; }); if (m.length === 1) inp.value = m[0] + ' '; } e.preventDefault(); }
});
['help', 'progress', 'next', 'phase 0', 'phase 1', 'phase 2', 'phase 3', 'phase 4', 'phase 5', 'tracks'].forEach(function (c) {
  var b = el('button', { class: 'btn', type: 'button', text: c }); b.addEventListener('click', function () { run(c); inp.focus(); }); $('quick').appendChild(b);
});
trackTable($('tracks')); rulesList($('rules'));
wirePhosphor('red', PKEY);
print('roadmap shell v1. type help for commands.', 'm');
CMDS.progress(); CMDS.next();
refreshTop();
scramble($('title'), 'ops@roadmap', 800);

})();
